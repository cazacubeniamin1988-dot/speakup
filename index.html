const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);

 for(const a of alts){const h=norm(a).split(' ').filter(Boolean).map(canon);const used=h.map(()=>false);
  const words=t.map(w=>{const cw=canon(w);for(let i=0;i<h.length;i++){if(!used[i]&&(h[i]===cw||sim(cw,h[i])>=(cw.length<=3?1:.8))){used[i]=true;return{w,ok:true}}}return{w,ok:false}});
  const score=words.filter(x=>x.ok).length/t.length;if(score>best.score)best={score,words,heard:a}}
 return best}

/* ================= VOCE ================= */
let voice=null,voices=[];
/* Cele mai naturale voci primesc scor mare; vocile „robot” sau de efect sunt scoase */
const BADV=/compact|eloquence|novelty|bells|bad news|bahh|boing|bubbles|cellos|whisper|zarvox|trinoids|albert|jester|organ|superstar|wobble|fred|junior|ralph|kathy|grandma|grandpa|rocko|shelley|flo\b|reed|sandy|espeak/i;
function vScore(v){let s=0;const n=v.name;
 if(/natural|neural/i.test(n))s+=60;if(/online/i.test(n))s+=20;if(/premium/i.test(n))s+=55;if(/enhanced|siri/i.test(n))s+=45;if(/google/i.test(n))s+=35;
 if(/ava|samantha|aria|jenny|guy|zoe|evan|nathan|allison|susan|serena|daniel|libby|sonia|ryan|michelle|emma|andrew|brian/i.test(n))s+=10;
 if(/en[-_]US/i.test(v.lang))s+=6;else if(/en[-_]GB/i.test(v.lang))s+=5;if(v.localService===false)s+=3;return s}
function loadVoices(){if(!('speechSynthesis' in window))return;voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!BADV.test(v.name)).sort((a,b)=>vScore(b)-vScore(a));voice=voices.find(v=>v.voiceURI===st.voice)||voices[0]||null}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function say(t,rate=.95){return new Promise(res=>{if(!('speechSynthesis' in window))return res();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:'en-US';if(voice)u.voice=voice;u.rate=Math.max(.5,Math.min(1.3,rate*(st.rate||1)));u.pitch=1;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
async function sayAll(lines,rate=.95){for(const l of lines){await say(l,rate);await new Promise(r=>setTimeout(r,450))}}
const stopVoice=()=>{try{speechSynthesis.cancel()}catch(e){}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micState=SR?'unknown':'none';
function listen(){return new Promise((res,rej)=>{if(!SR)return rej('nosupport');let r;try{r=new SR()}catch(e){return rej('nosupport')}r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;let done=false;
 r.onresult=e=>{done=true;micState='ok';const alts=[...e.results[0]].map(a=>a.transcript);alts.conf=e.results[0][0].confidence||0;res(alts)};r.onerror=e=>{done=true;rej(e.error)};r.onend=()=>{if(!done)rej('no-speech')};try{r.start()}catch(e){rej('not-allowed')}})}

/* Widget pronunție: nu trece mai departe până nu e corect */
function pron(el,target,{onPass,hideText=false,hint=''}={}){
 let tries=0,passed=false;const words=norm(target).split(' ').length;
 el.innerHTML=`<div class="pron">
  <div class="pron-target ${hideText?'hid':''}">${hideText?esc(hint):esc(target)}</div>
  <div class="pron-btns"><button class="btn ghost" data-a="play">${IC.spk} Ascultă</button><button class="btn ghost" data-a="slow">${IC.slow} Rar</button></div>
  <button class="mic" data-a="mic" aria-label="Pronunță">${IC.mic}</button>
  <div class="mic-l">Apasă și spune în engleză</div>
  <div class="pron-res" aria-live="polite"></div></div>`;
 const res=el.querySelector('.pron-res'),mic=el.querySelector('.mic'),lab=el.querySelector('.mic-l');
 el.querySelector('[data-a=play]').onclick=()=>say(target);
 el.querySelector('[data-a=slow]').onclick=()=>say(target,.6);
 const need=words===1?1:.85;
 function judge(alts,mode='mic'){
  /* Strict: contează doar prima variantă auzită, nu alternativele; claritatea sub 55% nu trece */
  const top=[alts[0]||''];const r=scoreSpeech(target,top);tries++;
  const conf=alts.conf||0;const unclear=mode==='mic'&&conf>0&&conf<.55&&r.score>=need;
  const pass=r.score>=need&&!unclear;
  res.innerHTML=`<div class="heard">Am auzit: „${esc(r.heard||'…')}”${mode==='mic'&&conf>0?` · claritate ${Math.round(conf*100)}%`:''}</div>
   ${hideText&&!pass?'':`<div class="wchips">${r.words.map(w=>`<span class="wchip ${w.ok?'ok':'bad'}">${esc(w.w)}</span>`).join('')}</div>`}
   <div class="verdict ${pass?'ok':'bad'}">${pass?'Corect! '+Math.round(r.score*100)+'%':unclear?'Cuvintele sunt bune, dar pronunția nu e destul de clară. Mai spune o dată, mai rar.':'Încă nu. '+Math.round(r.score*100)+'% — ascultă din nou și repetă.'}</div>
   ${mode==='kb'?'<div class="small muted">Verificare aproximativă: tastatura corectează singură cuvintele, deci e mai îngăduitoare decât microfonul aplicației.</div>':''}`;
  if(pass&&!passed){passed=true;st.pron=(st.pron||0)+1;addXP(2);onPass&&onPass()}
  else if(!pass&&tries>=5){const b=document.createElement('button');b.className='linkbtn';b.textContent='Treci peste (revii la el mai târziu)';b.onclick=()=>{if(!passed){passed=true;onPass&&onPass(true)}};res.appendChild(b)}
 }
 function typed(){
  res.innerHTML=`<div class="note">În fereastra din Claude aplicația nu are voie să folosească microfonul. Pentru verificarea reală a pronunției, deschide aplicația în Chrome (vezi <b>Progres → Microfon și voce</b>). Până atunci: apasă în câmp, apoi pe <b>microfonul tastaturii</b> (setată pe engleză) și spune textul.</div>
   <form class="typef"><input type="text" id="dict-${Math.random().toString(36).slice(2,8)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Dictează aici"><button class="btn">Verifică</button></form>`;
  const f=res.querySelector('form');f.onsubmit=e=>{e.preventDefault();const v=f.querySelector('input').value;if(!v.trim())return;judge([v],'kb');if(!passed){const again=document.createElement('button');again.className='linkbtn';again.textContent='Încearcă din nou';again.onclick=typed;res.appendChild(again)}}
 }
 mic.onclick=async()=>{
  if(micState==='blocked'||micState==='none'){typed();return}
  stopVoice();mic.classList.add('on');lab.textContent='Te ascult…';
  try{const alts=await listen();mic.classList.remove('on');lab.textContent='Apasă și spune în engleză';judge(alts)}
  catch(err){mic.classList.remove('on');lab.textContent='Apasă și spune în engleză';
   if(['not-allowed','service-not-allowed','nosupport','audio-capture','network'].includes(err)){micState='blocked';typed()}
   else res.innerHTML='<div class="verdict bad">Nu te-am auzit. Apasă din nou și vorbește clar, aproape de telefon.</div>'}
 };
}

/* Chestionar generic */
function mc(prompt,correct,others,extra={}){const o=shuffle([correct,...others]);return{type:'mc',prompt,options:o,answer:o.indexOf(correct),...extra}}
function distract(w,n=3,field='ro'){const key=x=>x.tp||x.lv;const same=shuffle(ALLW.filter(x=>x[field]!==w[field]&&key(x)===key(w)));const rest=shuffle(ALLW.filter(x=>x[field]!==w[field]&&key(x)!==key(w)));const out=[];for(const x of [...same,...rest]){if(out.length>=n)break;if(!out.includes(x[field]))out.push(x[field])}return out}
function qWord(w,mode){
 if(mode==='listen')return mc('Ce ai auzit? Alege traducerea.',w.ro,distract(w),{audio:w.en,kind:'Ascultare'});
 if(mode==='type')return{type:'type',kind:'Scriere',prompt:`Scrie în engleză: <b>${esc(w.ro)}</b>`,answer:w.en,sayAfter:w.en};
 if(mode==='en2roType')return{type:'typeRo',kind:'Traducere',prompt:`Scrie în română ce înseamnă <b>${esc(w.en)}</b>`,answer:w.ro,sayAfter:w.en};
 if(mode==='pron')return{type:'pron',kind:'Pronunție',prompt:`Pronunță corect: <b>${esc(w.en)}</b><div class="small muted">${esc(w.ro)}</div>`,target:w.en};
 if(mode==='dict')return{type:'type',kind:'Dictare',prompt:'Scrie ce auzi.',audio:w.en,answer:w.en,sayAfter:w.en};
 if(mode==='ro2en')return mc(`Cum se spune în engleză <b>${esc(w.ro)}</b>?`,w.en,distract(w,3,'en'),{sayAfter:w.en,kind:'Traducere'});
 return mc(`Ce înseamnă <b>${esc(w.en)}</b>?`,w.ro,distract(w),{sayAfter:w.en,kind:'Traducere'});
}
/* Test amestecat: traducere, scriere, traducere scrisă, pronunție, ascultare */
function mixQs(words,modes=['en2ro','type','en2roType','pron','listen','ro2en']){const ws=shuffle(words);return ws.map((w,i)=>qWord(w,modes[i%modes.length]))}
/* Verificarea răspunsurilor: engleza scrisă strict, româna fără diacritice și cu mici greșeli de tastare */
const fold=x=>String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function roVariants(ro){const out=new Set([fold(ro)]);for(const b of ro.split(/[;,]/).map(x=>x.trim()).filter(Boolean)){out.add(fold(b));out.add(fold(b.replace(/\(.*?\)/g,'')));const inner=b.match(/\((.*?)\)/);if(inner)out.add(fold(inner[1]))}return[...out].filter(Boolean).map(x=>x.replace(/^(a |a se |a-si |a-si )/,''))}
function okRo(v,ro){const f=fold(v).replace(/^(a |a se )/,'');if(!f)return false;return roVariants(ro).some(y=>y===f||(y.length>4&&sim(y,f)>=.85))}
function isOkQ(q,a){if(a==null)return false;if(q.type==='type')return norm(a)===norm(q.answer);if(q.type==='typeRo')return okRo(a,q.answer);if(q.type==='pron')return a===true;return a===q.answer}
const correctText=q=>q.type==='pron'?q.target:(q.type==='type'||q.type==='typeRo')?q.answer:q.options[q.answer];
/* Mod test: fără indicii, cu „Înapoi”, scor calculat la final */
function runTest(host,qs,onDone){
 let i=0;const ans=qs.map(()=>null);
 const isOk=isOkQ;
 function step(){
  const q=qs[i],a=ans[i],last=i===qs.length-1;
  host.innerHTML=`<div class="prog"><span style="width:${i/qs.length*100}%"></span></div>
   <div class="qn">Întrebarea ${i+1} din ${qs.length}</div>
   ${q.audio?`<div><button class="btn ghost" data-a="aud">${IC.spk} Ascultă din nou</button></div>`:''}
   <div class="qp">${q.prompt}</div>
   ${q.type==='type'?`<form class="typef"><input type="text" id="tt${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scrie în engleză"><button class="btn">${last?'Termină':'Mai departe'}</button></form>`
     :`<div class="opts">${q.options.map((o,k)=>`<button class="opt ${a===k?'mine':''}" data-k="${k}">${esc(o)}</button>`).join('')}</div>`}
   <div class="tnav">${i>0?`<button class="btn ghost" data-a="prev">← Înapoi</button>`:'<span></span>'}${a!=null&&!last?`<button class="btn ghost" data-a="next">Înainte →</button>`:''}</div>
   ${last&&ans.every(x=>x!=null)?`<button class="btn wide" data-a="end">Vezi rezultatul</button>`:''}`;
  if(q.audio){host.querySelector('[data-a=aud]').onclick=()=>say(q.audio);if(a==null)setTimeout(()=>say(q.audio),250)}
  const pv=host.querySelector('[data-a=prev]');if(pv)pv.onclick=()=>{stopVoice();i--;step()};
  const nx=host.querySelector('[data-a=next]');if(nx)nx.onclick=()=>{stopVoice();i++;step()};
  const en=host.querySelector('[data-a=end]');if(en)en.onclick=finish;
  const advance=()=>{stopVoice();if(last){if(ans.every(x=>x!=null))finish();else{i=ans.findIndex(x=>x==null);step()}}else{i++;step()}};
  if(q.type==='type'){const f=host.querySelector('form'),inp=f.querySelector('input');if(a!=null)inp.value=a;setTimeout(()=>inp.focus(),60);
   f.onsubmit=e=>{e.preventDefault();if(!inp.value.trim())return;ans[i]=inp.value.trim();advance()}}
  else host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;host.querySelectorAll('.opt').forEach(x=>x.classList.toggle('mine',x===b));b.blur();setTimeout(advance,200)});
 }
 function finish(){
  let score=0;const wrong=[];qs.forEach((q,k)=>{if(isOk(q,ans[k]))score++;else wrong.push(q)});
  onDone(score,wrong,reviewHTML(qs,ans,isOk));
 }
 step();
}
function reviewHTML(qs,ans,isOk){
 const txt=(q,a)=>a==null?'—':q.type==='pron'?(a?'pronunțat corect':'nu a ieșit'):(q.type==='type'||q.type==='typeRo')?a:q.options[a];
 return `<div class="card"><h3>Răspunsurile tale</h3><div class="rev">${qs.map((q,k)=>{const ok=isOk(q,ans[k]);
  return `<div class="ri ${ok?'ok':'bad'}"><div class="rn">${k+1}. ${ok?'✓':'✗'}</div><div class="rb">${q.kind?`<div class="eyebrow">${q.kind}</div>`:''}<div class="rq">${q.prompt}${q.audio?`<div class="small muted">Ai auzit: „${esc(q.audio)}”</div>`:''}</div>
   ${ok?`<div class="ra ok">${esc(correctText(q))}</div>`:`<div class="ra bad">Tu: ${esc(txt(q,ans[k]))}</div><div class="ra ok">Corect: ${esc(correctText(q))}</div>`}</div></div>`}).join('')}</div></div>`;
}
function runQuiz(host,qs,onDone,{feedback=true}={}){
 if(!feedback)return runTest(host,qs,onDone);
 /* Mod exercițiu: răspunsul corect apare imediat (verde/roșu), fără întoarcere */
 let i=0;const ans=qs.map(()=>null);
 function step(){
  if(i>=qs.length){let score=0;const wrong=[];qs.forEach((q,k)=>{if(isOkQ(q,ans[k]))score++;else wrong.push(q)});onDone(score,wrong,reviewHTML(qs,ans,isOkQ));return}
  const q=qs[i];const typed=q.type==='type'||q.type==='typeRo';
  host.innerHTML=`<div class="prog"><span style="width:${i/qs.length*100}%"></span></div>
   <div class="row" style="justify-content:space-between"><span class="qn">Întrebarea ${i+1} din ${qs.length}</span>${q.kind?`<span class="lv">${q.kind}</span>`:''}</div>
   ${q.audio?`<div><button class="btn ghost" data-a="aud">${IC.spk} Ascultă din nou</button></div>`:''}
   <div class="qp">${q.prompt}</div>
   ${typed?`<form class="typef"><input type="text" id="qt${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.type==='typeRo'?'Scrie în română':'Scrie în engleză'}"><button class="btn">Verifică</button></form>`
     :q.type==='pron'?`<div id="qpron"></div><button class="linkbtn" data-a="giveup">Nu reușesc acum, mai departe</button>`
     :`<div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`}
   <div class="fb" aria-live="polite"></div>`;
  if(q.audio){host.querySelector('[data-a=aud]').onclick=()=>say(q.audio);setTimeout(()=>say(q.audio),250)}
  const fb=host.querySelector('.fb');let done=false;
  const finish=a=>{if(done)return;done=true;ans[i]=a;const ok=isOkQ(q,a);const ct=correctText(q);
   fb.innerHTML=`<div class="verdict ${ok?'ok':'bad'}">${ok?'Corect!':'Greșit'}</div>
    ${typed?(ok?`<div class="ra ok">${esc(a)}${norm(a)!==norm(ct)?' · forma completă: '+esc(ct):''}</div>`:`<div class="ra bad">Tu: ${esc(a)}</div><div class="ra ok">Corect: ${esc(ct)}</div>`):''}
    ${q.type==='pron'&&!ok?`<div class="ra ok">Corect: ${esc(ct)}</div>`:''}
    <button class="btn wide" data-a="next">${i+1<qs.length?'Mai departe':'Vezi rezultatul'}</button>`;
   const gu=host.querySelector('[data-a=giveup]');if(gu)gu.remove();
   const n=fb.querySelector('[data-a=next]');n.onclick=()=>{stopVoice();i++;step()};n.focus({preventScroll:true});n.scrollIntoView({block:'nearest',behavior:'smooth'})};
  if(typed){const f=host.querySelector('form');setTimeout(()=>f.querySelector('input').focus(),60);
   f.onsubmit=e=>{e.preventDefault();const inp=f.querySelector('input');if(!inp.value.trim())return;inp.disabled=true;f.querySelector('button').disabled=true;finish(inp.value.trim());if(q.sayAfter)say(q.sayAfter)}}
  else if(q.type==='pron'){pron(host.querySelector('#qpron'),q.target,{onPass:skipped=>finish(!skipped)});host.querySelector('[data-a=giveup]').onclick=()=>{finish(false);say(q.target)}}
  else host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;host.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.answer)x.classList.add('right')});if(k!==q.answer)b.classList.add('wrong');finish(k);if(q.sayAfter)say(q.sayAfter)});
 }
 step();
}

R.styleTest=()=>{
 const m=screen('Cum înveți tu','<div class="card" id="q"></div>');const card=m.querySelector('#q');
 const keys=['V','A','S','K'];const pick=STYLEQ.map(()=>null);const orders=STYLEQ.map(()=>shuffle([0,1,2,3]));let i=0;
 function step(){
  if(i>=STYLEQ.length){const cnt={V:0,A:0,S:0,K:0};pick.forEach(k=>cnt[keys[k]]++);st.style=cnt;save();go('styleResult');addXP(10);return}
  const [q,opts]=STYLEQ[i];
  card.innerHTML=`<div class="prog"><span style="width:${i/STYLEQ.length*100}%"></span></div><div class="qn">${i+1} din ${STYLEQ.length}</div><div class="qp">${q}</div><div class="opts">${orders[i].map(k=>`<button class="opt ${pick[i]===k?'mine':''}" data-k="${k}">${opts[k]}</button>`).join('')}</div>
   ${i>0?'<div class="tnav"><button class="btn ghost" data-a="prev">← Înapoi</button></div>':''}`;
  const pv=card.querySelector('[data-a=prev]');if(pv)pv.onclick=()=>{i--;step()};
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick[i]=+b.dataset.k;b.classList.add('mine');setTimeout(()=>{i++;step()},200)});
 }
 step();
};
R.styleResult=()=>{
 const c=st.style||{V:0,A:0,S:0,K:0};const tot=Object.values(c).reduce((a,b)=>a+b,0)||1;
 const top=Object.keys(c).sort((a,b)=>c[b]-c[a]);const main=STYLES[top[0]];
 screen('Stilul tău',`<div class="card"><div class="eyebrow">Stilul tău principal</div><h1>${main.n}</h1>
  <div class="bars">${top.map(k=>`<div class="b"><span>${STYLES[k].n}</span><i><span style="width:${c[k]/tot*100}%"></span></i><b>${Math.round(c[k]/tot*100)}%</b></div>`).join('')}</div></div>
  <div class="card"><h3>Ce îți recomand</h3><ul>${main.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
  <p class="small muted">Al doilea stil: ${STYLES[top[1]].n}. ${STYLES[top[1]].tips[0]}</p></div>
  <button class="btn wide" data-go="home">Începe să înveți</button>`);
};

/* ---------- Sesiunea zilnică ---------- */
function newWords(n,exclude=[]){
 const start=LEVELS.indexOf(st.startLevel||st.level);const out=[];
 for(let k=start;k<LEVELS.length&&out.length<n;k++)for(const w of WORDS[LEVELS[k]]){if(out.length>=n)break;if(!st.learned[w.en]&&!exclude.includes(w.en))out.push(w.en)}
 if(out.length<n)for(let k=start-1;k>=0&&out.length<n;k--)for(const w of WORDS[LEVELS[k]]){if(out.length>=n)break;if(!st.learned[w.en]&&!exclude.includes(w.en))out.push(w.en)}
 return out}
R.daily=()=>{
 if(st.today&&st.today.date===today()&&st.today.phase!=='done'){go(st.today.phase==='quiz'?'dailyQuiz':'dailyLearn');return}
 if(st.sessions[today()]!=null){
  const m=screen('Sesiunea de azi',`<div class="card"><h2>Ai terminat sesiunea de azi</h2><p class="muted">Scor la verificare: ${st.sessions[today()]}/10. Revino mâine pentru încă 10 cuvinte.</p>
   <button class="btn wide" id="rev">Recapitulare: 25 de cuvinte</button><button class="btn ghost wide" id="more">Încă 10 cuvinte noi (bonus)</button></div>`);
  m.querySelector('#rev').onclick=()=>go('review');
  m.querySelector('#more').onclick=()=>{startSession()};return}
 startSession();
};
const topicNew=(id,n)=>(TW[id]||[]).filter(w=>!st.learned[w.en]).slice(0,n).map(w=>w.en);

  genButton(m.querySelector('#gen'),src==='general'?{level:st.startLevel||st.level}:{topic:src},()=>startSession(src));return}
 st.today={date:today(),words:ws,idx:0,phase:'learn',src};save();go('dailyLearn');
}

 }});

R.dailyQuiz=()=>{
 const t=st.today;const ws=shuffle(t.words.map(W));const modes=['en2ro','listen','type','en2roType','pron','en2ro','type','en2roType','pron','ro2en'];
 const m=screen('Verificare',`<div class="card" id="q"></div>`);
 runQuiz(m.querySelector('#q'),ws.map((w,i)=>qWord(w,modes[i%modes.length])),(score,wrong,review)=>{
  const d=today();t.words.forEach(en=>{if(!st.learned[en])st.learned[en]={d}});
  st.sessions[d]=Math.max(st.sessions[d]||0,score);
  if(st.lastDay!==d){st.streak=(st.lastDay&&daysAgo(st.lastDay)===1)?st.streak+1:1;st.lastDay=d}
  t.phase='done';save();const n=ws.length,r=score/n;setTimeout(()=>addXP(n*10+score*2+20),300);const fromTopic=t.src&&t.src!=='general';
  screen('Sesiune terminată',`<div class="card"><div class="eyebrow">Verificare</div><div class="big">${score}/${n}</div><h2>${r>=.8?'Excelent!':r>=.5?'Bine, mai exersează puțin.':'Repetă cuvintele în jocuri.'}</h2>
   <p class="muted">Ai ${learnedCount()} cuvinte învățate. Serie: ${st.streak} ${st.streak===1?'zi':'zile'} la rând.</p></div>
   ${fromTopic?`<button class="btn wide" data-go="topic" data-arg="${esc(t.src)}">Înapoi la domeniu</button>`:''}
   <button class="btn ${fromTopic?'ghost ':''}wide" data-go="games">Joacă-te cu cuvintele învățate</button><button class="btn ghost wide" data-go="home">Acasă</button>
   ${review}`);
 });
};
R.review=()=>{
 const pool=Object.keys(st.learned).map(W).filter(Boolean);
 if(pool.length<4){screen('Recapitulare','<div class="card"><p>Ai nevoie de cel puțin 4 cuvinte învățate pentru recapitulare.</p><button class="btn" data-go="daily">Sesiunea zilnică</button></div>');return}
 /* Recapitulare: până la 25 de cuvinte, mai ales cele vechi și cele greșite înainte */
 const miss=st.missed||{};const ws=shuffle(pool).sort((a,b)=>(miss[b.en]||0)-(miss[a.en]||0)).slice(0,25);
 const m=screen(`Recapitulare (${ws.length})`,'<div class="card" id="q"></div>');
 runQuiz(m.querySelector('#q'),mixQs(ws),(s,wrong,review)=>{noteMissed(wrong);addXP(s*2);screen('Recapitulare',`<div class="card"><div class="eyebrow">Recapitulare</div><div class="big">${s}/${ws.length}</div><p class="muted">Traducere, scriere și pronunție amestecate. Cuvintele greșite revin mai des la următoarea recapitulare.</p></div><button class="btn wide" data-go="review">Încă o recapitulare</button><button class="btn ghost wide" data-go="home">Acasă</button>${review}`)});
};

R.topic=id=>{
 const t=TOPICS.find(x=>x.id===id);if(!t){go('domains');return}
 const ws=TW[id]||[];const s=topicStats(id);const left=s.n-s.l;
 const m=screen(esc(t.t),`<div class="card"><div class="eyebrow">${esc(t.g)}</div><h2>${esc(t.t)}</h2>

  ${left?`<button class="btn wide" id="learn">Învață ${Math.min(10,left)} cuvinte noi</button>`:s.n?'<div class="verdict ok">Ai învățat toate cuvintele de aici.</div>':''}
  ${s.n?`<button class="btn ghost wide" id="tst">Exersează: scriere, traducere, pronunție, test</button>`:''}
  ${id==='water'?'<button class="btn ghost wide" data-go="diagrams">Scheme cu termeni (șanț, stație de pompare)</button>':''}
  <div id="gen"></div></div>
  ${s.n?`<div class="card"><div class="eyebrow">Toți termenii (${s.n})</div>

   <div class="row" style="align-items:center"><button class="btn ghost" id="selmode">Alege ce înveți</button><span class="small muted" id="selinfo">Apasă pe un termen ca să-l înveți și să-l exersezi.</span></div>

 const lb=m.querySelector('#learn');if(lb)lb.onclick=()=>startSession(id);
 const tb=m.querySelector('#tst');if(tb)tb.onclick=()=>topicTest(id);
 genButton(m.querySelector('#gen'),{topic:id},()=>go('topic',id));
 if(!s.n)return;
 let sel=false;const chosen=new Set();const list=m.querySelector('#tlist'),q=m.querySelector('#tsearch');

  const items=ws.map((w,i)=>[w,i]).filter(([w])=>!f||fold(w.en+' '+w.ro).includes(f));

  list.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const w=ws[+b.dataset.i];
   if(sel){chosen.has(w.en)?chosen.delete(w.en):chosen.add(w.en);upd();draw()}else go('word',id+'::'+w.en)})}
 function upd(){const n=chosen.size,b=m.querySelector('#sellearn');b.disabled=!n;b.textContent=n?`Învață termenii aleși (${n})`:'Alege cel puțin un termen'}

function genButton(host,ctx,onDone){
 if(!host)return;
 if(!sampleFn){host.innerHTML='<p class="small muted">Cuvinte noi generate de Claude: disponibil când aplicația e deschisă în Claude.</p>';return}
 host.innerHTML=`<button class="btn ghost wide" id="gb">Generează 10 cuvinte noi cu Claude</button><div id="gst"></div>`;

async function generate(ctx,out,onDone,onFail){
 const t=ctx.topic?TOPICS.find(x=>x.id===ctx.topic):null;const lv=st.level||'B1';
 const about=t?`din domeniul „${t.t}”${t.g!=='Subiectul tău'?' ('+t.g+(t.d?': '+t.d:'')+')':''}, termeni folosiți efectiv de profesioniști, potriviți pentru un elev de nivel ${lv}`:`de vocabular general, nivel ${ctx.level} (CEFR), cuvinte foarte folosite în conversație`;
 const avoid=ALLW.map(w=>w.en).join(', ');
 const prompt=`Ești profesor de engleză pentru vorbitori de limba română. Generează exact 10 cuvinte sau expresii englezești ${about}.
Pentru fiecare dă: "en" = termenul în engleză (fără articol, litere mici în afară de acronime), "ro" = traducerea în română, așa cum o folosesc specialiștii români (scurt), "ex" = o propoziție exemplu naturală în engleză, maxim 12 cuvinte, fără ghilimele.
Nu folosi niciunul dintre aceste cuvinte, sunt deja în aplicație: ${avoid}
Răspunde doar cu un array JSON, de forma: [{"en":"...","ro":"...","ex":"..."}]`;
 out.innerHTML='<p class="small muted">Claude pregătește cuvintele…</p>';
 try{
  const arr=await sampleFn.json(prompt,{cache:false});let added=0;
  if(Array.isArray(arr))for(const x of arr){
   if(!x||typeof x.en!=='string'||typeof x.ro!=='string'||typeof x.ex!=='string')continue;
   const w={en:x.en.trim().slice(0,60),ro:x.ro.trim().slice(0,80),ex:x.ex.trim().slice(0,160)};if(!w.en||!w.ro||!w.ex)continue;
   if(t)w.tp=t.id;else w.lv=ctx.level;
   if(attachWord(w)){st.custom.push(w);added++}}
  save();
  if(added){out.innerHTML=`<div class="verdict ok">Am adăugat ${added} cuvinte noi.</div>`;setTimeout(onDone,600)}
  else{out.innerHTML='<div class="verdict bad">Nu am primit cuvinte noi. Încearcă din nou.</div>';onFail&&onFail()}
 }catch(e){
  const msg={not_granted:'Nu ai permis aplicației să folosească Claude.',rate_limited:'Prea multe cereri acum. Încearcă peste câteva minute.',sampling_disabled:'Claude nu e disponibil pentru acest cont.',invalid_json:'Răspunsul nu a venit în formatul corect. Încearcă din nou.'}[e&&e.code]||'Nu am putut genera acum. Încearcă din nou.';
  out.innerHTML=`<div class="verdict bad">${msg}</div>`;onFail&&onFail()}
}

R.gMatch=()=>{
 const ws=shuffle(gamePool()).slice(0,6);const L=shuffle(ws),Rr=shuffle(ws);let sel=null,left=6,miss=0;const t0=Date.now();
 const m=screen('Perechi',`<p class="muted">Apasă un cuvânt în engleză, apoi traducerea lui.</p><div class="match" id="mt">${L.map((w,i)=>`<button class="opt" data-s="en" data-w="${esc(w.en)}" style="grid-column:1;grid-row:${i+1}">${esc(w.en)}</button>`).join('')}${Rr.map((w,i)=>`<button class="opt" data-s="ro" data-w="${esc(w.en)}" style="grid-column:2;grid-row:${i+1}">${esc(w.ro)}</button>`).join('')}</div><div id="res"></div>`);
 m.querySelectorAll('.match .opt').forEach(b=>b.onclick=()=>{
  if(b.classList.contains('gone'))return;
  if(b.dataset.s==='en'){m.querySelectorAll('[data-s=en]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;say(b.dataset.w);return}

   if(!left){const s=Math.round((Date.now()-t0)/1000);addXP(Math.max(4,12-miss));m.querySelector('#res').innerHTML=`<div class="card"><h2>${s} secunde, ${miss} greșeli</h2><button class="btn wide" data-go="gMatch">Încă o rundă</button></div>`}}

R.gBuild=()=>{
 const ws=shuffle(gamePool()).slice(0,5);let i=0,ok=0;
 const m=screen('Construiește propoziția','<div class="card" id="g"></div>');const card=m.querySelector('#g');
 function step(){
  if(i>=ws.length){endGame('Construiește propoziția',ok,ws.length,'gBuild');return}
  const sent=ws[i].ex;const toks=sent.split(' ');const order=shuffle(toks.map((t,k)=>k));const pick=[];
  card.innerHTML=`<div class="prog"><span style="width:${i/ws.length*100}%"></span></div><div class="qn">Propoziția ${i+1} din ${ws.length} · cu <b>${esc(ws[i].en)}</b> (${esc(ws[i].ro)})</div>
   <div class="slot" id="slot"></div><div class="bank" id="bank">${order.map(k=>`<button class="tok" data-k="${k}">${esc(toks[k])}</button>`).join('')}</div>
   <div class="row"><button class="btn ghost" id="clr">Șterge</button><button class="btn" id="chk" disabled>Verifică</button></div><div class="fb"></div>`;
  const slot=card.querySelector('#slot'),chk=card.querySelector('#chk');
  const draw=()=>{slot.innerHTML=pick.map((k,j)=>`<button class="tok" data-j="${j}">${esc(toks[k])}</button>`).join('');card.querySelectorAll('#bank .tok').forEach(b=>b.classList.toggle('used',pick.includes(+b.dataset.k)));chk.disabled=pick.length!==toks.length;
   slot.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.j,1);draw()})};
  card.querySelectorAll('#bank .tok').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(!pick.includes(k)){pick.push(k);draw()}});
  card.querySelector('#clr').onclick=()=>{pick.length=0;draw()};
  chk.onclick=()=>{const built=pick.map(k=>toks[k]).join(' ');const good=norm(built)===norm(sent);if(good)ok++;
   const fb=card.querySelector('.fb');chk.disabled=true;card.querySelectorAll('.tok').forEach(b=>b.disabled=true);
   fb.innerHTML=`<div class="verdict ${good?'ok':'bad'}">${good?'Corect!':'Corect era: '+esc(sent)}</div><div id="sp"></div><button class="btn wide" id="nx">Următoarea</button>`;
   say(sent);pron(fb.querySelector('#sp'),sent,{});fb.querySelector('#nx').onclick=()=>{i++;step()}};
 }
 step();
};

    ${wl.length?`<div class="card"><h3>De repetat</h3><div class="list">${wl.map(en=>{const w=W(en);return w?`<button class="li" data-say="${esc(w.en)}"><span class="tick">${IC.spk}</span><span class="t"><b>${esc(w.en)}</b><span>${esc(w.ro)}</span></span></button>`:''}).join('')}</div></div>`:''}
    ${review}
    <button class="btn wide" data-go="home">Acasă</button>`);
   document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  });
 };
};

/* Test „unde este?”: atingi numărul corect pe desen; vezi imediat dacă ai nimerit */
function whereTest(d){
 const ls=shuffle(d.labels).slice(0,10);let i=0,score=0;
 const m=screen(esc(d.t),`<div class="card"><div class="prog"><span id="pg"></span></div><div class="row" style="justify-content:space-between"><span class="qn" id="qn"></span><span class="lv">Unde este?</span></div>
  <div class="qp" id="qq"></div><div style="overflow-x:auto;margin-inline:-6px" id="dg"></div><div class="fb" id="fb"></div></div>`);
 function step(){
  if(i>=ls.length){addXP(score*2);screen(esc(d.t),`<div class="card"><div class="eyebrow">Unde este?</div><div class="big">${score}/${ls.length}</div><p class="muted">${score>=8?'Foarte bine!':'Mai treci o dată prin schemă și reîncearcă.'}</p></div><button class="btn wide" data-go="diagram" data-arg="${d.id}">Înapoi la schemă</button>`);return}
  const [n,en]=ls[i];const w=W(en);let done=false;
  m.querySelector('#pg').style.width=(i/ls.length*100)+'%';m.querySelector('#qn').textContent=`Întrebarea ${i+1} din ${ls.length}`;
  m.querySelector('#qq').innerHTML=`Atinge pe desen: <b>${esc(en)}</b><div class="small muted">${esc(w?w.ro:'')}</div>`;
  m.querySelector('#dg').innerHTML=diagSVG(d,{hideNums:true});m.querySelector('#fb').innerHTML='';say(en);
  m.querySelectorAll('#dg .bub').forEach(g=>g.onclick=()=>{if(done)return;done=true;const k=+g.dataset.n;const ok=k===n;if(ok)score++;
   m.querySelectorAll('#dg .bub').forEach(x=>{const xn=+x.dataset.n;if(xn===n){x.classList.add('good');x.querySelector('text').textContent=xn}else if(xn===k){x.classList.add('badb');x.querySelector('text').textContent=xn}});
   const kl=d.labels.find(x=>x[0]===k);
   m.querySelector('#fb').innerHTML=`<div class="verdict ${ok?'ok':'bad'}">${ok?'Corect!':`Greșit: acolo este <b>${esc(kl[1])}</b>. Corect e la verde.`}</div><button class="btn wide" id="nx">${i+1<ls.length?'Mai departe':'Vezi rezultatul'}</button>`;
   m.querySelector('#nx').onclick=()=>{i++;step()};m.querySelector('#nx').scrollIntoView({block:'nearest',behavior:'smooth'})});
 }
 step();
}

/* ---------- Recompense ---------- */
R.rewards=()=>{
 const L=levelInfo();checkBadges();const got=st.badges||{};
 const m=screen('Grade și insigne',`<div class="card"><div class="eyebrow">Nivelul ${L.n}</div><h1>${esc(L.name)}</h1><div class="xpbar"><span style="width:${Math.round(L.pct*100)}%"></span></div>
  <p class="small muted">${st.xp||0} XP. Următorul grad: <b>${esc(levelInfo(L.to).name)}</b>, la ${L.to} XP.</p></div>
 <div class="card"><h3>Cum câștigi puncte</h3><table class="tbl">
  <tr><td>Cuvânt învățat</td><td style="text-align:right"><b>+10</b></td></tr><tr><td>Pronunție corectă</td><td style="text-align:right"><b>+2</b></td></tr>
  <tr><td>Sesiune terminată</td><td style="text-align:right"><b>+20</b></td></tr><tr><td>Răspuns corect la test sau joc</td><td style="text-align:right"><b>+1…3</b></td></tr>
  <tr><td>Text spus din memorie</td><td style="text-align:right"><b>+30</b></td></tr><tr><td>Vorbit liber cu corectură</td><td style="text-align:right"><b>+15</b></td></tr></table></div>
 <div class="card"><h3>Grade</h3><div class="list">${RANKS.map((r,i)=>`<div class="li"><span class="tick ${L.n>i?'done':''}">${i+1}</span><span class="t"><b>${esc(r)}</b><span>de la ${lvlNeed(i)} XP</span></span></div>`).join('')}</div></div>
 <div class="card"><h3>Insigne · ${Object.keys(got).length} din ${BADGES.length}</h3><div class="badges">${BADGES.map(b=>`<div class="bdg ${got[b.id]?'':'locked'}"><span class="med">${got[b.id]?'★':'?'}</span><b>${esc(b.t)}</b><span>${esc(b.d)}${got[b.id]?' · '+got[b.id]:''}</span></div>`).join('')}</div></div>`);
};

/* ---------- Microfon și voce ---------- */
const LIVE_URL='https://cazacubeniamin1988-dot.github.io/speakup/';
R.voice=()=>{
 const inClaude=!!(window.claude&&claude.use)&&window.top!==window;
 const micOk=micState==='ok',micNo=micState==='blocked'||micState==='none';
 const m=screen('Microfon și voce',`
 <div class="card"><div class="eyebrow">Vocea profesorului</div><h3>Alege vocea care sună cel mai natural</h3>
  <p class="small muted">Vocile vin din telefonul tău. Cele marcate „naturală” sună cel mai uman.</p>
  <div class="list" id="vl"></div>
  <label for="rt" class="small"><b>Viteză</b> <span id="rv"></span></label>
  <input type="range" id="rt" min="0.7" max="1.15" step="0.05" style="width:100%">
 </div>
 <div class="card"><div class="eyebrow">Voci mai umane pe telefon</div>
  <p class="small"><b>iPhone:</b> Setări → Accesibilitate → Conținut vorbit → Voci → Engleză → descarcă o voce <b>Premium</b> sau <b>Îmbunătățită</b> (de exemplu Ava, Zoe sau Evan). Apoi revino aici și alege-o.</p>
  <p class="small"><b>Android:</b> Setări → Sistem → Limbi → Ieșire text în vorbire → Motor Google → Instalează date vocale → Engleză (SUA). Alege o voce și descarc-o.</p></div>
 <div class="card"><div class="eyebrow">Verificarea pronunției</div>
  <h3>${micOk?'Microfonul aplicației funcționează':micNo?'Aici microfonul aplicației e blocat':'Microfonul nu a fost încă încercat'}</h3>
  <p class="small">Verificarea reală se face când <b>aplicația</b> te ascultă: recunoașterea vocală compară exact ce ai spus cu cuvântul corect, cuvânt cu cuvânt, și îți arată claritatea pronunției.</p>
  <p class="small">În fereastra Claude, telefonul nu dă voie paginii să folosească microfonul. ${LIVE_URL?'Deschide aplicația în Chrome (Android) sau Safari (iPhone), de la adresa de mai jos, și acolo microfonul funcționează.':'Ca să meargă, aplicația trebuie deschisă direct în Chrome (Android) sau Safari (iPhone), de la o adresă web proprie.'}</p>
  ${LIVE_URL?`<div class="typef"><input type="text" id="lu" readonly value="${esc(LIVE_URL)}"><button class="btn" id="cp">Copiază</button></div><a class="btn ghost wide" href="${esc(LIVE_URL)}" target="_blank" rel="noopener">Deschide în browser</a>`:''}
  <p class="small muted">Progresul se salvează separat în fiecare loc unde deschizi aplicația.</p>
  ${SR&&!micNo?`<button class="btn ghost" id="mt">Testează microfonul</button><div id="mr"></div>`:''}</div>`);
 const vl=m.querySelector('#vl');
 const draw=()=>{if(!voices.length){vl.innerHTML='<p class="muted small">Telefonul nu a încărcat încă vocile. Revino peste câteva secunde.</p>';return}
  vl.innerHTML=voices.slice(0,12).map((v,i)=>{const nat=vScore(v)>=40;return`<button class="li" data-v="${i}"><span class="tick ${voice===v?'done':''}">${voice===v?'✓':''}</span><span class="t"><b>${esc(v.name.replace(/Microsoft |Google |\(.*?\)/g,'').trim()||v.name)}</b><span>${esc(v.lang)}${nat?' · naturală':''}</span></span>${IC.spk}</button>`}).join('');
  vl.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{voice=voices[+b.dataset.v];st.voice=voice.voiceURI;save();say("Hello! Let's practise English together. Great job today.");draw()})};
 draw();if(!voices.length)setTimeout(()=>{loadVoices();draw()},1200);
 const rt=m.querySelector('#rt'),rv=m.querySelector('#rv');rt.value=st.rate||1;rv.textContent=Math.round((st.rate||1)*100)+'%';
 rt.oninput=()=>{st.rate=+rt.value;rv.textContent=Math.round(st.rate*100)+'%'};rt.onchange=()=>{save();say('This is how fast I will speak.')};
 const cp=m.querySelector('#cp');if(cp)cp.onclick=()=>{navigator.clipboard?.writeText(LIVE_URL).then(()=>cp.textContent='Copiat',()=>{m.querySelector('#lu').select()})};
 const mt=m.querySelector('#mt');if(mt)mt.onclick=async()=>{const mr=m.querySelector('#mr');mr.textContent='Spune: hello';try{const a=await listen();mr.innerHTML=`<div class="verdict ok">Funcționează. Am auzit: „${esc(a[0])}”</div>`}catch(e){if(['not-allowed','service-not-allowed','audio-capture'].includes(e))micState='blocked';mr.innerHTML=`<div class="verdict bad">${micState==='blocked'?'Microfonul e blocat aici.':'Nu am auzit nimic, mai încearcă.'}</div>`}};
};

/* ---------- Progres ---------- */
R.progress=()=>{
 const byLv=LEVELS.map(l=>[l,WORDS[l].filter(w=>st.learned[w.en]).length,WORDS[l].length]);
 const top=st.style?Object.keys(st.style).sort((a,b)=>st.style[b]-st.style[a])[0]:null;
 const m=screen('Progres',`
 <div class="card"><div class="eyebrow">Nivel</div><h2>${st.level} · ${LNAME[st.level]}</h2>${st.placement?`<p class="muted small">Test de nivel: ${st.placement.score}/20, pe ${st.placement.date}</p>`:''}
  <div class="row"><button class="btn ghost" data-go="placement">Refă testul de nivel</button><button class="btn ghost" data-go="pickLevel">Alege manual</button></div></div>
 <button class="li" data-go="voice"><span class="tick">${IC.mic.replace('<svg ','<svg class="i" ')}</span><span class="t"><b>Microfon și voce</b><span>Alege o voce mai naturală, viteza, verificarea pronunției</span></span></button>
 <div class="card"><div class="eyebrow">Cuvinte pe niveluri</div><div class="bars">${byLv.map(([l,a,b])=>`<div class="b"><span>${l}</span><i><span style="width:${a/b*100}%"></span></i><b>${a}</b></div>`).join('')}</div><p class="small muted">${ALLW.length} cuvinte în total în aplicație acum.</p></div>
 <div class="card"><div class="eyebrow">Domenii</div><div class="bars wide">${TOPICS.map(t=>{const s=topicStats(t.id);return`<div class="b"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.t)}</span><i><span style="width:${s.n?s.l/s.n*100:0}%;background:var(--ok)"></span></i><b>${s.l}</b></div>`}).join('')}</div></div>
 <div class="card"><div class="eyebrow">Stil de învățare</div><h3>${top?STYLES[top].n:'Necompletat'}</h3><div class="row"><button class="btn ghost" data-go="${top?'styleResult':'styleIntro'}">${top?'Vezi recomandările':'Fă testul'}</button>${top?'<button class="btn ghost" data-go="styleTest">Refă</button>':''}</div></div>
 <div class="card"><div class="eyebrow">Teste săptămânale</div>${st.weekly.length?`<table class="tbl">${st.weekly.slice().reverse().map(h=>`<tr><td>${h.date}</td><td style="text-align:right"><b>${h.score}/${h.n}</b></td></tr>`).join('')}</table>`:'<p class="muted">Niciun test încă.</p>'}</div>
 <div class="card"><div class="eyebrow">Salvarea progresului</div>
  <p class="small">${cloudRef?'<b>Salvare automată în contul tău Claude: activă.</b> Dacă închizi aplicația sau schimbi telefonul, progresul revine când o deschizi din nou în Claude.':'Progresul se salvează automat pe acest telefon, în browser. Ca să nu-l pierzi niciodată, păstrează un <b>cod de salvare</b>.'}</p>
  <p class="small muted">Cu codul de salvare muți progresul între aplicația din Claude și cea din browser, sau pe alt telefon.</p>
  <div class="row"><button class="btn ghost" id="exp">Arată codul de salvare</button><button class="btn ghost" id="imp">Restaurează din cod</button></div><div id="codebox"></div></div>
 <div class="card"><div class="eyebrow">Profil</div><p>Nume: <b>${esc(st.name)}</b></p><button class="btn ghost" id="rst">Șterge tot progresul</button><div id="cf"></div></div>`);
 m.querySelector('#exp').onclick=()=>{const c=exportCode();const cb=m.querySelector('#codebox');cb.innerHTML=`<textarea id="codeout" readonly style="min-height:90px;font-size:.75rem"></textarea><button class="btn wide" id="cpc">Copiază codul</button><p class="small muted">Păstrează-l în Note sau trimite-l pe e-mail ție însuți.</p>`;const ta=cb.querySelector('#codeout');ta.value=c;
  cb.querySelector('#cpc').onclick=()=>{const done=()=>cb.querySelector('#cpc').textContent='Copiat';try{navigator.clipboard.writeText(c).then(done,()=>{ta.select();done()})}catch(e){ta.select()}}};
 m.querySelector('#imp').onclick=()=>{const cb=m.querySelector('#codebox');cb.innerHTML=`<textarea id="codein" placeholder="Lipește aici codul care începe cu SPEAKUP1:" style="min-height:90px;font-size:.75rem"></textarea><button class="btn wide" id="doimp">Restaurează progresul</button><div id="impres"></div>`;
  cb.querySelector('#doimp').onclick=()=>{try{importCode(cb.querySelector('#codein').value);toast('Progresul a fost restaurat.');go('home')}catch(e){cb.querySelector('#impres').innerHTML='<div class="verdict bad">Codul nu e valid. Copiază-l complet, inclusiv începutul SPEAKUP1:</div>'}}};
 m.querySelector('#rst').onclick=()=>{m.querySelector('#cf').innerHTML=`<div class="confirm"><b>Sigur? Se șterg toate cuvintele, scorurile și seria de zile.</b><div class="row"><button class="btn ghost" id="no">Renunț</button><button class="btn" id="yes" style="background:var(--bad);color:#fff">Șterge</button></div></div>`;
  m.querySelector('#no').onclick=()=>m.querySelector('#cf').innerHTML='';m.querySelector('#yes').onclick=()=>{st=fresh();save();go('welcome')}};

go('home');
cloudInit();
</script></body></html>
