dding":[["The bedding must be ten centimetres thick.","Patul de pozare trebuie să aibă zece centimetri."],["Level the bedding before laying the pipe.","Nivelează patul de pozare înainte să pozezi țeava."],["The bedding is made of sand or fine gravel.","Patul de pozare este din nisip sau pietriș fin."],["Compact the bedding lightly.","Compactează ușor patul de pozare."],["There are stones in the bedding, remove them.","Sunt pietre în patul de pozare, scoate-le."],["Bad bedding can break the pipe.","Un pat de pozare prost poate sparge țeava."],["Check the bedding with the laser.","Verifică patul de pozare cu laserul."],["The bedding was washed away by the rain.","Patul de pozare a fost spălat de ploaie."],["We need more material for the bedding.","Avem nevoie de mai mult material pentru patul de pozare."]],"sand bedding":[["Spread the sand bedding in the trench.","Întinde patul de nisip în șanț."],["The sand bedding protects the pipe.","Patul de nisip protejează țeava."],["The sand bedding is ready.","Patul de nisip este gata."],["Make the sand bedding flat and smooth.","Fă patul de nisip plan și neted."],["Sand bedding is required by the specification.","Patul de nisip este cerut de caietul de sarcini."],["We used ten cubic metres for the sand bedding.","Am folosit zece metri cubi pentru patul de nisip."],["Water on the sand bedding is a problem.","Apa pe patul de nisip este o problemă."],["The sand bedding must follow the slope.","Patul de nisip trebuie să urmeze panta."],["Check the thickness of the sand bedding.","Verifică grosimea patului de nisip."]],"pipe surround":[["The pipe surround is thirty centimetres above the pipe.","Învelirea cu nisip are treizeci de centimetri deasupra țevii."],["Compact the pipe surround by hand.","Compactează manual învelirea cu nisip."],["Don't use stones in the pipe surround.","Nu folosi pietre în învelirea țevii."],["The pipe surround keeps the pipe in place.","Învelirea cu nisip ține țeava la locul ei."],["Fill the pipe surround on both sides equally.","Umple învelirea cu nisip egal pe ambele părți."],["The pipe surround is finished on this section.","Învelirea cu nisip e gata pe acest tronson."],["The site supervisor checked the pipe surround.","Dirigintele de șantier a verificat învelirea cu nisip."],["Lay the warning tape above the pipe surround.","Pune banda de avertizare deasupra învelirii cu nisip."],["We need sand for the pipe surround.","Avem nevoie de nisip pentru învelirea țevii."]],"trench width":[["The trench width depends on the pipe diameter.","Lățimea șanțului depinde de diametrul țevii."],["The trench width is too small for the worker.","Lățimea șanțului e prea mică pentru muncitor."],["Measure the trench width every ten metres.","Măsoară lățimea șanțului la fiecare zece metri."],["A bigger trench width means more soil.","O lățime mai mare a șanțului înseamnă mai mult pământ."],["The trench width is written in the specification.","Lățimea șanțului este scrisă în caietul de sarcini."],["The bucket sets the trench width.","Cupa dă lățimea șanțului."],["Keep the trench width the same.","Păstrează aceeași lățime a șanțului."],["The trench width at the manhole is bigger.","Lățimea șanțului la cămin este mai mare."],["What is the trench width here?","Care este lățimea șanțului aici?"]],"trench depth":[["The trench depth increases down the street.","Adâncimea șanțului crește în josul străzii."],["Check the trench depth with the laser.","Verifică adâncimea șanțului cu laserul."],["The trench depth is more than two metres.","Adâncimea șanțului este de peste doi metri."],["At this trench depth we need shoring.","La această adâncime a șanțului avem nevoie de sprijinire."],["The trench depth is on the longitudinal profile.","Adâncimea șanțului este pe profilul longitudinal."],["Write the trench depth in the report.","Scrie adâncimea șanțului în procesul-verbal."],["The trench depth was wrong, dig deeper.","Adâncimea șanțului a fost greșită, sapă mai adânc."],["The trench depth is not the same everywhere.","Adâncimea șanțului nu e la fel peste tot."],["The machine can reach this trench depth.","Utilajul poate ajunge la această adâncime."]],"cover depth":[["The cover depth protects the pipe from frost.","Adâncimea de acoperire protejează țeava de îngheț."],["Here the cover depth is only seventy centimetres.","Aici adâncimea de acoperire este doar de șaptezeci de centimetri."],["Check the cover depth under the road.","Verifică adâncimea de acoperire sub drum."],["The cover depth must be at least one metre.","Adâncimea de acoperire trebuie să fie de cel puțin un metru."],["With low cover depth, use a casing pipe.","La adâncime de acoperire mică, folosește tub de protecție."],["Measure the cover depth to the top of the pipe.","Măsoară adâncimea de acoperire până la creștetul țevii."],["The cover depth is written on the drawing.","Adâncimea de acoperire este scrisă pe planșă."],["In the mountains the cover depth is bigger.","La munte adâncimea de acoperire este mai mare."],["The designer changed the cover depth.","Proiectantul a schimbat adâncimea de acoperire."]],"backfill":[["We backfill the trench after the test.","Umplem șanțul după probă."],["Backfill in layers of thirty centimetres.","Umple în straturi de treizeci de centimetri."],["Don't backfill before the site supervisor comes.","Nu umple până nu vine dirigintele de șantier."],["The excavator can backfill quickly.","Excavatorul poate umple repede."],["We backfilled the trench with clean soil.","Am umplut șanțul cu pământ curat."],["Backfill the trench before the weekend.","Umple șanțul înainte de weekend."],["The backfill settled after the rain.","Umplutura s-a tasat după ploaie."],["Use the plate compactor when you backfill.","Folosește placa compactoare când umpli."],["We need gravel to backfill under the road.","Avem nevoie de pietriș pentru umplere sub drum."]],"backfill material":[["The backfill material must not have big stones.","Materialul de umplutură nu trebuie să aibă pietre mari."],["We bring backfill material from the quarry.","Aducem material de umplutură de la carieră."],["The soil from the trench is good backfill material.","Pământul din șanț este un material de umplutură bun."],["The laboratory tested the backfill material.","Laboratorul a testat materialul de umplutură."],["Clay is not good backfill material.","Argila nu este un material de umplutură bun."],["Store the backfill material next to the trench.","Depozitează materialul de umplutură lângă șanț."],["We need forty tonnes of backfill material.","Avem nevoie de patruzeci de tone de material de umplutură."],["Wet backfill material is hard to compact.","Materialul de umplutură ud se compactează greu."],["The backfill material is in the specification.","Materialul de umplutură este prevăzut în caietul de sarcini."]],"topsoil":[["Remove the topsoil before you dig.","Îndepărtează stratul vegetal înainte să sapi."],["Put the topsoil back at the end.","Pune stratul vegetal la loc la final."],["The topsoil is thirty centimetres thick here.","Stratul vegetal are aici treizeci de centimetri."],["Don't mix the topsoil with the clay.","Nu amesteca stratul vegetal cu argila."],["The farmer wants his topsoil back.","Fermierul își vrea stratul vegetal înapoi."],["Keep the topsoil on the other side of the trench.","Ține stratul vegetal pe partea cealaltă a șanțului."],["Spread the topsoil and plant grass.","Întinde stratul vegetal și seamănă iarbă."],["The topsoil is soft and dark.","Stratul vegetal este moale și închis la culoare."],["We bought topsoil for the gardens.","Am cumpărat strat vegetal pentru grădini."]],"excess soil":[["Load the excess soil into the dump truck.","Încarcă pământul excedentar în basculantă."],["Where do we take the excess soil?","Unde ducem pământul excedentar?"],["The excess soil costs money to transport.","Transportul pământului excedentar costă bani."],["We have two hundred cubic metres of excess soil.","Avem două sute de metri cubi de pământ excedentar."],["The excess soil goes to an approved landfill.","Pământul excedentar merge la un depozit autorizat."],["The farmer took some of the excess soil.","Fermierul a luat o parte din pământul excedentar."],["Don't leave excess soil on the road.","Nu lăsa pământ excedentar pe drum."],["The excess soil is in the bill of quantities.","Pământul excedentar este în antemăsurătoare."],["Remove the excess soil by Friday.","Îndepărtează pământul excedentar până vineri."]],"spoil heap":[["The spoil heap is too close to the trench.","Pământul săpat este prea aproape de șanț."],["Cover the spoil heap so it doesn't fly.","Acoperă grămada de pământ ca să nu zboare."],["The spoil heap is blocking the road.","Grămada de pământ blochează drumul."],["Put the spoil heap on the left side.","Pune grămada de pământ pe partea stângă."],["The spoil heap can make the trench collapse.","Grămada de pământ poate prăbuși șanțul."],["Use the spoil heap for backfill.","Folosește grămada de pământ pentru umplere."],["The spoil heap got wet in the rain.","Grămada de pământ s-a udat de la ploaie."],["Don't climb on the spoil heap.","Nu te urca pe grămada de pământ."],["The spoil heap is two metres high.","Grămada de pământ are doi metri înălțime."]],"haul away":[["We will haul away the old pipes.","Vom transporta țevile vechi."],["How many trucks do we need to haul away the soil?","De câte camioane avem nevoie ca să transportăm pământul?"],["They haul away the asphalt to the recycling plant.","Transportă asfaltul la stația de reciclare."],["Haul away the rubbish every Friday.","Transportă gunoiul în fiecare vineri."],["The subcontractor will haul away the excess soil.","Subcontractorul va transporta pământul excedentar."],["We hauled away fifty loads today.","Am transportat azi cincizeci de curse."],["It costs a lot to haul away the soil.","Costă mult să transporți pământul."],["Haul away the broken concrete first.","Transportă întâi betonul spart."],["The trucks can't haul away the soil when it rains.","Camioanele nu pot transporta pământul când plouă."]],"layer":[["The first layer is sand.","Primul strat este nisip."],["Each layer is thirty centimetres thick.","Fiecare strat are treizeci de centimetri."],["Put the next layer after compaction.","Pune stratul următor după compactare."],["The top layer is asphalt.","Stratul de sus este asfalt."],["There is a layer of clay under the topsoil.","Sub stratul vegetal este un strat de argilă."],["The laboratory tests every layer.","Laboratorul testează fiecare strat."],["This layer is too thick.","Stratul acesta este prea gros."],["Spread the layer evenly.","Întinde stratul uniform."],["We need three layers of gravel.","Avem nevoie de trei straturi de pietriș."]],"compaction":[["Compaction is very important under the road.","Compactarea este foarte importantă sub drum."],["Bad compaction causes holes in the road.","O compactare proastă face gropi în drum."],["The compaction was checked by the laboratory.","Compactarea a fost verificată de laborator."],["Water helps the compaction of sand.","Apa ajută la compactarea nisipului."],["Compaction near the pipe is done by hand.","Compactarea lângă țeavă se face manual."],["We did the compaction with a roller.","Am făcut compactarea cu cilindrul."],["The compaction is finished on this street.","Compactarea s-a terminat pe strada aceasta."],["Compaction is noisy, tell the neighbours.","Compactarea e zgomotoasă, anunță vecinii."],["The client asked for a compaction report.","Clientul a cerut un raport de compactare."]],"compact":[["Compact the soil before the asphalt.","Compactează pământul înainte de asfalt."],["We compact every layer three times.","Compactăm fiecare strat de trei ori."],["Don't compact directly on the pipe.","Nu compacta direct pe țeavă."],["It's hard to compact wet clay.","Argila udă se compactează greu."],["Compact the sand around the manhole.","Compactează nisipul în jurul căminului."],["They compacted the trench with a rammer.","Au compactat șanțul cu maiul."],["Compact well, or the road will sink.","Compactează bine, altfel drumul se va lăsa."],["The roller will compact the gravel.","Cilindrul va compacta pietrișul."],["You must compact the corners by hand.","Trebuie să compactezi manual colțurile."]],"plate compactor":[["The plate compactor is in the van.","Placa compactoare este în dubă."],["Start the plate compactor.","Pornește placa compactoare."],["The plate compactor needs petrol.","Placa compactoare are nevoie de benzină."],["Use the plate compactor on the sand.","Folosește placa compactoare pe nisip."],["The plate compactor is too heavy for one person.","Placa compactoare e prea grea pentru o singură persoană."],["Wear ear protection with the plate compactor.","Poartă antifoane când folosești placa compactoare."],["The plate compactor vibrates a lot.","Placa compactoare vibrează mult."],["We bought a new plate compactor.","Am cumpărat o placă compactoare nouă."],["Lower the plate compactor into the trench carefully.","Coboară placa compactoare în șanț cu grijă."]],"rammer":[["The rammer is good in narrow trenches.","Maiul este bun în șanțuri înguste."],["Use the rammer around the manhole.","Folosește maiul în jurul căminului."],["The rammer jumps up and down.","Maiul sare în sus și în jos."],["Hold the rammer with both hands.","Ține maiul cu ambele mâini."],["The rammer needs oil and petrol.","Maiul are nevoie de ulei și benzină."],["We compacted the house connection with a rammer.","Am compactat racordul cu maiul."],["The rammer is broken, call the mechanic.","Maiul e stricat, sună mecanicul."],["The rammer is louder than the plate compactor.","Maiul e mai zgomotos decât placa compactoare."],["Rent a rammer for this week.","Închiriază un mai pentru săptămâna aceasta."]],"roller":[["The roller is coming tomorrow.","Cilindrul vine mâine."],["The roller compacts the gravel.","Cilindrul compactează pietrișul."],["Don't stand behind the roller.","Nu sta în spatele cilindrului."],["The roller needs water for the asphalt.","Cilindrul are nevoie de apă pentru asfalt."],["We have a small roller and a big roller.","Avem un cilindru mic și unul mare."],["The roller is too wide for this street.","Cilindrul e prea lat pentru strada asta."],["The roller vibrates when it compacts.","Cilindrul vibrează când compactează."],["The roller operator is very good.","Operatorul de pe cilindru este foarte bun."],["Load the roller on the trailer.","Încarcă cilindrul pe trailer."]],"reinstatement":[["Reinstatement is the last stage of the work.","Aducerea la starea inițială este ultima etapă a lucrării."],["The town hall checks the reinstatement.","Primăria verifică aducerea la starea inițială."],["Reinstatement of the pavement starts next week.","Refacerea trotuarului începe săptămâna viitoare."],["We pay for the reinstatement of the garden.","Plătim refacerea grădinii."],["The reinstatement must look like before.","Refacerea trebuie să arate ca înainte."],["Reinstatement includes asphalt and kerbs.","Aducerea la starea inițială include asfalt și borduri."],["The residents are waiting for the reinstatement.","Locuitorii așteaptă refacerea."],["Reinstatement costs ten percent of the project.","Refacerea costă zece la sută din proiect."],["Take photos after the reinstatement.","Fă poze după aducerea la starea inițială."]],"asphalt":[["The asphalt is ten centimetres thick.","Asfaltul are zece centimetri grosime."],["We cut the asphalt with a road cutter.","Tăiem asfaltul cu mașina de tăiat asfalt."],["The new asphalt is still hot.","Asfaltul nou este încă fierbinte."],["Break the old asphalt with a jackhammer.","Sparge asfaltul vechi cu picamărul."],["The asphalt company comes on Monday.","Firma de asfaltare vine luni."],["Don't drive on the fresh asphalt.","Nu conduce pe asfaltul proaspăt."],["The asphalt has cracks after the work.","Asfaltul are fisuri după lucrare."],["We need asphalt for two hundred square metres.","Avem nevoie de asfalt pentru două sute de metri pătrați."],["The old asphalt goes to recycling.","Asfaltul vechi merge la reciclare."]],"road cutter":[["The road cutter makes a straight cut.","Mașina de tăiat asfalt face o tăietură dreaptă."],["The road cutter needs water to cool the blade.","Mașina de tăiat asfalt are nevoie de apă ca să răcească discul."],["Wear ear protection near the road cutter.","Poartă antifoane lângă mașina de tăiat asfalt."],["The road cutter blade is worn.","Discul mașinii de tăiat asfalt este uzat."],["Cut both sides of the trench with the road cutter.","Taie ambele margini ale șanțului cu mașina de tăiat asfalt."],["The road cutter is loud and dusty.","Mașina de tăiat asfalt e zgomotoasă și face praf."],["Rent a road cutter for two days.","Închiriază o mașină de tăiat asfalt pentru două zile."],["The road cutter can cut concrete too.","Mașina de tăiat asfalt poate tăia și beton."],["Push the road cutter slowly.","Împinge încet mașina de tăiat asfalt."]],"warning tape":[["The warning tape tells others there is a pipe below.","Banda de avertizare arată că dedesubt este o conductă."],["Don't forget the warning tape.","Nu uita banda de avertizare."],["The warning tape is forty centimetres above the pipe.","Banda de avertizare este la patruzeci de centimetri deasupra țevii."],["We ran out of warning tape.","Am rămas fără bandă de avertizare."],["The warning tape has a metal wire inside.","Banda de avertizare are un fir metalic înăuntru."],["The site supervisor checked the warning tape.","Dirigintele de șantier a verificat banda de avertizare."],["The warning tape is blue for water.","Banda de avertizare pentru apă este albastră."],["Lay the warning tape along the whole trench.","Pune banda de avertizare pe toată lungimea șanțului."],["Take a photo of the warning tape.","Fă o poză cu banda de avertizare."]],"sewer warning tape":[["Use sewer warning tape above the PVC pipe.","Folosește bandă de avertizare pentru canalizare deasupra țevii PVC."],["The sewer warning tape says \"canalizare\".","Banda de avertizare pentru canalizare are scris „canalizare”."],["Order two rolls of sewer warning tape.","Comandă două role de bandă de avertizare pentru canalizare."],["The sewer warning tape is under the backfill.","Banda de avertizare pentru canalizare este sub umplutură."],["Don't mix the sewer warning tape with the water tape.","Nu confunda banda pentru canalizare cu cea pentru apă."],["The sewer warning tape was missing on one section.","Banda de avertizare pentru canalizare lipsea pe un tronson."],["Put the sewer warning tape in the middle of the trench.","Pune banda de avertizare pentru canalizare la mijlocul șanțului."],["The sewer warning tape is in the report.","Banda de avertizare pentru canalizare este în procesul-verbal."],["A roll of sewer warning tape is two hundred metres.","O rolă de bandă de avertizare pentru canalizare are două sute de metri."]],"gas warning tape":[["The gas warning tape is yellow with black letters.","Banda de avertizare pentru gaz este galbenă cu litere negre."],["Stop digging when you see gas warning tape.","Oprește săpătura când vezi bandă de avertizare pentru gaz."],["We found gas warning tape at fifty centimetres.","Am găsit bandă de avertizare pentru gaz la cincizeci de centimetri."],["The gas warning tape is required by law.","Banda de avertizare pentru gaz este obligatorie prin lege."],["Lay the gas warning tape above the gas pipe.","Pune banda de avertizare pentru gaz deasupra conductei de gaz."],["The gas warning tape was torn by the excavator.","Banda de avertizare pentru gaz a fost ruptă de excavator."],["Order gas warning tape for the new site.","Comandă bandă de avertizare pentru gaz pentru șantierul nou."],["The gas warning tape protects the workers.","Banda de avertizare pentru gaz îi protejează pe muncitori."],["Show me where the gas warning tape is.","Arată-mi unde este banda de avertizare pentru gaz."]],"electrical warning tape":[["The electrical warning tape is above a cable.","Banda de avertizare electrică este deasupra unui cablu."],["Be careful, there is electrical warning tape here.","Atenție, aici este bandă de avertizare electrică."],["Call the electricity company if you see electrical warning tape.","Sună compania de electricitate dacă vezi bandă de avertizare electrică."],["The electrical warning tape is red.","Banda de avertizare electrică este roșie."],["We laid electrical warning tape for the pump cable.","Am pus bandă de avertizare electrică pentru cablul pompei."],["Dig by hand after the electrical warning tape.","Sapă manual după banda de avertizare electrică."],["The electrical warning tape was old and faded.","Banda de avertizare electrică era veche și decolorată."],["Put the electrical warning tape thirty centimetres above the cable.","Pune banda de avertizare electrică la treizeci de centimetri deasupra cablului."],["The electrical warning tape saved us from an accident.","Banda de avertizare electrică ne-a ferit de un accident."]],"detection wire":[["The detection wire helps find plastic pipes.","Firul trasor ajută la găsirea țevilor din plastic."],["Connect the detection wire in the valve box.","Leagă firul trasor în capacul vanei."],["The detection wire is made of copper.","Firul trasor este din cupru."],["Don't cut the detection wire.","Nu tăia firul trasor."],["Lay the detection wire on top of the pipe.","Pune firul trasor deasupra țevii."],["We tested the detection wire with a locator.","Am testat firul trasor cu un detector."],["The detection wire is broken in one place.","Firul trasor este rupt într-un loc."],["The detection wire is in the specification.","Firul trasor este prevăzut în caietul de sarcini."],["Join the detection wire with a connector.","Îmbină firul trasor cu un conector."]],"slope":[["The slope must be constant.","Panta trebuie să fie constantă."],["Check the slope every ten metres.","Verifică panta la fiecare zece metri."],["The slope is too small here.","Panta este prea mică aici."],["The water flows with the slope.","Apa curge în sensul pantei."],["A wrong slope means a blocked sewer.","O pantă greșită înseamnă canal înfundat."],["The slope is written on the drawing.","Panta este scrisă pe planșă."],["We changed the slope after the survey.","Am schimbat panta după ridicarea topografică."],["The laser shows the slope.","Laserul arată panta."],["The road has a big slope.","Drumul are o pantă mare."]],"gradient":[["The gradient is one percent.","Panta este de unu la sută."],["Set the gradient on the laser.","Setează panta pe laser."],["The gradient of the sewer is too flat.","Panta canalului este prea mică."],["Check the gradient between the manholes.","Verifică panta între cămine."],["The designer gave us the gradient.","Proiectantul ne-a dat panta."],["With a good gradient, the sewer cleans itself.","Cu o pantă bună, canalul se autocurăță."],["The gradient changes after manhole five.","Panta se schimbă după căminul cinci."],["Write the gradient on the pipe laying report.","Scrie panta în procesul-verbal de pozare."],["A steep gradient needs drop manholes.","O pantă mare necesită cămine de rupere de pantă."]],"setting out":[["The setting out starts at the first manhole.","Trasarea începe de la primul cămin."],["We need the surveyor for the setting out.","Avem nevoie de topograf pentru trasare."],["Check the setting out before digging.","Verifică trasarea înainte de săpătură."],["The setting out took one day.","Trasarea a durat o zi."],["The setting out pegs are gone.","Țărușii de trasare au dispărut."],["The setting out follows the drawing.","Trasarea urmează planșa."],["The site supervisor approved the setting out.","Dirigintele de șantier a aprobat trasarea."],["Mark the setting out with spray paint.","Marchează trasarea cu vopsea spray."],["We repeated the setting out after the rain.","Am refăcut trasarea după ploaie."]],"axis":[["The axis of the pipe is in the middle of the road.","Axul conductei este la mijlocul drumului."],["Mark the axis with pegs.","Marchează axul cu țăruși."],["The trench follows the axis.","Șanțul urmează axul."],["The axis is two metres from the fence.","Axul este la doi metri de gard."],["We moved the axis because of a cable.","Am mutat axul din cauza unui cablu."],["Check the axis with the surveyor.","Verifică axul cu topograful."],["The axis is marked with red paint.","Axul este marcat cu vopsea roșie."],["The manhole is on the axis.","Căminul este pe ax."],["Draw the axis on the drawing.","Desenează axul pe planșă."]],"peg":[["The peg shows the manhole position.","Țărușul arată poziția căminului."],["Don't move the pegs.","Nu muta țărușii."],["The excavator destroyed a peg.","Excavatorul a distrus un țăruș."],["Put a new peg here.","Pune un țăruș nou aici."],["The level is written on the peg.","Cota este scrisă pe țăruș."],["We need wooden pegs.","Avem nevoie de țăruși de lemn."],["Paint the top of the peg red.","Vopsește vârful țărușului în roșu."],["The peg is two metres from the axis.","Țărușul este la doi metri de ax."],["Hit the peg into the ground.","Bate țărușul în pământ."]],"string line":[["Pull the string line tight.","Întinde bine sfoara de trasare."],["The string line shows the edge of the trench.","Sfoara de trasare arată marginea șanțului."],["Tie the string line to the pegs.","Leagă sfoara de trasare de țăruși."],["The string line is broken.","Sfoara de trasare s-a rupt."],["Use a string line for a straight wall.","Folosește o sfoară de trasare pentru un perete drept."],["The string line must be level.","Sfoara de trasare trebuie să fie la nivel."],["We need a longer string line.","Avem nevoie de o sfoară mai lungă."],["Measure from the string line down.","Măsoară de la sfoară în jos."],["Remove the string line at the end of the day.","Strânge sfoara de trasare la sfârșitul zilei."]],"tape measure":[["My tape measure is five metres long.","Ruleta mea are cinci metri."],["Measure the pipe with the tape measure.","Măsoară țeava cu ruleta."],["We need a thirty metre tape measure.","Avem nevoie de o ruletă de treizeci de metri."],["The tape measure is in my pocket.","Ruleta este în buzunarul meu."],["Hold the end of the tape measure.","Ține capătul ruletei."],["The tape measure is broken.","Ruleta este stricată."],["Check the depth with the tape measure.","Verifică adâncimea cu ruleta."],["Every foreman has a tape measure.","Fiecare maistru are o ruletă."],["Write down what the tape measure says.","Notează ce arată ruleta."]],"spirit level":[["The spirit level shows if it is flat.","Nivela cu bulă arată dacă e plan."],["Put the spirit level on the pipe.","Pune nivela cu bulă pe țeavă."],["The bubble is in the middle of the spirit level.","Bula este la mijlocul nivelei."],["Use a long spirit level for the formwork.","Folosește o nivelă lungă pentru cofraj."],["The spirit level fell into the trench.","Nivela cu bulă a căzut în șanț."],["Check the manhole cover with a spirit level.","Verifică capacul căminului cu nivela cu bulă."],["The spirit level is not accurate anymore.","Nivela cu bulă nu mai e precisă."],["I need a spirit level and a hammer.","Am nevoie de o nivelă cu bulă și un ciocan."],["The plumber always carries a spirit level.","Instalatorul are mereu la el o nivelă cu bulă."]],"laser level":[["Set up the laser level on a tripod.","Montează nivela laser pe un trepied."],["The laser level battery is empty.","Bateria nivelei laser este descărcată."],["The laser level is very accurate.","Nivela laser este foarte precisă."],["Protect the laser level from the rain.","Protejează nivela laser de ploaie."],["We bought a new laser level.","Am cumpărat o nivelă laser nouă."],["The laser level works up to two hundred metres.","Nivela laser funcționează până la două sute de metri."],["Check the laser level every morning.","Verifică nivela laser în fiecare dimineață."],["The laser level is in its box.","Nivela laser este în cutia ei."],["The foreman uses the laser level for the slope.","Maistrul folosește nivela laser pentru pantă."]],"pipe laser":[["Put the pipe laser inside the manhole.","Pune laserul de pantă în cămin."],["The pipe laser shows a red point.","Laserul de pantă arată un punct roșu."],["Set the slope on the pipe laser.","Setează panta pe laserul de pantă."],["The pipe laser is expensive, be careful.","Laserul de pantă este scump, ai grijă."],["The pipe laser helps lay the sewer straight.","Laserul de pantă ajută la pozarea dreaptă a canalului."],["We rent a pipe laser for big sewers.","Închiriem un laser de pantă pentru canale mari."],["The pipe laser target is in the pipe.","Ținta laserului de pantă este în țeavă."],["The drainlayer checks the pipe laser often.","Instalatorul de canalizare verifică des laserul de pantă."],["Charge the pipe laser tonight.","Încarcă laserul de pantă diseară."]],"rotating laser":[["The rotating laser makes a level line all around.","Nivela laser rotativă face o linie la nivel de jur împrejur."],["The receiver beeps when it finds the rotating laser.","Receptorul piuie când găsește laserul rotativ."],["Put the rotating laser away from the excavator.","Pune laserul rotativ departe de excavator."],["The rotating laser can also set a slope.","Laserul rotativ poate seta și o pantă."],["The excavator has a sensor for the rotating laser.","Excavatorul are un senzor pentru laserul rotativ."],["Don't touch the rotating laser while it works.","Nu atinge laserul rotativ cât funcționează."],["The rotating laser is on the tripod.","Laserul rotativ este pe trepied."],["We checked the levels with the rotating laser.","Am verificat cotele cu laserul rotativ."],["The rotating laser needs new batteries.","Laserul rotativ are nevoie de baterii noi."]],"optical level":[["The surveyor uses an optical level.","Topograful folosește o nivelă optică."],["Look through the optical level at the staff.","Uită-te prin nivela optică la miră."],["The optical level is old but accurate.","Nivela optică este veche, dar precisă."],["Put the optical level on firm ground.","Pune nivela optică pe teren stabil."],["The optical level doesn't need batteries.","Nivela optică nu are nevoie de baterii."],["We checked the manhole levels with an optical level.","Am verificat cotele căminelor cu nivela optică."],["Keep the optical level in its case.","Ține nivela optică în cutia ei."],["The optical level must be calibrated every year.","Nivela optică trebuie calibrată anual."],["Can you read the optical level?","Știi să citești la nivela optică?"]],"levelling staff":[["The levelling staff is four metres long.","Mira are patru metri."],["Put the levelling staff on the peg.","Pune mira pe țăruș."],["Hold the levelling staff vertical.","Ține mira verticală."],["Read the number on the levelling staff.","Citește numărul de pe miră."],["The levelling staff is in the car.","Mira este în mașină."],["Move the levelling staff to the next point.","Mută mira la punctul următor."],["The levelling staff has red and black numbers.","Mira are numere roșii și negre."],["Close the levelling staff after work.","Strânge mira după lucru."],["The levelling staff is not straight.","Mira nu este dreaptă."]],"datum point":[["The datum point is on the church wall.","Reperul de nivel este pe peretele bisericii."],["All levels are measured from the datum point.","Toate cotele se măsoară de la reperul de nivel."],["Don't destroy the datum point.","Nu distruge reperul de nivel."],["The datum point is marked on the drawing.","Reperul de nivel este marcat pe planșă."],["We made a new datum point near the site.","Am făcut un reper de nivel nou lângă șantier."],["The surveyor checked the datum point.","Topograful a verificat reperul de nivel."],["The datum point has a level of 250 metres.","Reperul de nivel are cota de 250 de metri."],["Protect the datum point with a fence.","Protejează reperul de nivel cu un gard."],["Where is the datum point?","Unde este reperul de nivel?"]],"ground level":[["The manhole cover must be at ground level.","Capacul căminului trebuie să fie la cota terenului."],["The ground level is higher than on the drawing.","Cota terenului este ma e de un ajutor."],["The surveyor sent the data by email.","Topograful a trimis datele pe e-mail."]],"manhole":[["Don't go into the manhole without a gas detector.","Nu intra în cămin fără detector de gaze."],["The manhole is full of water.","Căminul este plin de apă."],["We built five manholes this week.","Am construit cinci cămine săptămâna aceasta."],["The manhole is in the middle of the road.","Căminul este la mijlocul drumului."],["Clean the manhole before the inspection.","Curăță căminul înainte de inspecție."],["The manhole has a ladder inside.","Căminul are o scară în interior."],["The distance between manholes is fifty metres.","Distanța dintre cămine este de cincizeci de metri."],["The old manhole is broken.","Căminul vechi este spart."],["Number every manhole on the drawing.","Numerotează fiecare cămin pe planșă."]],"sewer manhole":[["The sewer manhole smells bad.","Căminul de canalizare miroase urât."],["The sewer manhole is three metres deep.","Căminul de canalizare are trei metri adâncime."],["We need a sewer manhole every fifty metres.","Avem nevoie de un cămin de canalizare la fiecare cincizeci de metri."],["The sewer manhole is made of PE.","Căminul de canalizare este din PE."],["Two pipes go into the sewer manhole.","În căminul de canalizare intră două țevi."],["The sewer manhole must be watertight.","Căminul de canalizare trebuie să fie etanș."],["Check the sewer manhole for blockage.","Verifică dacă căminul de canalizare e înfundat."],["The sewer manhole has a cast iron cover.","Căminul de canalizare are capac din fontă."],["We repaired the sewer manhole last week.","Am reparat căminul de canalizare săptămâna trecută."]],"manhole cover":[["The manhole cover is heavy.","Capacul căminului este greu."],["The manhole cover is missing.","Lipsește capacul căminului."],["Lift the manhole cover with a hook.","Ridică capacul căminului cu un cârlig."],["The manhole cover makes noise when cars pass.","Capacul căminului face zgomot când trec mașinile."],["We The manhole base is the first part of the manhole.","Baza căminului este prima parte a căminului."],["The manhole base has a channel for the flow.","Baza căminului are un canal pentru curgere."],["Put the manhole base on a concrete slab.","Pune baza căminului pe o placă de beton."],["The manhole base must be level.","Baza căminului trebuie să fie la nivel."],["The manhole base has three inlets.","Baza căminului are trei intrări."],["We cast the manhole base on site.","Am turnat baza căminului pe șantier."],["The manhole base is made of polyethylene.","Baza căminului este din polietilenă."],["Connect the pipes to the manhole base.","Leagă țevile de baza căminului."],["The manhole base was too low.","Baza căminului a fost prea jos."]],"inspection chamber":[["The inspection chamber is in the garden.","Căminul de racord este în grădină."],["The inspection chamber is made of PVC.","Căminul de racord este din PVC."],["Every house has an inspection chamber.","Fiecare casă are un cămin de racord."],["Clean the inspection chamber once a year.","Curăță căminul de racord o dată pe an."],["The inspection chamber is one metre from the fence.","Căminul de racord este la un metru de gard."],["The inspection chamber has a plastic cover.","Căminul de racord are capac de plastic."],["We installed forty inspection chambers.","Am montat patruzeci de cămine de racord."],["The inspection chamber is blocked.","Căminul de racord este înfundat."],["The owner can open the inspection chamber.","Proprietarul poate deschide căminul de racord."]],"valve chamber":[["The valve chamber is full of water.","Căminul de vane este plin de apă."],["Open the valve chamber and close the main valve.","Deschide căminul de vane și închide vana principală."],["The valve chamber is made of concrete.","Căminul de vane este din beton."],["We built a valve chamber at the crossroads.","Am construit un cămin de vane la intersecție."],["The valve chamber has three valves.","Căminul de vane are trei vane."],["The valv anșamentul este din PE 32."],["We made twelve service connections today.","Azi am făcut douăsprezece branșamente."],["The service connection is leaking.","Branșamentul pierde apă."],["The owner signed for the service connection.","Proprietarul a semnat pentru branșament."],["The service connection ends in the meter chamber.","Branșamentul se termină în căminul de apometru."],["Each service connection has a valve.","Fiecare branșament are un robinet."],["The service connection crosses the road.","Branșamentul traversează drumul."],["The service connection was tested at ten bar.","Branșamentul a fost testat la zece bari."]],"house connection":[["The house connection is ready.","Racordul de canalizare este gata."],["The house connection goes to the inspection chamber.","Racordul merge până la căminul de racord."],["The house connection has a slope of two percent.","Racordul are o pantă de doi la sută."],["We made thirty house connections this month.","Am făcut treizeci de racorduri luna aceasta."],["The house connection is made of PVC 160.","Racordul este din PVC 160."],["The owner wants the house connection on the left.","Proprietarul vrea racordul pe stânga."],["The house connection is blocked with roots.","Racordul este înfundat cu rădăcini."],["Check the house connection with a camera.","Verifică racordul cu camera."],["The house connection joins the sewer with a Y branch.","Racordul se leagă de canal cu o ramificație în Y."]],"water main":[["The water main is under the pavement.","Conducta principală de apă este sub trotuar."],["We will replace the old water main.","Vom înlocui conducta principală de apă veche."],["The water main is made of ductile iron.","Conducta principală de apă este din fontă ductilă."],["The water main has a diameter of 250.","Conducta principală de apă are diametrul de 250."],["Close the water main before the repair.","Închide conducta principală de apă înainte de reparație."],["The water main feeds the whole village.","Conducta principală ,"Conducta de refulare pornește de la stația de pompare."]],"sewage":[["Sewage must not leak into the ground.","Apele uzate nu trebuie să se scurgă în pământ."],["The sewage goes to the treatment plant.","Apele uzate merg la stația de epurare."],["Raw sewage smells very bad.","Apele uzate brute miros foarte urât."],["Sewage came out of the manhole.","Au ieșit ape uzate din cămin."],["Wear gloves when you work with sewage.","Poartă mănuși când lucrezi cu ape uzate."],["The sewage flow is higher in the morning.","Debitul de ape uzate e mai mare dimineața."],["The pump moves the sewage up the hill.","Pompa urcă apele uzate pe deal."],["The sewage is full of rags.","Apele uzate sunt pline de cârpe."],["The village sends its sewage to the town.","Satul își trimite apele uzate spre oraș."]],"wastewater":[["Wastewater is treated before it goes to the river.","Apele uzate sunt epurate înainte să ajungă în râu."],["The factory produces a lot of wastewater.","Fabrica produce multe ape uzate."],["The wastewater network is new.","Rețeaua de ape uzate este nouă."],["We measure the wastewater flow.","Măsurăm debitul de ape uzate."],["Wastewater must not mix with drinking water.","Apele uzate nu trebuie să se amestece cu apa potabilă."],["The wastewater is pumped to the next village.","Apele uzate sunt pompate spre satul vecin."],["The laboratory tested the wastewater.","Laboratorul a analizat apele uzate."],["Wastewater treatment is expensive.","Epurarea apelor uzate este scumpă."],["The wastewater pipe is orange.","Țeava de ape uzate este portocalie."]],"stormwater":[["Stormwater goes into the ditch.","Apele pluviale merg în rigolă."],["Don't connect stormwater to the sewer.","Nu racorda apele pluviale la canalizare."],["The stormwater pipe is very big.","Țeava de ape pluviale este foarte mare."],["After the storm, the stormwater flooded the street.","După furtună, apele pluviale au inundat strada."],["The town needs a stormwater network.","Orașul are nevoie de o rețea de ape pluviale."],["Stormwater is cleaner than wastewater.","Apele pluviale sunt mai curate decât apele uzate."],["The stormwater goes directly to the river.","Apele pluviale merg direct în râu."],["We built gullies for the stormwater.","Am construit guri de scurgere pentru apele pluviale."],["The stormwater filled the trench.","Apele pluviale au umplut șanțul."]],"fire hydrant":[["The fire hydrant is next to the school.","Hidrantul este lângă școală."],["Firefighters use the fire hydrant.","Pompierii folosesc hidrantul."],["The fire hydrant needs a test every year.","Hidrantul trebuie testat în fiecare an."],["Don't park in front of the fire hydrant.","Nu parca în fața hidrantului."],["We installed a fire hydrant every hundred metres.","Am montat un hidrant la fiecare sută de metri."],["The fire hydrant has a valve below.","Hidrantul are o vană dedesubt."],["The fire hydrant is broken.","Hidrantul este stricat."],["Flush the network through the fire hydrant.","Spală rețeaua prin hidrant."],["The fire hydrant is on the drawing.","Hidrantul este pe planșă."]],"above ground hydrant":[["The above ground hydrant is easy to find.","Hidrantul suprateran se găsește ușor."],["A car hit the above ground hydrant.","O mașină a lovit hidrantul suprateran."],["The above ground hydrant is painted red.","Hidrantul suprateran este vopsit în roșu."],["We need an above ground hydrant near the factory.","Avem nevoie de un hidrant suprateran lângă fabrică."],["The above ground hydrant has two outlets.","Hidrantul suprateran are două ieșiri."],["Protect the above ground hydrant from frost.","Protejează hidrantul suprateran de îngheț."],["The above ground hydrant is one metre high.","Hidrantul suprateran are un metru înălțime."],["The above ground hydrant drains itself.","Hidrantul suprateran se golește singur."],["Test the above ground hydrant after installation.","Testează hidrantul suprateran după montaj."]],"underground hydrant":[["The underground hydrant is under the road.","Hidrantul subteran este sub drum."],["Snow can hide the underground hydrant.","Zăpada poate ascunde hidrantul subteran."],["A sign shows where the underground hydrant is.","Un semn arată unde este hidrantul subteran."],["The underground hydrant needs a standpipe.","Hidrantul subteran are nevoie de o coloană."],["The underground hydrant is cheaper.","Hidrantul subteran este mai ieftin."],["Clean the cover of the underground hydrant.","Curăță capacul hidrantului subteran."],["The underground hydrant is in the town centre.","Hidrantul subteran este în centrul orașului."],["We installed two underground hydrants.","Am montat doi hidranți subterani."],["Mark the underground hydrant on the as-built drawing.","Marchează hidrantul subteran pe planul as-built."]],"valve":[["Close the valve slowly.","Închide vana încet."],["The valve is stuck.","Vana s-a blocat."],["Open the valve after the repair.","Deschide vana după reparație."],["The valve is in the valve chamber.","Vana este în căminul de vane."],["This valve controls the whole street.","Vana aceasta controlează toată strada."],["The valve is leaking.","Vana pierde."],["Replace the old valve.","Înlocuiește vana veche."],["Which valve do we close?","Ce vană închidem?"],["The valve has a handle.","Vana are o manetă."]],"gate valve":[["The gate valve has a wedge inside.","Vana cu sertar are o pană în interior."],["Turn the gate valve twenty times to close it.","Rotește vana cu sertar de douăzeci de ori ca s-o închizi."],["The gate valve is for drinking water.","Vana cu sertar este pentru apă potabilă."],["The gate valve is buried in the ground.","Vana cu sertar este îngropată în pământ."],["We need a gate valve of DN 150.","Avem nevoie de o vană cu sertar de DN 150."],["Open the gate valve completely.","Deschide complet vana cu sertar."],["The gate valve has flanges.","Vana cu sertar are flanșe."],["The gate valve was installed upside down.","Vana cu sertar a fost montată invers."],["Check the gate valve every year.","Verifică vana cu sertar în fiecare an."]],"knife gate valve":[["The knife gate valve cuts through solids.","Vana cuțit taie prin solide."],["We installed a knife gate valve before the pumps.","Am montat o vană cuțit înaintea pompelor."],["The knife gate valve is made of stainless steel.","Vana cuțit este din oțel inoxidabil."],["Close the knife gate valve for the maintenance.","Închide vana cuțit pentru întreținere."],["The knife gate valve is in the inlet chamber.","Vana cuțit este în căminul de intrare."],["The knife gate valve is stuck with rags.","Vana cuțit este blocată cu cârpe."],["A knife gate valve is thin.","O vană cuțit este subțire."],["Order a knife gate valve of DN 200.","Comandă o vană cuțit de DN 200."],["The knife gate valve has a handwheel.","Vana cuțit are roată de manevră."]],"butterfly valve":[["The butterfly valve has a disc inside.","Vana fluture are un disc în interior."],["Turn the butterfly valve a quarter turn.","Rotește vana fluture un sfert de tură."],["The butterfly valve is light and small.","Vana fluture este ușoară și mică."],["We use butterfly valves in the pumping station.","Folosim vane fluture în stația de pompare."],["The butterfly valve has an electric actuator.","Vana fluture are acționare electrică."],["The butterfly valve is between two flanges.","Vana fluture este între două flanșe."],["The butterfly valve is open.","Vana fluture este deschisă."],["Change the butterfly valve seal.","Schimbă garnitura vanei fluture."],["A butterfly valve is cheaper than a gate valve.","O vană fluture e mai ieftină decât o vană cu sertar."]],"check valve":[["The check valve stops the water from going back.","Clapeta de reținere oprește întoarcerea apei."],["Install the check valve after the pump.","Montează clapeta de reținere după pompă."],["The check valve makes a noise when it closes.","Clapeta de reținere face zgomot când se închide."],["The check valve is stuck open.","Clapeta de reținere s-a blocat deschisă."],["The arrow on the check valve shows the flow." eton."],["Grease floats on top of the wet well.","Grăsimea plutește la suprafața bazinului stației."],["The pumps are at the bottom of the wet well.","Pompele sunt pe fundul bazinului stației."],["The vacuum truck emptied the wet well.","Vidanja a golit bazinul stației."]],"inlet chamber":[["The inlet chamber has a screen.","Căminul de intrare are un grătar."],["Rags collect in the inlet chamber.","Cârpele se adună în căminul de intrare."],["The inlet chamber is before the pumps.","Căminul de intrare este înaintea pompelor."],["Open the inlet chamber for cleaning.","Deschide căminul de intrare pentru curățare."],["The inlet chamber has a knife gate valve.","Căminul de intrare are o vană cuțit."],["The sewer enters the inlet chamber at the bottom.","Canalul intră în căminul de intrare pe la bază."],["The inlet chamber smells bad.","Căminul de intrare miroase urât."],["We built the inlet chamber in concrete.","Am construit căminul de intrare din beton."],["The inlet chamber cover is locked.","Capacul căminului de intrare este încuiat."]],"screen":[["The screen catches rags and plastic.","Grătarul reține cârpele și plasticul."],["Clean the screen every week.","Curăță grătarul în fiecare săptămână."],["The screen is blocked.","Grătarul este înfundat."],["The screen protects the pumps.","Grătarul protejează pompele."],["Lift the screen with the chain.","Ridică grătarul cu lanțul."],["The screen is made of stainless steel.","Grătarul este din oțel inoxidabil."],["The treatment plant has an automatic screen.","Stația de epurare are un grătar automat."],["Put the waste from the screen in a bin.","Pune deșeurile de la grătar într-un tomberon."],["The gaps in the screen are two centimetres.","Spațiile din grătar au doi centimetri."]],"settling tank":[["The settling tank keeps the sand and the solids.","Decantorul reține nisipul și solidele."],["Empty the settling tank twice a year.","Golește decantorul de două ori pe an."],["The settling tank is in front of the pumping station.","Decantorul este în fața stației de pompare."],["The settling tank has an inlet and an outlet.","Decantorul are o intrare și o ieșire."],["The settling tank is full of sludge.","Decantorul este plin de nămol."],["We built the settling tank from concrete rings.","Am construit decantorul din inele de beton."],["The vacuum truck cleans the settling tank.","Vidanja curăță decantorul."],["The settling tank is two metres in diameter.","Decantorul are diametrul de doi metri."],["Water flows slowly in the settling tank.","Apa curge încet în decantor."]],"grit chamber":[["The grit chamber removes sand.","Deznisipatorul reține nisipul."],["Sand damages the pumps, so we need a grit chamber.","Nisipul strică pompele, așa că avem nevoie de un deznisipator."],["Clean the grit chamber after heavy rain.","Curăță deznisipatorul după ploi abundente."],["The grit chamber is after the screen.","Deznisipatorul este după grătar."],["The grit chamber is long and narrow.","Deznisipatorul este lung și îngust."],["The sand from the grit chamber goes to a container.","Nisipul din deznisipator merge într-un container."],["The grit chamber has air bubbles.","Deznisipatorul are bule de aer."],["The grit chamber is full of sand.","Deznisipatorul este plin de nisip."],["We repaired the grit chamber wall.","Am reparat peretele deznisipatorului."]],"duty pump":[["The duty pump works every day.","Pompa activă funcționează zilnic."],["The duty pump changes every week.","Pompa activă se schimbă în fiecare săptămână."],["The duty pump stopped this morning.","Pompa activă s-a oprit azi-dimineață."],["The PLC chooses the duty pump.","PLC-ul alege pompa activă."],["The duty pump runs for ten minutes.","Pompa activă merge zece minute."],["Check the hours of the duty pump.","Verifică orele de funcționare ale pompei active."],["The duty pump is noisy.","Pompa activă face zgomot."],["The duty pump has a frequency converter.","Pompa activă are convertizor de frecvență."],["We replaced the duty pump.","Am înlocuit pompa activă."]],"standby pump":[["The standby pump is ready to start.","Pompa de rezervă este gata să pornească."],["The standby pump started during the storm.","Pompa de rezervă a pornit în timpul furtunii."],["Test the standby pump once a month.","Testează pompa de rezervă o dată pe lună."],["The standby pump is the same as the duty pump.","Pompa de rezervă e la fel ca pompa activă."],["We need a standby pump in every station.","Avem nevoie de o pompă de rezervă în fiecare stație."],["The standby pump helps when the flow is high.","Pompa de rezervă ajută când debitul e mare."],["The standby pump didn't start, check the panel.","Pompa de rezervă nu a pornit, verifică tabloul."],["The standby pump is new.","Pompa de rezervă este nouă."],["The standby pump is on the left.","Pompa de rezervă este pe stânga."]],"float switch":[["The float switch goes up with the water.","Plutitorul urcă odată cu apa."],["The float switch starts the pump.","Plutitorul pornește pompa."],["The float switch is stuck.","Plutitorul s-a blocat."],["We have three float switches in the wet well.","Avem trei plutitoare în bazinul stației."],["The high float switch gives an alarm.","Plutitorul de sus dă alarmă."],["Clean the float switch from grease.","Curăță plutitorul de grăsime."],["The float switch cable is too short.","Cablul plutitorului este prea scurt."],["Change the broken float switch.","Schimbă plutitorul defect."],["The float switch is cheap but useful.","Plutitorul este ieftin, dar util."]],"level sensor":[["The level sensor measures the water level.","Senzorul de nivel măsoară nivelul apei."],["The level sensor sends a signal to the PLC.","Senzorul de nivel trimite un semnal la PLC."],["The level sensor is ultrasonic.","Senzorul de nivel este cu ultrasunete."],["The level sensor shows the wrong value.","Senzorul de nivel arată o valoare greșită."],["Clean the level sensor every month.","Curăță senzorul de nivel lunar."],["The level sensor is above the water.","Senzorul de nivel este deasupra apei."],["We replaced the level sensor.","Am înlocuit senzorul de nivel."],["The level sensor needs a new cable.","Senzorul de nivel are nevoie de un cablu nou."],["Set the level sensor to the new depth.","Setează senzorul de nivel la noua adâncime."]],"control panel":[["The control panel shows a red light.","Tabloul de comandă arată o lumină roșie."],["Open the control panel carefully.","Deschide tabloul de comandă cu grijă."],["The control panel is inside a fence.","Tabloul de comandă este într-o împrejmuire."],["Only the electrician can work on the control panel.","Doar electricianul poate lucra la tabloul de comandă."],["The control panel has a GSM modem.","Tabloul de comandă are un modem GSM."],["Lock the control panel.","Încuie tabloul de comandă."],["The control panel was installed yesterday.","Tabloul de comandă a fost montat ieri."],["The control panel sends alarms to my phone.","Tabloul de comandă îmi trimite alarme pe telefon."],["The control panel is made of stainless steel.","Tabloul de comandă este din oțel inoxidabil."]],"suction pipe":[["The suction pipe must have no air.","Conducta de aspirație nu trebuie să aibă aer."],["The suction pipe is bigger than the discharge pipe.","Conducta de aspirație este mai mare decât cea de refulare."],["There is a valve on the suction pipe.","Pe conducta de aspirație este o vană."],["The suction pipe takes water from the tank.","Conducta de aspirație ia apă din bazin."],["The suction pipe is short and straight.","Conducta de aspirație este scurtă și dreaptă."],["Check the suction pipe for leaks.","Verifică dacă conducta de aspirație are pierderi."],["The suction pipe has a strainer at the end.","Conducta de aspirație are o sită la capăt."],["The pump makes noise if the suction pipe is blocked.","Pompa face zgomot dacă aspirația este înfundată."],["We changed the suction pipe gasket.","Am schimbat garnitura conductei de aspirație."]],"discharge pipe":[["The discharge pipe goes to the network.","Conducta de refulare merge spre rețea."],["There is a check valve on the discharge pipe.","Pe conducta de refulare este o clapetă de reținere."],["The discharge pipe is under pressure.","Conducta de refulare este sub presiune."],["The discharge pipe vibrates a lot.","Conducta de refulare vibrează mult."],["Fix the discharge pipe to the wall.","Prinde conducta de refulare de perete."],["The discharge pipe has a pressure gauge.","Conducta de refulare are un manometru."],["The discharge pipe is made of stainless steel.","Conducta de refulare este din oțel inoxidabil."],["Each pump has its own discharge pipe and valve.","Fiecare pompă are propria refulare și vană."],["The discharge pipe joins the manifold.","Conducta de refulare se leagă la colector."]],"pressure main":[["The pressure main is made of PE 100.","Conducta de refulare este din PE 100."],["The pressure main has a diameter of 160.","Conducta de refulare are diametrul de 160."],["We laid the pressure main next to the road.","Am pozat conducta de refulare lângă drum."],["The pressure main needs thrust blocks at the bends.","Conducta de refulare are nevoie de masive de ancoraj la curbe."],["The pressure main passed the test.","Conducta de refulare a trecut proba."],["A burst on the pressure main is an emergency.","O spargere a conductei de refulare este o urgență."],["The pressure main ends in a gravity manhole.","Conducta de refulare se termină într-un cămin gravitațional."],["We flushed the pressure main.","Am spălat conducta de refulare."],["The pressure main crosses the river.","Conducta de refulare traversează râul."]],"pump":[["The pump is broken.","Pompa este stricată."],["The pump starts automatically.","Pompa pornește automat."],["Lift the pump out with the chain.","Scoate pompa cu lanțul."],["The pump has a guarantee of two years.","Pompa are garanție doi ani."],["The pump is blocked with rags.","Pompa este înfundată cu cârpe."],["We need a stronger pump.","Avem nevoie de o pompă mai puternică."],["The pump runs too often.","Pompa pornește prea des."],["Turn off the pump before you open it.","Oprește pompa înainte s-o deschizi."],["The pump moves ten litres per second.","Pompa transportă zece litri pe secundă."]],"Y strainer":[["The Y strainer protects the meter.","Filtrul Y protejează apometrul."],["The Y strainer is full of dirt.","Filtrul Y este plin de murdărie."],["Open the Y strainer and clean the mesh.","Deschide filtrul Y și curăță sita."],["Install the Y strainer before the water meter.","Montează filtrul Y înaintea apometrului."],["The Y strainer is made of brass.","Filtrul Y este din alamă."],["A blocked Y strainer reduces the pressure.","Un filtru Y înfundat reduce presiunea."],["The arrow on the Y strainer shows the direction.","Săgeata de pe filtrul Y arată sensul."],["We need a Y strainer of one inch.","Avem nevoie de un filtru Y de un țol."],["The Y strainer has a plug at the bottom.","Filtrul Y are un dop la partea de jos."]],"sump":[["The sump is at the lowest point of the room.","Bașa este în punctul cel mai jos al încăperii."],["Water collects in the sump.","Apa se adună în bașă."],["The sump is full, start the pump.","Bașa e plină, pornește pompa."],["The sump is small and square.","Bașa este mică și pătrată."],["Clean the sump from mud.","Curăță bașa de nămol."],["The floor slopes towards the sump.","Pardoseala are pantă spre bașă."],["The sump has a cover.","Bașa are un capac."],["The valve chamber has a sump.","Căminul de vane are o bașă."],["We dug a sump in the trench for the pump.","Am săpat o bașă în șanț pentru pompă."]],"sump pump":[["The sump pump starts by itself.","Pompa de bașă pornește singură."],["The sump pump is small and quiet.","Pompa de bașă este mică și silențioasă."],["The sump pump has a float.","Pompa de bașă are plutitor."],["The sump pump sends the water to the wet well.","Pompa de bașă trimite apa în bazinul stației."],["The sump pump didn't work and the room flooded.","Pompa de bașă n-a funcționat și s-a inundat camera."],["Test the sump pump with a bucket of water.","Testează pompa de bașă cu o găleată de apă."],["The sump pump needs a power socket.","Pompa de bașă are nevoie de o priză."],["Change the sump pump every few years.","Schimbă pompa de bașă o dată la câțiva ani."],["The sump pump is in the corner.","Pompa de bașă este în colț."]],"access ladder":[["The access ladder is made of stainless steel.","Scara de acces este din oțel inoxidabil."],["Check the access ladder before you go down.","Verifică scara de acces înainte să cobori."],["The access ladder is wet and slippery.","Scara de acces este udă și alunecoasă."],["Fix the access ladder to the wall.","Prinde scara de acces de perete."],["The access ladder goes to the bottom.","Scara de acces merge până jos."],["Use a harness on the access ladder.","Folosește ham pe scara de acces."],["The access ladder has a safety bar.","Scara de acces are o bară de siguranță."],["One step of the access ladder is broken.","O treaptă a scării de acces este ruptă."],["Face the access ladder when you climb down.","Stai cu fața la scară când cobori."]],"access hatch":[["The access hatch is made of aluminium.","Capacul de acces este din aluminiu."],["Open the access hatch slowly.","Deschide încet capacul de acces."],["The access hatch has a lock.","Capacul de acces are lacăt."],["The access hatch has gas springs.","Capacul de acces are amortizoare cu gaz."],["Don't leave the access hatch open.","Nu lăsa capacul de acces deschis."],["The access hatch is watertight.","Capacul de acces este etanș."],["The access hatch has a safety grid.","Capacul de acces are un grătar de siguranță."],["Who has the key of the access hatch?","Cine are cheia capacului de acces?"],["The access hatch is above the pumps.","Capacul de acces este deasupra pompelor."]],"proximity sensor":[["The proximity sensor knows when the hatch is open.","Senzorul de proximitate știe când capacul e deschis."],["The proximity sensor sends a message to the dispatcher.","Senzorul de proximitate trimite un mesaj dispeceratului."],["The proximity sensor is on the hatch frame.","Senzorul de proximitate este pe rama capacului."],["The proximity sensor gave a false alarm.","Senzorul de proximitate a dat o alarmă falsă."],["Adjust the proximity sensor.","Reglează senzorul de proximitate."],["The proximity sensor protects against theft.","Senzorul de proximitate protejează împotriva furtului."],["The proximity sensor is connected to the PLC.","Senzorul de proximitate este conectat la PLC."],["We replaced the proximity sensor.","Am înlocuit senzorul de proximitate."],["The proximity sensor needs a cable to the panel.","Senzorul de proximitate are nevoie de un cablu până la tablou."]],"ventilation fan":[["Turn on the ventilation fan before you enter.","Pornește ventilatorul înainte să intri."],["The ventilation fan removes the bad air.","Ventilatorul scoate aerul viciat."],["The ventilation fan is broken.","Ventilatorul este stricat."],["The ventilation fan runs for ten minutes.","Ventilatorul merge zece minute."],["The ventilation fan is on the roof.","Ventilatorul este pe acoperiș."],["The ventilation fan is noisy.","Ventilatorul face zgomot."],["The ventilation fan starts with the hatch.","Ventilatorul pornește odată cu deschiderea capacului."],["Clean the ventilation fan every year.","Curăță ventilatorul anual."],["We need a stronger ventilation fan.","Avem nevoie de un ventilator mai puternic."]],"vent pipe":[["The vent pipe is two metres high.","Țeava de aerisire are doi metri înălțime."],["The vent pipe has a cap on top.","Țeava de aerisire are o căciulă deasupra."],["Gases go out through the vent pipe.","Gazele ies prin țeava de aerisire."],["The vent pipe has a carbon filter.","Țeava de aerisire are un filtru de cărbune."],["The vent pipe is made of PVC.","Țeava de aerisire este din PVC."],["The neighbours complain about the vent pipe smell.","Vecinii se plâng de mirosul de la țeava de aerisire."],["The vent pipe is blocked by leaves.","Țeava
