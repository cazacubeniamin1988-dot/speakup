function diagSVG(d,{focus=null,hideNums=false}={}){
 return `<svg class="diag ill" viewBox="${d.vb}" role="img" aria-label="${esc(d.t)}" ${d.minw?`style="min-width:${d.minw}px;max-width:none"`:'style="max-width:none"'}>${d.art}
  ${d.labels.filter(l=>l[6]).map(l=>`<g class="hl ${focus===l[0]?'on':''}" data-h="${l[0]}">${l[6]}</g>`).join('')}
  ${d.labels.map(([n,en,x,y,bx,by])=>`<g class="bub ${focus===n?'on':''}" data-n="${n}">${(x!==bx||y!==by)?`<path class="lead" d="M${x} ${y}L${bx} ${by}"/>`:''}<circle cx="${bx}" cy="${by}" r="9"/><text x="${bx}" y="${by+3.5}" text-anchor="middle">${hideNums&&focus!==n?'?':n}</text></g>`).join('')}</svg>`}
/* zonele mari stau sub cele mici, ca atingerea să prindă elementul cel mai precis */
function orderHL(root){root.querySelectorAll('svg.diag').forEach(svg=>{const gs=[...svg.querySelectorAll('.hl')];const first=svg.querySelector('.bub');
 gs.map(g=>{let a=0;try{const b=g.getBBox();a=b.width*b.height}catch(e){}return[g,a]}).sort((p,q)=>q[1]-p[1]).forEach(([g])=>svg.insertBefore(g,first))})}
const tapN=el=>{const g=el.closest('[data-n],[data-h]');return g?+(g.dataset.n||g.dataset.h):null};
R.diagrams=()=>{
 screen('Scheme cu termeni',`<p class="muted">Desene de pe șantier cu fiecare element numerotat. Atingi un element sau un număr: se face verde, auzi termenul în engleză și vezi traducerea. Apoi te testezi și explici schema vorbind.</p>
 <div class="list">${DIAGRAMS.map(d=>{const ws=d.labels.map(l=>l[1]);const k=ws.filter(e=>st.learned[e]).length;return`<button class="li" data-go="diagram" data-arg="${d.id}"><span class="t"><b>${esc(d.t)}</b><span>${esc(d.d)} · ${k} din ${ws.length} învățați</span></span><span class="mini"><i style="width:${k/ws.length*100}%"></i></span></button>`}).join('')}</div>`);
};
R.diagram=id=>{
 const d=DIAGRAMS.find(x=>x.id===id);if(!d){go('diagrams');return}
 const m=screen(esc(d.t),`<div class="card"><div style="overflow-x:auto;margin-inline:-6px" id="dg">${diagSVG(d)}</div>
  <div class="note" id="cap">Atinge un element sau un număr din desen.</div></div>
  <div class="row"><button class="btn" id="tw">Test: unde este?</button><button class="btn ghost" id="tc">Test: ce este?</button></div>
  <button class="btn ghost wide" id="lrn">Învață termenii din schemă (pronunție + exemplu)</button>
  <button class="btn ghost wide" data-go="speak" data-arg="diag:${d.id}">${IC.mic.replace('<svg ','<svg class="i" ')} Explică schema vorbind</button>
  <div class="card"><h3>Elementele schemei</h3><div class="list" id="dl">${d.labels.map(([n,en])=>{const w=W(en);return`<button class="li" data-n="${n}"><span class="tick ${st.learned[en]?'done':''}">${n}</span><span class="t"><b>${esc(en)}</b><span>${esc(w?w.ro:'')}</span></span>${IC.spk}</button>`}).join('')}</div></div>`);
 orderHL(m);
 const cap=m.querySelector('#cap');
 const show=n=>{const l=d.labels.find(x=>x[0]===n);if(!l)return;const w=W(l[1]);
  m.querySelectorAll('#dg .bub').forEach(g=>g.classList.toggle('on',+g.dataset.n===n));m.querySelectorAll('#dg .hl').forEach(g=>g.classList.toggle('on',+g.dataset.h===n));
  m.querySelectorAll('#dl .li').forEach(b=>b.classList.toggle('hl',+b.dataset.n===n));
  cap.innerHTML=`<b>${n}. ${esc(l[1])}</b> — ${esc(w?w.ro:'')}${w?`<div class="small" style="margin-top:4px"><i>${esc(w.ex)}</i></div>`:''}`;say(l[1])};
 m.querySelector('#dg').onclick=e=>{const n=tapN(e.target);if(n)show(n)};
 m.querySelectorAll('#dl .li').forEach(b=>b.onclick=()=>{show(+b.dataset.n);m.querySelector('#dg').scrollIntoView({behavior:'smooth',block:'center'})});
 m.querySelector('#lrn').onclick=()=>{const left=d.labels.map(l=>l[1]).filter(e=>W(e)&&!st.learned[e]);startSession('water',(left.length?left:d.labels.map(l=>l[1])).slice(0,12))};
 m.querySelector('#tc').onclick=()=>{const ls=shuffle(d.labels).slice(0,10);const all=d.labels.map(l=>l[1]);
  const qs=ls.map(([n,en])=>{const w=W(en);return mc(`<div style="overflow-x:auto">${diagSVG(d,{focus:n,hideNums:true})}</div>Ce este marcat cu verde?`,en,shuffle(all.filter(x=>x!==en)).slice(0,3),{sayAfter:en,en,ro:w?w.ro:'',kind:'Schemă'})});
  const m2=screen(esc(d.t),'<div class="card" id="q"></div>');
  runQuiz(m2.querySelector('#q'),qs,(s,wrong,review)=>{addXP(s*2);screen(esc(d.t),`<div class="card"><div class="eyebrow">Ce este?</div><div class="big">${s}/${qs.length}</div></div><button class="btn wide" data-go="diagram" data-arg="${id}">Înapoi la schemă</button><button class="btn ghost wide" data-go="speak" data-arg="diag:${id}">Explică schema vorbind</button>`)})};
 m.querySelector('#tw').onclick=()=>whereTest(d);
};
/* Test „unde este?”: atingi elementul pe desen; corect = verde, greșit = roșu + corectul verde */
function whereTest(d){
 const ls=shuffle(d.labels).slice(0,10);let i=0,score=0;
 const m=screen(esc(d.t),`<div class="card"><div class="prog"><span id="pg"></span></div><div class="row" style="justify-content:space-between"><span class="qn" id="qn"></span><span class="lv">Unde este?</span></div>
  <div class="qp" id="qq"></div><div class="row"><button class="btn ghost" id="hear">${IC.spk} Ascultă</button></div><div style="overflow-x:auto;margin-inline:-6px" id="dg"></div><div class="fb" id="fb"></div></div>`);
 function step(){
  if(i>=ls.length){addXP(score*2);screen(esc(d.t),`<div class="card"><div class="eyebrow">Unde este?</div><div class="big">${score}/${ls.length}</div><p class="muted">${score>=8?'Foarte bine!':'Mai treci o dată prin schemă și reîncearcă.'}</p></div><button class="btn wide" data-go="diagram" data-arg="${d.id}">Înapoi la schemă</button><button class="btn ghost wide" data-go="speak" data-arg="diag:${d.id}">Explică schema vorbind</button>`);return}
  const [n,en]=ls[i];const w=W(en);let done=false;
  m.querySelector('#pg').style.width=(i/ls.length*100)+'%';m.querySelector('#qn').textContent=`Întrebarea ${i+1} din ${ls.length}`;
  m.querySelector('#qq').innerHTML=`Atinge pe desen: <b>${esc(en)}</b>`;m.querySelector('#hear').onclick=()=>say(en);
  const dg=m.querySelector('#dg');dg.innerHTML=diagSVG(d,{hideNums:true});orderHL(dg);m.querySelector('#fb').innerHTML='';say(en);
  dg.onclick=e=>{if(done)return;const k=tapN(e.target);if(!k)return;done=true;const ok=k===n;if(ok)score++;
   dg.querySelectorAll('.bub').forEach(x=>{const xn=+x.dataset.n;if(xn===n){x.classList.add('good');x.querySelector('text').textContent=xn}else if(xn===k){x.classList.add('badb');x.querySelector('text').textContent=xn}});
   dg.querySelectorAll('.hl').forEach(x=>{const xn=+x.dataset.h;if(xn===n)x.classList.add('on');else if(xn===k)x.classList.add('wrong')});
   const kl=d.labels.find(x=>x[0]===k);const kw=W(kl[1]);
   m.querySelector('#fb').innerHTML=`<div class="verdict ${ok?'ok':'bad'}">${ok?'Corect!':`Greșit: ai atins <b>${esc(kl[1])}</b> (${esc(kw?kw.ro:'')}). Corect e la verde.`}</div>
    <div class="after"><button class="btn ghost" id="rep">${IC.spk} ${esc(en)}</button><span>= <b>${esc(w?w.ro:'')}</b></span></div><button class="btn wide" id="nx">${i+1<ls.length?'Mai departe':'Vezi rezultatul'}</button>`;
   m.querySelector('#rep').onclick=()=>say(en);m.querySelector('#nx').onclick=()=>{i++;step()};m.querySelector('#nx').scrollIntoView({block:'nearest',behavior:'smooth'})};
 }
 step();
}

 <div class="card"><div class="eyebrow">Domenii</div><div class="bars wide">${TOPICS.map(t=>{const s=topicStats(t.id);return`<div class="b"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.t)}</span><i><span style="width:${s.n?s.l/s.n*100:0}%;background:var(--ok)"></span></i><b>${s.l}</b></div>`}).join('')}</div></div>
 <div class="card"><div class="eyebrow">Stil de învățare</div><h3>${top?STYLES[top].n:'Necompletat'}</h3><div class="row"><button class="btn ghost" data-go="${top?'styleResult':'styleIntro'}">${top?'Vezi recomandările':'Fă testul'}</button>${top?'<button class="btn ghost" data-go="styleTest">Refă</button>':''}</div></div>
 <div class="card"><div class="eyebrow">Teste săptămânale</div>${st.weekly.length?`<table class="tbl">${st.weekly.slice().reverse().map(h=>`<tr><td>${h.date}</td><td style="text-align:right"><b>${h.score}/${h.n}</b></td></tr>`).join('')}</table>`:'<p class="muted">Niciun test încă.</p>'}</div>
 <div class="card"><div class="eyebrow">Salvarea progresului</div>
  <p class="small">${cloudOn()?'<b>Salvare automată în contul tău Claude: activă.</b> Dacă închizi aplicația sau schimbi telefonul, progresul revine când o deschizi din nou în Claude.':'Progresul se salvează automat pe acest telefon, în browser. Ca să nu-l pierzi niciodată, păstrează un <b>cod de salvare</b>.'}</p>
  <p class="small muted">Cu codul de salvare muți progresul profilului <b>${esc(st.name)}</b> între aplicația din Claude, Safari, aplicația de pe ecranul principal sau alt telefon.</p>
  <div class="row"><button class="btn ghost" id="exp">Arată codul de salvare</button><button class="btn ghost" id="imp">Restaurează în acest profil</button></div><div id="codebox"></div></div>
 <div class="card"><div class="eyebrow">Zona periculoasă</div><button class="btn ghost" id="rst">Șterge progresul profilului ${esc(st.name)}</button><div id="cf"></div></div>`,{tab:'progress'});
 m.querySelector('#addp').onclick=()=>newProfile();
 m.querySelector('#exp').onclick=()=>{const c=exportCode();const cb=m.querySelector('#codebox');cb.innerHTML=`<textarea id="codeout" readonly style="min-height:90px;font-size:.75rem"></textarea><button class="btn wide" id="cpc">Copiază codul</button><p class="small muted">Păstrează-l în Note sau trimite-l pe e-mail ție însuți.</p>`;const ta=cb.querySelector('#codeout');ta.value=c;
  cb.querySelector('#cpc').onclick=()=>{const done=()=>cb.querySelector('#cpc').textContent='Copiat';try{navigator.clipboard.writeText(c).then(done,()=>{ta.select();done()})}catch(e){ta.select()}}};
 m.querySelector('#imp').onclick=()=>{const cb=m.querySelector('#codebox');cb.innerHTML=`<textarea id="codein" placeholder="Lipește aici codul care începe cu SPEAKUP1:" style="min-height:90px;font-size:.75rem"></textarea><button class="btn wide" id="doimp">Restaurează progresul</button><div id="impres"></div>`;
  cb.querySelector('#doimp').onclick=()=>{try{importCode(cb.querySelector('#codein').value);toast('Progresul a fost restaurat.');go('home')}catch(e){cb.querySelector('#impres').innerHTML='<div class="verdict bad">Codul nu e valid. Copiază-l complet, inclusiv începutul SPEAKUP1:</div>'}}};
 m.querySelector('#rst').onclick=()=>{m.querySelector('#cf').innerHTML=`<div class="confirm"><b>Sigur? Se șterg toate cuvintele, scorurile și seria de zile.</b><div class="row"><button class="btn ghost" id="no">Renunț</button><button class="btn" id="yes" style="background:var(--bad);color:#fff">Șterge</button></div></div>`;
  m.querySelector('#no').onclick=()=>m.querySelector('#cf').innerHTML='';m.querySelector('#yes').onclick=()=>{const n=st.name;st=fresh();st.name=n;save();if(cloudOn())cloudSave();go('welcome')}};
};

if(profs.list.length===1&&!profs.active)useProfile(profs.list[0].id);
go(profs.list.length===1&&profs.active?'home':'profiles');
cloudInit();
</script>

</body></html>
