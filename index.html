ence.","Încuie poarta gardului."],["We built a fence around the pumping station.","Am construit un gard în jurul stației de pompare."],["The fence is made of metal mesh.","Gardul este din plasă metalică."],["Someone cut the fence.","Cineva a tăiat gardul."],["The fence has a warning sign.","Gardul are un semn de avertizare."],["Paint the fence green.","Vopsește gardul în verde."],["The site fence is open, close it.","Gardul șantierului e deschis, închide-l."]],"earthing rod":[["The earthing rod is two metres long.","Priza de pământ are doi metri lungime."],["Hammer the earthing rod into the ground.","Bate priza de pământ în pământ."],["The earthing rod protects people from electric shock.","Priza de pământ protejează oamenii de electrocutare."],["Measure the resistance of the earthing rod.","Măsoară rezistența prizei de pământ."],["The earthing rod is made of copper.","Priza de pământ este din cupru."],["Connect the fence to the earthing rod.","Leagă gardul la priza de pământ."],["We need two earthing rods here.","Aici avem nevoie de două prize de pământ."],["The electrician tested the earthing rod.","Electricianul a testat priza de pământ."],["The earthing rod is next to the control panel.","Priza de pământ este lângă tabloul de comandă."]],"supply cable":[["The supply cable is underground.","Cablul de alimentare este îngropat."],["The supply cable is fifty metres long.","Cablul de alimentare are cincizeci de metri."],["Don't dig near the supply cable.","Nu săpa lângă cablul de alimentare."],["The supply cable has five wires.","Cablul de alimentare are cinci fire."],["The supply cable goes in a protective pipe.","Cablul de alimentare trece printr-un tub de protecție."],["The supply cable was damaged by the excavator.","Cablul de alimentare a fost avariat de excavator."],["Order the supply cable from the supplier.","Comandă cablul de alimentare de la furnizor."],["The supply cable must be the right size.","Cablul de alimentare trebuie să aibă secțiunea corectă."],["Connect the supply cable to the main switch.","Leagă cablul de alimentare la întrerupătorul general."]],"three-phase metering box":[["The three-phase metering box has a lock.","Blocul de măsură trifazat are încuietoare."],["The electricity company installs the three-phase metering box.","Compania de electricitate montează blocul de măsură trifazat."],["The three-phase metering box is on a pole.","Blocul de măsură trifazat este pe un stâlp."],["Read the meter in the three-phase metering box.","Citește contorul din blocul de măsură trifazat."],["The three-phase metering box has a main fuse.","Blocul de măsură trifazat are o siguranță generală."],["We are waiting for the three-phase metering box.","Așteptăm blocul de măsură trifazat."],["The three-phase metering box is grey.","Blocul de măsură trifazat este gri."],["The supply cable starts from the three-phase metering box.","Cablul de alimentare pleacă din blocul de măsură trifazat."],["The three-phase metering box is near the road.","Blocul de măsură trifazat este lângă drum."]],"electricity meter":[["The electricity meter shows the consumption.","Contorul electric arată consumul."],["The electricity meter belongs to the distribution company.","Contorul electric aparține companiei de distribuție."],["Take a photo of the electricity meter.","Fă o poză contorului electric."],["The electricity meter is digital.","Contorul electric este digital."],["The electricity meter is sealed.","Contorul electric este sigilat."],["We pay by the electricity meter.","Plătim după contorul electric."],["The electricity meter was installed today.","Contorul electric a fost montat azi."],["The electricity meter is inside the box.","Contorul electric este în cutie."],["The pumps use a lot, look at the electricity meter.","Pompele consumă mult, uită-te la contorul electric."]],"electrical service connection":[["We applied for an electrical service connection.","Am depus cererea pentru branșament electric."],["The electrical service connection takes three months.","Branșamentul electric durează trei luni."],["The electrical service connection is three-phase.","Branșamentul electric este trifazat."],["The electrical service connection costs a lot.","Branșamentul electric costă mult."],["The electrical service connection is ready.","Branșamentul electric este gata."],["The electrical service connection is underground.","Branșamentul electric este subteran."],["We need a permit for the electrical service connection.","Avem nevoie de aviz pentru branșamentul electric."],["The electrical service connection is done by the network company.","Branșamentul electric se face de compania de rețea."],["Without the electrical service connection, the pumps can't work.","Fără branșament electric, pompele nu pot funcționa."]],"power pole":[["The power pole is made of concrete.","Stâlpul electric este din beton."],["Don't dig near the power pole.","Nu săpa lângă stâlpul electric."],["The cable comes down the power pole.","Cablul coboară pe stâlpul electric."],["The power pole is next to the station.","Stâlpul electric este lângă stație."],["The excavator touched the power pole.","Excavatorul a atins stâlpul electric."],["The power pole has a number.","Stâlpul electric are un număr."],["We need a new power pole.","Avem nevoie de un stâlp electric nou."],["The metering box is fixed on the power pole.","Blocul de măsură este prins pe stâlpul electric."],["Keep three metres from the power pole.","Păstrează trei metri distanță de stâlpul electric."]],"three-phase":[["The pumping station needs three-phase power.","Stația de pompare are nevoie de curent trifazat."],["Three-phase power is 400 volts.","Curentul trifazat are 400 de volți."],["The motor is three-phase.","Motorul este trifazat."],["We ordered a three-phase connection.","Am cerut un branșament trifazat."],["The generator is three-phase.","Generatorul este trifazat."],["Three-phase is better for big motors.","Trifazatul este mai bun pentru motoare mari."],["Check all three phases of the three-phase supply.","Verifică toate cele trei faze ale alimentării trifazate."],["The three-phase socket is red.","Priza trifazată este roșie."],["The house doesn't have three-phase power.","Casa nu are curent trifazat."]],"single-phase":[["The house has single-phase power.","Casa are curent monofazat."],["Single-phase power is 230 volts.","Curentul monofazat are 230 de volți."],["A small pump can work on single-phase.","O pompă mică poate funcționa pe monofazat."],["The site container is single-phase.","Containerul de șantier este pe monofazat."],["The heater is single-phase.","Radiatorul este monofazat."],["We have only single-phase on site.","Pe șantier avem doar monofazat."],["The single-phase socket is normal.","Priza monofazată este una obișnuită."],["Single-phase is not enough for the station.","Monofazatul nu e suficient pentru stație."],["The meter is single-phase.","Contorul este monofazat."]],"trench wall":[["The trench wall is falling.","Peretele săpăturii cade."],["Support the trench wall with panels.","Sprijină peretele săpăturii cu panouri."],["The trench wall is wet.","Peretele săpăturii este ud."],["Don't put soil close to the trench wall.","Nu pune pământ aproape de peretele săpăturii."],["The trench wall must be vertical.","Peretele săpăturii trebuie să fie vertical."],["There is a cable in the trench wall.","În peretele săpăturii este un cablu."],["The trench wall is made of sand, be careful.","Peretele săpăturii este din nisip, ai grijă."],["Clean the trench wall with a spade.","Curăță peretele săpăturii cu hârlețul."],["The trench wall collapsed overnight.","Peretele săpăturii s-a prăbușit peste noapte."]],"native soil":[["The native soil is clay here.","Terenul natural aici este argilă."],["The native soil is good for backfill.","Terenul natural e bun pentru umplutură."],["We dug through the native soil.","Am săpat prin terenul natural."],["The native soil is very hard.","Terenul natural este foarte tare."],["The native soil has stones.","Terenul natural are pietre."],["The laboratory tested the native soil.","Laboratorul a testat terenul natural."],["Don't mix the native soil with the sand.","Nu amesteca terenul natural cu nisipul."],["The native soil is wet below one metre.","Terenul natural este ud sub un metru."],["The pipe sits on native soil.","Țeava stă pe teren natural."]],"trench bottom level":[["The trench bottom level is lower than the invert level.","Cota fundului săpăturii este mai jos decât cota radierului."],["Check the trench bottom level with the laser.","Verifică cota fundului săpăturii cu laserul."],["The trench bottom level is too high.","Cota fundului săpăturii este prea sus."],["Write the trench bottom level in the report.","Scrie cota fundului săpăturii în procesul-verbal."],["The trench bottom level includes the bedding.","Cota fundului săpăturii include patul de pozare."],["The surveyor checked the trench bottom level.","Topograful a verificat cota fundului săpăturii."],["Don't dig below the trench bottom level.","Nu săpa sub cota fundului săpăturii."],["The trench bottom level is on the profile.","Cota fundului săpăturii este pe profil."],["Clean the trench bottom level by hand.","Curăță manual fundul săpăturii."]],"pipe crown":[["The pipe crown is the top of the pipe.","Creștetul conductei este partea de sus a țevii."],["Measure the cover from the pipe crown.","Măsoară acoperirea de la creștetul conductei."],["The sand is thirty centimetres above the pipe crown.","Nisipul este la treizeci de centimetri deasupra creștetului conductei."],["The pipe crown is at one metre depth.","Creștetul conductei este la un metru adâncime."],["The warning tape is above the pipe crown.","Banda de avertizare este deasupra creștetului conductei."],["The pipe crown level is on the drawing.","Cota creștetului conductei este pe planșă."],["Don't compact on the pipe crown.","Nu compacta pe creștetul conductei."],["The surveyor measured the pipe crown.","Topograful a măsurat creștetul conductei."],["The pipe crown is too close to the road.","Creștetul conductei este prea aproape de drum."]],"inlet":[["The inlet is higher than the outlet.","Intrarea este mai sus decât ieșirea."],["The inlet is blocked.","Intrarea este înfundată."],["Connect the house pipe to the inlet.","Leagă țeava casei de intrare."],["The inlet has a rubber seal.","Intrarea are o garnitură de cauciuc."],["The manhole has two inlets.","Căminul are două intrări."],["Check the inlet level.","Verifică cota intrării."],["The inlet is on the left side.","Intrarea este pe partea stângă."],["Close the inlet during the test.","Închide intrarea în timpul probei."],["The inlet diameter is 160.","Diametrul intrării este 160."]],"outlet":[["The outlet goes to the main sewer.","Ieșirea merge spre colector."],["The outlet is lower than the inlet.","Ieșirea este mai jos decât intrarea."],["Check the outlet for blockage.","Verifică dacă ieșirea este înfundată."],["The outlet has a diameter of 200.","Ieșirea are diametrul de 200."],["The water goes through the outlet.","Apa trece prin ieșire."],["The outlet faces the street.","Ieșirea este spre stradă."],["Close the outlet with a plug.","Închide ieșirea cu un dop."],["The outlet of the tank is at the top.","Ieșirea bazinului este sus."],["The tee has three outlets.","Teul are trei ieșiri."]],"chamber body":[["The chamber body is made of plastic.","Corpul căminului este din plastic."],["Cut the chamber body to the right height.","Taie corpul căminului la înălțimea corectă."],["The chamber body is corrugated.","Corpul căminului este corugat."],["The chamber body sits on the base.","Corpul căminului stă pe bază."],["The chamber body is one metre high.","Corpul căminului are un metru înălțime."],["Compact sand around the chamber body.","Compactează nisip în jurul corpului căminului."],["The chamber body is cracked.","Corpul căminului este fisurat."],["The chamber body has a seal at the bottom.","Corpul căminului are o garnitură la bază."],["The chamber body is 400 millimetres in diameter.","Corpul căminului are diametrul de 400 de milimetri."]],"chamber base":[["The chamber base is the bottom part.","Baza căminului este partea de jos."],["The chamber base has a channel.","Baza căminului are un canal."],["Put the chamber base on sand.","Pune baza căminului pe nisip."],["The chamber base must be level.","Baza căminului trebuie să fie la nivel."],["The chamber base has three connections.","Baza căminului are trei racorduri."],["Connect the pipes to the chamber base.","Leagă țevile de baza căminului."],["The chamber base is made of PP.","Baza căminului este din PP."],["The chamber base is ready.","Baza căminului este gata."],["We ordered ten chamber bases.","Am comandat zece baze de cămin."]],"cast iron cover":[["The cast iron cover is very heavy.","Capacul din fontă este foarte greu."],["The cast iron cover is for forty tonnes.","Capacul din fontă este pentru patruzeci de tone."],["The cast iron cover has a hinge.","Capacul din fontă are balama."],["Put a cast iron cover on the road manhole.","Pune un capac din fontă pe căminul din drum."],["The cast iron cover is broken.","Capacul din fontă este spart."],["The cast iron cover makes noise.","Capacul din fontă face zgomot."],["The cast iron cover has a lock.","Capacul din fontă are încuietoare."],["Lift the cast iron cover with two people.","Ridicați capacul din fontă în doi oameni."],["Cast iron covers are stolen sometimes.","Capacele din fontă se fură uneori."]],"concrete collar":[["The concrete collar holds the cover in place.","Rama de beton ține capacul la locul lui."],["Pour the concrete collar around the cover.","Toarnă rama de beton în jurul capacului."],["The concrete collar must be level with the road.","Rama de beton trebuie să fie la nivelul drumului."],["The concrete collar is cracked.","Rama de beton este fisurată."],["Let the concrete collar dry for three days.","Lasă rama de beton să se usuce trei zile."],["The concrete collar spreads the load.","Rama de beton distribuie încărcarea."],["We need formwork for the concrete collar.","Avem nevoie de cofraj pentru rama de beton."],["The concrete collar is one metre wide.","Rama de beton are un metru lățime."],["The truck broke the concrete collar.","Camionul a spart rama de beton."]],"support ring":[["The support ring is under the chamber.","Inelul de stare este sub cămin."],["The support ring is made of concrete.","Inelul de stare este din beton."],["Put the support ring on firm ground.","Pune inelul de stare pe teren stabil."],["The support ring holds the weight.","Inelul de stare preia greutatea."],["The support ring must be level.","Inelul de stare trebuie să fie la nivel."],["We need a support ring for each meter chamber.","Avem nevoie de un inel de stare pentru fiecare cămin de apometru."],["The support ring is heavy.","Inelul de stare este greu."],["The support ring was cast on site.","Inelul de stare a fost turnat pe șantier."],["The chamber moved, check the support ring.","Căminul s-a mișcat, verifică inelul de stare."]],"inlet valve":[["The inlet valve is before the meter.","Robinetul de intrare este înaintea apometrului."],["Close the inlet valve.","Închide robinetul de intrare."],["The inlet valve is stuck.","Robinetul de intrare s-a blocat."],["The inlet valve has a blue handle.","Robinetul de intrare are maneta albastră."],["The inlet valve belongs to the water company.","Robinetul de intrare aparține companiei de apă."],["Open the inlet valve slowly.","Deschide încet robinetul de intrare."],["The inlet valve is leaking.","Robinetul de intrare pierde."],["We changed the inlet valve.","Am schimbat robinetul de intrare."],["The inlet valve is a ball valve.","Robinetul de intrare este cu bilă."]],"outlet valve":[["The outlet valve is after the meter.","Robinetul de ieșire este după apometru."],["The owner can close the outlet valve.","Proprietarul poate închide robinetul de ieșire."],["The outlet valve has a red handle.","Robinetul de ieșire are maneta roșie."],["Close the outlet valve before the repair.","Închide robinetul de ieșire înainte de reparație."],["The outlet valve has a drain.","Robinetul de ieșire are golire."],["The outlet valve is broken.","Robinetul de ieșire este stricat."],["Install the outlet valve after the check valve.","Montează robinetul de ieșire după clapeta de reținere."],["The outlet valve is easy to reach.","Robinetul de ieșire se ajunge ușor."],["Open the outlet valve to fill the house.","Deschide robinetul de ieșire ca să umpli instalația casei."]],"dismantling joint":[["The dismantling joint makes the repair easy.","Piesa de montaj-demontaj ușurează reparația."],["Put a dismantling joint next to the valve.","Pune o piesă de montaj-demontaj lângă vană."],["The dismantling joint can change its length.","Piesa de montaj-demontaj își poate schimba lungimea."],["Tighten the bolts of the dismantling joint.","Strânge șuruburile piesei de montaj-demontaj."],["The dismantling joint is made of steel.","Piesa de montaj-demontaj este din oțel."],["We need a dismantling joint of DN 150.","Avem nevoie de o piesă de montaj-demontaj de DN 150."],["The dismantling joint is in the valve chamber.","Piesa de montaj-demontaj este în căminul de vane."],["Without a dismantling joint, we can't remove the pump.","Fără piesă de montaj-demontaj nu putem scoate pompa."],["The dismantling joint has a seal.","Piesa de montaj-demontaj are o garnitură."]],"washout valve":[["The washout valve is at the lowest point.","Robinetul de golire este în punctul cel mai jos."],["Open the washout valve to clean the pipe.","Deschide robinetul de golire ca să cureți conducta."],["The washout valve goes to the ditch.","Robinetul de golire evacuează în rigolă."],["The washout valve is closed.","Robinetul de golire este închis."],["We installed a washout valve at the end of the street.","Am montat un robinet de golire la capătul străzii."],["The water from the washout valve is dirty.","Apa de la robinetul de golire este murdară."],["The washout valve has its own chamber.","Robinetul de golire are căminul lui."],["Check the washout valve after flushing.","Verifică robinetul de golire după spălare."],["The washout valve is too small.","Robinetul de golire este prea mic."]],"main switch":[["The main switch turns off everything.","Întrerupătorul general oprește totul."],["The main switch is red and yellow.","Întrerupătorul general este roșu cu galben."],["Lock the main switch during the repair.","Blochează întrerupătorul general în timpul reparației."],["The main switch is at the top of the panel.","Întrerupătorul general este în partea de sus a tabloului."],["Turn the main switch to zero.","Pune întrerupătorul general pe zero."],["The main switch is on.","Întrerupătorul general este pornit."],["The main switch is broken.","Întrerupătorul general este defect."],["Only the electrician can touch the main switch.","Doar electricianul are voie să umble la întrerupătorul general."],["Put a sign on the main switch.","Pune un semn pe întrerupătorul general."]],"surge protector":[["The surge protector protects from lightning.","Descărcătorul de supratensiune protejează de trăsnet."],["The surge protector needs to be changed.","Descărcătorul de supratensiune trebuie schimbat."],["The surge protector has a green window.","Descărcătorul de supratensiune are o fereastră verde."],["After the storm, check the surge protector.","După furtună, verifică descărcătorul de supratensiune."],["The surge protector is next to the main switch.","Descărcătorul de supratensiune este lângă întrerupătorul general."],["The surge protector saved the PLC.","Descărcătorul de supratensiune a salvat PLC-ul."],["The surge protector is connected to the earth.","Descărcătorul de supratensiune este legat la pământ."],["The window of the surge protector is red.","Fereastra descărcătorului de supratensiune este roșie."],["Order a new surge protector.","Comandă un descărcător de supratensiune nou."]],"circuit breaker":[["The circuit breaker tripped.","Siguranța automată a sărit."],["Turn the circuit breaker back on.","Ridică la loc siguranța automată."],["The circuit breaker is for the heater.","Siguranța automată este pentru radiator."],["Each pump has a circuit breaker.","Fiecare pompă are o siguranță automată."],["The circuit breaker is sixteen amps.","Siguranța automată este de șaisprezece amperi."],["Label every circuit breaker.","Etichetează fiecare siguranță automată."],["The circuit breaker trips again and again.","Siguranța automată sare iar și iar."],["The circuit breaker is in the control panel.","Siguranța automată este în tabloul de comandă."],["Change the broken circuit breaker.","Schimbă siguranța automată defectă."]],"contactor":[["The contactor makes a click.","Contactorul face un clic."],["The contactor starts the pump.","Contactorul pornește pompa."],["The contactor is burnt.","Contactorul este ars."],["Each pump has its own contactor.","Fiecare pompă are contactorul ei."],["The contactor is controlled by the PLC.","Contactorul este comandat de PLC."],["Replace the contactor with the same model.","Înlocuiește contactorul cu același model."],["The contactor is in the middle of the panel.","Contactorul este la mijlocul tabloului."],["The contactor is stuck.","Contactorul s-a blocat."],["The contactor has three main contacts.","Contactorul are trei contacte principale."]],"frequency converter":[["The frequency converter changes the pump speed.","Convertizorul de frecvență schimbă turația pompei."],["The frequency converter saves energy.","Convertizorul de frecvență economisește energie."],["The frequency converter shows an error code.","Convertizorul de frecvență arată un cod de eroare."],["The frequency converter is hot.","Convertizorul de frecvență este fierbinte."],["The frequency converter starts the pump slowly.","Convertizorul de frecvență pornește pompa lent."],["The frequency converter is expensive.","Convertizorul de frecvență este scump."],["Set the frequency converter to fifty hertz.","Setează convertizorul de frecvență la cincizeci de herți."],["The frequency converter needs a fan.","Convertizorul de frecvență are nevoie de un ventilator."],["Each pump has a frequency converter.","Fiecare pompă are un convertizor de frecvență."]],"PLC":[["The PLC controls the whole station.","PLC-ul controlează toată stația."],["The PLC is in the control panel.","PLC-ul este în tabloul de comandă."],["Restart the PLC.","Repornește PLC-ul."],["The PLC program was changed.","Programul PLC-ului a fost schimbat."],["The PLC reads the level sensor.","PLC-ul citește senzorul de nivel."],["The PLC sends the alarms.","PLC-ul trimite alarmele."],["The PLC has a small screen.","PLC-ul are un ecran mic."],["The programmer will come to check the PLC.","Programatorul va veni să verifice PLC-ul."],["The PLC alternates the pumps.","PLC-ul alternează pompele."]],"level relay":[["The level relay works with electrodes.","Releul de nivel funcționează cu electrozi."],["The level relay protects the pump from running dry.","Releul de nivel protejează pompa de mersul în gol."],["The level relay is in the panel.","Releul de nivel este în tablou."],["Adjust the level relay.","Reglează releul de nivel."],["The level relay stopped the pump.","Releul de nivel a oprit pompa."],["The level relay has a small light.","Releul de nivel are un led mic."],["The level relay is broken.","Releul de nivel este defect."],["The level relay is cheap and simple.","Releul de nivel este ieftin și simplu."],["Check the cable of the level relay.","Verifică cablul releului de nivel."]],"phase monitoring relay":[["The phase monitoring relay checks the three phases.","Releul de control al fazelor verifică cele trei faze."],["The phase monitoring relay stopped the pumps.","Releul de control al fazelor a oprit pompele."],["A phase is missing, the phase monitoring relay is red.","Lipsește o fază, releul de control al fazelor e pe roșu."],["The phase monitoring relay protects the motors.","Releul izare clipește."],["We changed the indicator light.","Am schimbat lampa de semnalizare."],["Each pump has an indicator light.","Fiecare pompă are o lampă de semnalizare."]],"start button":[["The start button is green.","Butonul de pornire este verde."],["Press the start button for two seconds.","Ține apăsat butonul de pornire două secunde."],["The start button doesn't work.","Butonul de pornire nu funcționează."],["The start button is on the door.","Butonul de pornire este pe ușă."],["Use the start button only in manual mode.","Folosește butonul de pornire doar în modul manual."],["Each pump has a start button.","Fiecare pompă are un buton de pornire."],["The start button is next to the stop button.","Butonul de pornire este lângă butonul de oprire."],["Don't press the start button if the hatch is open.","Nu apăsa butonul de pornire dacă e deschis capacul."],["The start button is broken.","Butonul de pornire este stricat."]],"stop button":[["The stop button is red.","Butonul de oprire este roșu."],["Press the stop button before maintenance.","Apasă butonul de oprire înainte de întreținere."],["The stop button stops one pump.","Butonul de oprire oprește o pompă."],["The stop button is under the green button.","Butonul de oprire este sub butonul verde."],["The stop button is stuck.","Butonul de oprire s-a blocat."],["Press the stop button, the pump is noisy.","Apasă butonul de oprire, pompa face zgomot."],["The stop button is clearly marked.","Butonul de oprire este marcat clar."],["Change the stop button.","Schimbă butonul de oprire."],["Each pump has its own stop button.","Fiecare pompă are propriul buton de oprire."]],"emergency stop":[["The emergency stop is a big red button.","Oprirea de urgență este un buton mare și roșu."],["Press the emergency stop in danger.","Apasă oprirea de urgență în caz de pericol."],["The emergency stop stops everything.","Oprirea de urgență oprește totul."],["Turn the emergency stop to release it.","Rotește oprirea de urgență ca s-o el The team repaired the pipe burst in four hours.","Echipa a reparat spargerea în patru ore."],["After the pipe burst, the village had no water.","După spargerea conductei, satul a rămas fără apă."],["The pipe burst was caused by water hammer.","Spargerea conductei a fost cauzată de lovitura de berbec."],["Report every pipe burst to the dispatcher.","Raportează fiecare spargere dispeceratului."],["The old pipe has a pipe burst every month.","Țeava veche se sparge în fiecare lună."],["We need spare parts for a pipe burst.","Avem nevoie de piese de rezervă pentru spargeri."]],"repair clamp":[["The repair clamp goes around the pipe.","Colierul de reparație se pune în jurul țevii."],["Tighten the repair clamp with a wrench.","Strânge colierul de reparație cu cheia."],["The repair clamp is made of stainless steel.","Colierul de reparație este din oțel inoxidabil."],["We need a repair clamp of 110.","Avem nevoie de un colier de reparație de 110."],["Keep a repair clamp in the van.","Ține un colier de reparație în dubă."],["The repair clamp stopped the leak.","Colierul de reparație a oprit pierderea."],["The repair clamp has a rubber inside.","Colierul de reparație are cauciuc în interior."],["A repair clamp is a quick solution.","Colierul de reparație este o soluție rapidă."],["Put the repair clamp in the middle of the crack.","Pune colierul de reparație în mijlocul fisurii."]],"blockage":[["The blockage is near manhole three.","Înfundarea este lângă căminul trei."],["Grease causes a blockage.","Grăsimea produce înfundări."],["The vacuum truck removed the blockage.","Vidanja a scos înfundarea."],["Roots made a blockage in the pipe.","Rădăcinile au înfundat țeava."],["A blockage makes the manhole overflow.","O înfundare face căminul să dea pe dinafară."],["We found the blockage with the camera.","Am găsit înfundarea cu camera."],["The blockage is in the house connection.","Înfundarea este în racord."],["Wet wipes cause many blockages.","Șervețelele umede cauzează multe înfundări."],["Clear the blockage with water jetting.","Desfundă cu jet de apă."]],"relining":[["Relining doesn't need digging.","Cămășuirea nu necesită săpătură."],["Relining is good for old sewers.","Cămășuirea este bună pentru canale vechi."],["The relining liner is cured with UV light.","Tubul de cămășuire se întărește cu lumină UV."],["Relining makes the pipe a little smaller.","Cămășuirea micșorează puțin țeava."],["We did relining on five hundred metres.","Am făcut cămășuire pe cinci sute de metri."],["Relining is faster than replacing the pipe.","Cămășuirea este mai rapidă decât înlocuirea țevii."],["Clean the pipe before the relining.","Curăță țeava înainte de cămășuire."],["The relining company is from Germany.","Firma de cămășuire este din Germania."],["After relining, we do a CCTV inspection.","După cămășuire facem inspecție video."]],"site organisation":[["The site organisation must be ready before work.","Organizarea de șantier trebuie să fie gata înainte de lucru."],["The site organisation has a toilet.","Organizarea de șantier are toaletă."],["The site organisation is on the drawing.","Organizarea de șantier este pe planșă."],["Remove the site organisation at the end.","Desființează organizarea de șantier la final."],["The site organisation needs electricity.","Organizarea de șantier are nevoie de curent."],["The site organisation is near the school.","Organizarea de șantier este lângă școală."],["The site organisation costs are in the offer.","Costurile organizării de șantier sunt în ofertă."],["We need a big site organisation for this project.","Avem nevoie de o organizare de șantier mare pentru proiectul acesta."],["The site organisation has a parking area.","Organizarea de șantier are o zonă de parcare."]],"site container":[["The site container has a desk and a heater.","Containerul de șantier are un birou și un radiator."],["Lock the site container at night.","Încuie containerul de șantier noaptea."],["The drawings are in the site container.","Planșele sunt în containerul de șantier."],["The site container arrived on a truck.","Containerul de șantier a venit cu un camion."],["The workers eat in the site container.","Muncitorii mănâncă în containerul de șantier."],["The site container is too small.","Containerul de șantier este prea mic."],["Keep the site container clean.","Ține containerul de șantier curat."],["We rent the site container.","Închiriem containerul de șantier."],["The site container has a window.","Containerul de șantier are o fereastră."]],"site fence":[["The site fence keeps people out.","Gardul șantierului ține oamenii afară."],["The site fence has a sign with the project name.","Gardul șantierului are panou cu numele proiectului."],["The wind knocked down the site fence.","Vântul a doborât gardul șantierului."],["Fix the site fence.","Repară gardul șantierului."],["The site fence is made of panels.","Gardul șantierului este din panouri."],["Open the site fence for the truck.","Deschide gardul șantierului pentru camion."],["The site fence must be two metres high.","Gardul șantierului trebuie să aibă doi metri."],["We moved the site fence to the next street.","Am mutat gardul șantierului pe strada următoare."],["The site fence has a lock.","Gardul șantierului are lacăt."]],"inventory":[["The inventory shows what we have.","Inventarul arată ce avem."],["Do the inventory of the fittings.","Fă inventarul fitingurilor."],["The inventory is in the computer.","Inventarul este în calculator."],["We lost tools, check the inventory.","Am pierdut scule, verifică inventarul."],["The inventory is done every month.","Inventarul se face lunar."],["The accountant needs the inventory.","Contabilul are nevoie de inventar."],["Update the inventory after every delivery.","Actualizează inventarul după fiecare livrare."],["The inventory of the site container is complete.","Inventarul containerului de șantier este complet."],["The inventory list has two hundred items.","Lista de inventar are două sute de poziții."]],"delivery note":[["The delivery note shows the quantity.","Avizul de însoțire arată cantitatea."],["Check the delivery note before you sign.","Verifică avizul înainte să semnezi."],["The delivery note is missing.","Lipsește avizul de însoțire."],["Send the delivery note to the office.","Trimite avizul de însoțire la birou."],["The delivery note has the truck number.","Avizul de însoțire are numărul camionului."],["The quantity on the delivery note is wrong.","Cantitatea de pe aviz este greșită."],["Keep a copy of the delivery note.","Păstrează o copie a avizului."],["The driver gave me the delivery note.","Șoferul mi-a dat avizul de însoțire."],["Every delivery note has a number.","Fiecare aviz de însoțire are un număr."]],"invoice":[["The invoice is due in thirty days.","Factura este scadentă în treizeci de zile."],["We received the invoice for the pipes.","Am primit factura pentru țevi."],["The invoice has a mistake.","Factura are o greșeală."],["Send the invoice to the client.","Trimite factura clientului."],["The invoice includes VAT.","Factura include TVA."],["Pay the invoice this week.","Plătește factura săptămâna aceasta."],["The invoice number is on top.","Numărul facturii este sus."],["The client hasn't paid the invoice yet.","Clientul nu a plătit încă factura."],["Attach the delivery note to the invoice.","Atașează avizul la factură."]],"drawing":[["The drawing shows the pipe route.","Planșa arată traseul conductei."],["This drawing is old.","Planșa aceasta este veche."],["Print the drawing in A3.","Printează planșa pe A3."],["The drawing has a scale of one to five hundred.","Planșa are scara unu la cinci sute."],["The manhole is not on the drawing.","Căminul nu este pe planșă."],["The designer sent a new drawing.","Proiectantul a trimis o planșă nouă."],["Look at the drawing before digging.","Uită-te pe planșă înainte de săpătură."],["The drawing number is in the corner.","Numărul planșei este în colț."],["We need the drawing signed.","Avem nevoie de planșa semnată."]],"detailed design":[["The detailed design has three volumes.","Proiectul tehnic de execuție are trei volume."],["The detailed design is approved.","Proiectul tehnic de execuție este aprobat."],["Read the detailed design carefully.","Citește cu atenție proiectul tehnic."],["The detailed design shows every manhole.","Proiectul tehnic arată fiecare cămin."],["The detailed design has mistakes.","Proiectul tehnic are greșeli."],["We need the detailed design on site.","Avem nevoie de proiectul tehnic pe șantier."],["The designer will update the detailed design.","Proiectantul va actualiza proiectul tehnic."],["The detailed design includes the quantities.","Proiectul tehnic include cantitățile."],["Follow the detailed design, not your idea.","Urmează proiectul tehnic, nu ideea ta."]],"work schedule":[["The work schedule is on the wall.","Graficul de execuție este pe perete."],["We are behind the work schedule.","Suntem în urmă față de graficul de execuție."],["Update the work schedule every week.","Actualizează graficul de execuție săptămânal."],["The client approved the work schedule.","Clientul a aprobat graficul de execuție."],["The work schedule has twelve months.","Graficul de execuție are douăsprezece luni."],["Rain changed the work schedule.","Ploaia a schimbat graficul de execuție."],["The work schedule is in Excel.","Graficul de execuție este în Excel."],["Send the new work schedule to the site supervisor.","Trimite noul grafic de execuție dirigintelui de șantier."],["The work schedule is realistic.","Graficul de execuție este realist."]],"daily report":[["The daily report shows the work done.","Raportul zilnic arată lucrările făcute."],["Write the daily report before you leave.","Scrie raportul zilnic înainte să pleci."],["The daily report has the number of workers.","Raportul zilnic conține numărul de muncitori."],["Send the daily report by WhatsApp.","Trimite raportul zilnic pe WhatsApp."],["The daily report is late.","Raportul zilnic întârzie."],["The daily report includes photos.","Raportul zilnic include poze."],["The project manager reads the daily report.","Managerul de proiect citește raportul zilnic."],["The daily report shows the machines used.","Raportul zilnic arată utilajele folosite."],["The daily report is very short today.","Raportul zilnic este foarte scurt azi."]],"timesheet":[["The timesheet shows the hours of each worker.","Foaia de pontaj arată orele fiecărui muncitor."],["Fill in the timesheet every day.","Completează foaia de pontaj zilnic."],["The timesheet goes to the accountant.","Foaia de pontaj merge la contabil."],["The timesheet has overtime.","Foaia de pontaj are ore suplimentare."],["Sign the timesheet.","Semnează foaia de pontaj."],["The timesheet is wrong.","Foaia de pontaj este greșită."],["Who fills in the timesheet?","Cine completează foaia de pontaj?"],["The timesheet is on the phone now.","Pontajul se face acum pe telefon."],["We pay salaries from the timesheet.","Plătim salariile după foaia de pontaj."]],"site diary":[["The site diary is in the container.","Jurnalul de șantier este în container."],["Write the weather in the site diary.","Scrie vremea în jurnalul de șantier."],["The site supervisor signs the site diary.","Dirigintele de șantier semnează jurnalul de șantier."],["The site diary is an official document.","Jurnalul de șantier este un document oficial."],["Write every problem in the site diary.","Scrie orice problemă în jurnalul de șantier."],["The site diary has numbered pages.","Jurnalul de șantier are paginile numerotate."],["Don't lose the site diary.","Nu pierde jurnalul de șantier."],["The auditor asked for the site diary.","Auditorul a cerut jurnalul de șantier."],["The site diary is complete.","Jurnalul de șantier este completat."]],"welding record":[["The welding record has the date and time.","Fișa de sudură are data și ora."],["Fill in the welding record for every joint.","Completează fișa de sudură pentru fiecare îmbinare."],["The welding record is printed from the machine.","Fișa de sudură se printează din aparat."],["The welding coordinator checks the welding record.","Responsabilul cu sudura verifică fișa de sudură."],["The welding record has the welder's name.","Fișa de sudură are numele sudorului."],["The welding record is missing for one joint.","Lipsește fișa de sudură pentru o îmbinare."],["Keep the welding records in the file.","Păstrează fișele de sudură în dosar."],["The welding record shows the temperature.","Fișa de sudură arată temperatura."],["The client wants the welding records.","Clientul vrea fișele de sudură."]],"welder certificate":[["The welder certificate expires next month.","Autorizația de sudor expiră luna viitoare."],["Show me your welder certificate.","Arată-mi autorizația de sudor."],["Every welder needs a welder certificate.","Fiecare sudor are nevoie de autorizație."],["The welder certificate is from ISCIR.","Autorizația de sudor este de la ISCIR."],["Put a copy of the welder certificate in the file.","Pune o copie a autorizației de sudor în dosar."],["The welder certificate is for PE pipes.","Autorizația de sudor este pentru țevi PE."],["Renew the welder certificate on time.","Reînnoiește autorizația de sudor la timp."],["The auditor checked the welder certificate.","Auditorul a verificat autorizația de sudor."],["Without a welder certificate, you can't weld.","Fără autorizație de sudor, nu ai voie să sudezi."]],"pipe coil":[["The pipe coil is one hundred metres long.","Colacul de țeavă are o sută de metri."],["Unroll the pipe coil carefully.","Desfă colacul de țeavă cu grijă."],["The pipe coil is heavy.","Colacul de țeavă este greu."],["We need three pipe coils of 32.","Avem nevoie de trei colaci de țeavă de 32."],["The pipe coil is in the yard.","Colacul de țeavă este în curte."],["A pipe coil has fewer joints.","Un colac de țeavă are mai puține îmbinări."],["Tie the pipe coil with tape.","Leagă colacul de țeavă cu bandă."],["The pipe coil is easier to transport.","Colacul de țeavă se transportă mai ușor."],["Put the pipe coil on the unroller.","Pune colacul de țeavă pe derulator."]],"pipe length":[["One pipe length is twelve metres.","O bară de țeavă are doisprezece metri."],["We need fifty pipe lengths.","Avem nevoie de cincizeci de bare de țeavă."],["The truck can carry forty pipe lengths.","Camionul poate căra patruzeci de bare de țeavă."],["Cut the pipe length in two.","Taie bara de țeavă în două."],["Each pipe length has a socket.","Fiecare bară de țeavă are o mufă."],["The pipe length is damaged at the end.","Bara de țeavă este deteriorată la capăt."],["Count the pipe lengths on the truck.","Numără barele de țeavă din camion."],["A pipe length weighs thirty kilos.","O bară de țeavă cântărește treizeci de kilograme."],["Store each pipe length on wooden supports.","Depozitează fiecare bară pe suporturi de lemn."]],"pipe scraper":[["The pipe scraper removes the oxide layer.","Răzuitorul îndepărtează stratul oxidat."],["Use the pipe scraper before electrofusion.","Folosește răzuitorul înainte de electrofuziune."],["The pipe scraper blade is sharp.","Lama răzuitorului este ascuțită."],["We need a pipe scraper of 110.","Avem nevoie de un răzuitor de 110."],["The pipe scraper is in the welding box.","Răzuitorul este în cutia de sudură."],["Change the pipe scraper blade.","Schimbă lama răzuitorului."],["The pipe scraper makes a clean surface.","Răzuitorul face o suprafață curată."],["Without the pipe scraper, the weld is bad.","Fără răzuitor, sudura iese proastă."],["The pipe scraper turns around the pipe.","Răzuitorul se rotește în jurul țevii."]],"alignment clamp":[["The alignment clamp holds the pipes straight.","Dispozitivul de aliniere ține țevile drepte."],["Fix the alignment clamp before welding.","Fixează dispozitivul de aliniere înainte de sudură."],["The alignment clamp is for 63 to 160.","Dispozitivul de aliniere este pentru 63 până la 160."],["Don't remove the alignment clamp too early.","Nu scoate dispozitivul de aliniere prea devreme."],["The alignment clamp is in the van.","Dispozitivul de aliniere este în dubă."],["The alignment clamp is made of aluminium.","Dispozitivul de aliniere este din aluminiu."],["We need two alignment clamps.","Avem nevoie de două dispozitive de aliniere."],["The alignment clamp keeps the pipes still.","Dispozitivul de aliniere ține țevile nemișcate."],["Tighten the alignment clamp by hand.","Strânge cu mâna dispozitivul de aliniere."]],"heating plate":[["The heating plate is very hot.","Oglinda de sudură este foarte fierbinte."],["Don't touch the heating plate.","Nu atinge oglinda de sudură."],["The heating plate is two hundred and twenty degrees.","Oglinda de sudură are două sute douăzeci de grade."],["Clean the heating plate with alcohol.","Curăță oglinda de sudură cu alcool."],["The heating plate has a coating.","Oglinda de sudură are un strat de protecție."],["Check the heating plate temperature.","Verifică temperatura oglinzii de sudură."],["Put the heating plate between the pipes.","Pune oglinda de sudură între țevi."],["The heating plate takes ten minutes to heat up.","Oglinda de sudură se încălzește în zece minute."],["The heating plate is damaged.","Oglinda de sudură este deteriorată."]],"weld bead":[["The weld bead must be even.","Cordonul de sudură trebuie să fie uniform."],["Measure the weld bead.","Măsoară cordonul de sudură."],["The weld bead is too small.","Cordonul de sudură este prea mic."],["The weld bead shows a good weld.","Cordonul de sudură arată o sudură bună."],["Remove the weld bead inside the pipe.","Îndepărtează cordonul de sudură din interiorul țevii."],["Take a photo of the weld bead.","Fă o poză cordonului de sudură."],["The weld bead has a groove in the middle.","Cordonul de sudură are un șanț la mijloc."],["The welding coordinator checked the weld bead.","Responsabilul cu sudura a verificat cordonul de sudură."],["The weld bead is on both sides.","Cordonul de sudură este pe ambele părți."]],"degree of compaction":[["The degree of compaction is too low.","Gradul de compactare este prea mic."],["The laboratory measured the degree of compaction.","Laboratorul a măsurat gradul de compactare."],["Under the road, the degree of compaction is ninety eight percent.","Sub drum, gradul de compactare este de nouăzeci și opt la sută."],["The degree of compaction is in the report.","Gradul de compactare este în raport."],["We didn't reach the degree of compaction.","Nu am atins gradul de compactare."],["The degree of compaction depends on the water.","Gradul de compactare depinde de umiditate."],["Check the degree of compaction on each layer.","Verifică gradul de compactare pe fiecare strat."],["The degree of compaction is fine.","Gradul de compactare este în regulă."],["The client asks for the degree of compaction.","Clientul cere gradul de compactare."]],"compaction test":[["The compaction test is done by the laboratory.","Determinarea gradului de compactare se face de laborator."],["The compaction test failed, compact again.","Testul de compactare a picat, compactează din nou."],["We need a compaction test every fifty metres.","Avem nevoie de un test de compactare la fiecare cincizeci de metri."],["The compaction test takes ten minutes.","Testul de compactare durează zece minute."],["The compaction test results are good.","Rezultatele testului de compactare sunt bune."],["Call the laboratory for the compaction test.","Sună laboratorul pentru testul de compactare."],["The compaction test uses a nuclear gauge.","Testul de compactare folosește un densimetru nuclear."],["The compaction test report is signed.","Raportul testului de compactare este semnat."],["The compaction test costs money.","Testul de compactare costă bani."]],"plate load test":[["The plate load test checks the soil strength.","Încercarea cu placa verifică rezistența terenului."],["The plate load test is done before the asphalt.","Încercarea cu placa se face înainte de asfalt."],["The plate load test needs a heavy truck.","Încercarea cu placa are nevoie de un camion greu."],["The plate load test passed.","Încercarea cu placa a trecut."],["The plate load test failed in two places.","Încercarea cu placa a picat în două locuri."],["The laboratory did the plate load test.","Laboratorul a făcut încercarea cu placa."],["The plate load test takes one hour.","Încercarea cu placa durează o oră."],["The plate load test results are in the file.","Rezultatele încercării cu placa sunt în dosar."],["The road company asked for a plate load test.","Firma de drumuri a cerut încercarea cu placa."]],"thrust block":[["The thrust block holds the bend in place.","Masivul de ancoraj ține curba la locul ei."],["Pour the thrust block before the test.","Toarnă masivul de ancoraj înainte de probă."],["The thrust block is made of concrete.","Masivul de ancoraj este din beton."],["Without a thrust block, the pipe can move.","Fără masiv de ancoraj, țeava se poate mișca."],["The thrust block must touch the native soil.","Masivul de ancoraj trebuie să stea pe teren natural."],["We need a thrust block at every tee.","Avem nevoie de un masiv de ancoraj la fiecare teu."],["The thrust block needs seven days to cure.","Masivul de ancoraj are nevoie de șapte zile să se întărească."],["The thrust block is on the drawing.","Masivul de ancoraj este pe planșă."],["Put plastic between the pipe and the thrust block.","Pune folie între țeavă și masivul de ancoraj."]],"casing pipe":[["The casing pipe protects the water pipe.","Tubul de protecție protejează conducta de apă."],["The casing pipe is made of steel.","Tubul de protecție este din oțel."],["Push the pipe through the casing pipe.","Împinge țeava prin tubul de protecție."],["The casing pipe is under the railway.","Tubul de protecție este sub calea ferată."],["Close the ends of the casing pipe.","Închide capetele tubului de protecție."],["The casing pipe is bigger than the pipe.","Tubul de protecție este mai mare decât țeava."],["We need a casing pipe of 315.","Avem nevoie de un tub er hammer can break the pipe.","Lovitura de berbec poate sparge țeava."],["Close the valve slowly to avoid water hammer.","Închide vana încet ca să eviți lovitura de berbec."],["We heard a bang, it was water hammer.","Am auzit o bubuitură, a fost lovitura de berbec."],["The pressure vessel reduces water hammer.","Vasul de presiune reduce lovitura de berbec."],["Water hammer happens when a pump stops.","Lovitura de berbec apare când se oprește o pompă."],["The frequency converter helps against water hammer.","Convertizorul de frecvență ajută împotriva loviturii de berbec."],["The designer calculated the water hammer.","Proiectantul a calculat lovitura de berbec."],["Water hammer is dangerous for old pipes.","Lovitura de berbec este periculoasă pentru țevile vechi."],["The check valve slammed because of water hammer.","Clapeta s-a trântit din cauza loviturii de berbec."]],"flow rate":[["The flow rate is too low.","Debitul este prea mic."],["Measure the flow rate at the hydrant.","Măsoară debitul la hidrant."],["The flow rate is ten litres per second.","Debitul este de zece litri pe secundă."],["The pump has a high flow rate.","Pompa are un debit mare."],["The flow rate is higher in the morning.","Debitul este mai mare dimineața."],["The flow meter shows the flow rate.","Debitmetrul arată debitul."],["The designer chose the pipe by flow rate.","Proiectantul a ales țeava după debit."],["The flow rate changed after the repair.","Debitul s-a schimbat după reparație."],["The flow rate is in cubic metres per hour.","Debitul este în metri cubi pe oră."]],"natural gas":[["Natural gas is cheaper than wood.","Gazul natural este mai ieftin decât lemnele."],["The village wants natural gas.","Satul vrea gaze naturale."],["Natural gas has no smell, we add a smell.","Gazul natural nu are miros, i se adaugă unul."],["Natural gas is lighter than air.","Gazul natural este mai ușor decât aerul."],["The natural gas network is two hundred kilometres long.","Rețeaua de gaze naturale are două sute de kilometri."],["The houses will use natural gas for heating.","Casele vor folosi gaze naturale pentru încălzire."],["Working with natural gas needs authorisation.","Lucrul cu gaze naturale necesită autorizare."],["The natural gas pipe is yellow.","Conducta de gaze naturale este galbenă."],["Natural gas comes from the main pipeline.","Gazul natural vine din conducta magistrală."]],"gas pipeline":[["The gas pipeline is under the road.","Conducta de gaze este sub drum."],["Don't dig near the gas pipeline.","Nu săpa lângă conducta de gaze."],["The gas pipeline is made of PE 100.","Conducta de gaze este din PE 100."],["The gas pipeline has a yellow tape above.","Conducta de gaze are bandă galbenă deasupra."],["We will build a gas pipeline to the village.","Vom construi o conductă de gaze până în sat."],["The gas pipeline was tested with air.","Conducta de gaze a fost testată cu aer."],["The gas pipeline has valves every kilometre.","Conducta de gaze are vane la fiecare kilometru."],["The gas pipeline is marked with posts.","Conducta de gaze este marcată cu borne."],["The gas pipeline must be far from the water pipe.","Conducta de gaze trebuie să fie departe de conducta de apă."]],"gas service connection":[["The gas service connection ends at the regulator.","Branșamentul de gaz se termină la regulator."],["We made twenty gas service connections.","Am făcut douăzeci de branșamente de gaz."],["The gas service connection is made of PE 32.","Branșamentul de gaz este din PE 32."],["The owner pays for the gas service connection.","Proprietarul plătește branșamentul de gaz."],["The gas service connection needs a permit.","Branșamentul de gaz necesită aviz."],["The gas service connection was tested.","Branșamentul de gaz a fost testat."],["The gas service connection goes up the wall.","Branșamentul de gaz urcă pe perete."],["The gas service connection is ready for the meter.","Branșamentul de gaz este gata pentru contor."],["Only an authorised company can make a gas service connection.","Doar o firmă autorizată poate face un branșament de gaz."]],"medium pressure":[["Medium pressure is up to six bar.","Presiunea medie este de până la șase bari."],["The main network is medium pressure.","Rețeaua principală este de presiune medie."],["Medium pressure needs a regulator at each house.","Presiunea medie necesită regulator la fiecare casă."],["We test medium pressure pipes at six bar.","Testăm conductele de presiune medie la șase bari."],["The medium pressure pipe is thicker.","Conducta de presiune medie are peretele mai gros."],["Medium pressure is more dangerous.","Presiunea medie este mai periculoasă."],["The medium pressure network is new.","Rețeaua de presiune medie este nouă."],["We work on medium pressure in Dej.","Lucrăm la presiune medie în Dej."],["The authorisation is for medium pressure.","Autorizația este pentru presiune medie."]],"low pressure":[["Low pressure is inside the house.","În casă presiunea este redusă."],["The stove works on low pressure.","Aragazul funcționează la presiune redusă."],["Low pressure is safer.","Presiunea redusă este mai sigură."],["The regulator gives low pressure.","Regulatorul dă presiune redusă."],["Low pressure is measured in millibar.","Presiunea redusă se măsoară în milibari."],["The old network is low pressure.","Rețeaua veche este de presiune redusă."],["Low pressure pipes are smaller.","Țevile de presiune redusă sunt mai mici."],["The water has low pressure on the hill.","Apa are presiune scăzută pe deal."],["Low pressure makes the shower weak.","Presiunea scăzută face dușul slab."]],"pressure regulator":[["The pressure regulator reduces the gas pressure.","Regulatorul de presiune reduce presiunea gazului."],["The pressure regulator is in a small box.","Regulatorul de presiune este într-o cutie mică."],["The pressure regulator is broken.","Regulatorul de presiune este defect."],["Install the pressure regulator before the meter.","Montează regulatorul de presiune înaintea contorului."],[ st semnat ieri."],["Keep the covered works report in the technical book.","Păstrează procesul-verbal de lucrări ascunse în cartea tehnică."]],"pressure test report":[["The pressure test report shows the results.","Procesul-verbal de probă de presiune arată rezultatele."],["The pressure test report has the gauge readings.","Procesul-verbal de probă de presiune are citirile manometrului."],["Sign the pressure test report.","Semnează procesul-verbal de probă de presiune."],["The pressure test report is needed for acceptance.","Procesul-verbal de probă de presiune este necesar la recepție."],["The pressure test report has the date and time.","Procesul-verbal de probă de presiune are data și ora."],["The pressure test report is for two sections.","Procesul-verbal de probă de presiune este pentru două tronsoane."],["The client wants the pressure test report by email.","Clientul vrea procesul-verbal de probă de presiune pe e-mail."],["The pressure test report has a mistake.","Procesul-verbal de probă de presiune are o greșeală."],["The pressure test report is signed by three people.","Procesul-verbal de probă de presiune este semnat de trei persoane."]],"as-built drawings":[["The as-built drawings show the real position.","Planurile as-built arată poziția reală."],["The surveyor makes the as-built drawings.","Topograful face planurile as-built."],["We need the as-built drawings for acceptance.","Avem nevoie de planurile as-built la recepție."],["The as-built drawings are different from the design.","Planurile as-built diferă de proiect."],["Send the as-built drawings to the water company.","Trimite planurile as-built companiei de apă."],["The as-built drawings are in AutoCAD.","Planurile as-built sunt în AutoCAD."],["The as-built drawings show every valve.","Planurile as-built arată fiecare vană."],["The as-built drawings are late.","Planurile as-built întârzie."],["Check the as-built drawings before printing.","Verifică planurile as-built înainte de printare."]],"construc
