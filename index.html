<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Benglish"><title>Benglish</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style><style>
/* Layout: o singură coloană de telefon, ecrane care se schimbă; microfonul rotund e centrul fiecărui exercițiu de vorbit */
/* Layout: aplicație de telefon cu bară de file jos; fiecare categorie are culoarea ei, în tema șantierului (galben de avertizare + bleumarin) */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6782; --line:#DCE3EC;
  --accent:#2457E6; --accent-soft:#E3EBFD; --on-accent:#FFFFFF;
  --ok:#0F8A50; --ok-soft:#DCF4E6; --bad:#D2382C; --bad-soft:#FCE4E1; --mark:#FFC629;
  --navy:#14213D; --on-navy:#FFFFFF;
  --c-learn:#2457E6; --c-speak:#F06A2E; --c-play:#0E9F9A; --c-gram:#8A55D9; --c-test:#D63A6A; --c-diag:#E0A100; --c-text:#1F9D55;
  --sh:0 1px 2px rgba(20,33,61,.06),0 6px 18px rgba(20,33,61,.07);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1220; --surface:#151E30; --ink:#EAF0F8; --muted:#9AA8C0; --line:#26324A;
  --accent:#7FA2FF; --accent-soft:#1C2A4D; --on-accent:#0C1220;
  --ok:#4CCB8A; --ok-soft:#143326; --bad:#F2806F; --bad-soft:#3A1E1C; --mark:#FFC629;
  --navy:#1B2A4C; --on-navy:#FFFFFF;
  --c-learn:#7FA2FF; --c-speak:#FF8A57; --c-play:#3CC9C3; --c-gram:#B48CF2; --c-test:#F06C95; --c-diag:#FFC629; --c-text:#4CCB8A;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#151E30; --ink:#EAF0F8; --muted:#9AA8C0; --line:#26324A;
  --accent:#7FA2FF; --accent-soft:#1C2A4D; --on-accent:#0C1220;
  --ok:#4CCB8A; --ok-soft:#143326; --bad:#F2806F; --bad-soft:#3A1E1C; --mark:#FFC629;
  --navy:#1B2A4C; --on-navy:#FFFFFF;
  --c-learn:#7FA2FF; --c-speak:#FF8A57; --c-play:#3CC9C3; --c-gram:#B48CF2; --c-test:#F06C95; --c-diag:#FFC629; --c-text:#4CCB8A;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 110px}
#app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding-block:12px;background:var(--bg)}
.bar-t{flex:1;font-family:var(--display);font-weight:600;font-size:1.05rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;font-size:1.2rem;display:grid;place-items:center}
.chip{font-family:var(--display);font-weight:800;background:var(--ink);color:var(--bg);border-radius:8px;padding:3px 9px;font-size:.85rem;letter-spacing:.04em}
.screen{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--sh)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;background:var(--accent);color:var(--on-accent);font-weight:700;min-height:48px;transition:transform .12s}
.btn:active,.tile:active,.li:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
svg.i{width:20px;height:20px;flex:none}
/* home */
.hello{padding-block:8px 4px;display:flex;flex-direction:column;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);line-height:1.25}
.today{background:var(--accent);color:var(--on-accent);border:0}
.today .muted{color:inherit;opacity:.85}
.today .btn{background:var(--on-accent);color:var(--accent)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:22px;height:8px;border-radius:4px;background:currentColor;opacity:.25}
.dots i.on{opacity:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{--c:var(--accent);background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:128px;position:relative;overflow:hidden}
.tile h3{font-size:1.06rem}
.tile p{font-size:.84rem;color:var(--muted);line-height:1.35}
.tile .ico{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px color-mix(in srgb,var(--c) 35%,transparent)}
.tile .ico svg{width:22px;height:22px}
.tile .pill{position:absolute;top:12px;right:12px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--c);color:#fff}
.tile.flag{border-color:var(--c);box-shadow:0 0 0 1.5px var(--c) inset}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.tile.wide .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t-learn{--c:var(--c-learn)}.t-speak{--c:var(--c-speak)}.t-play{--c:var(--c-play)}.t-gram{--c:var(--c-gram)}.t-test{--c:var(--c-test)}.t-diag{--c:var(--c-diag)}.t-text{--c:var(--c-text)}
.t-diag .ico{color:#14213D}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.sec h2{font-size:1.2rem}
/* card principal */
.hero{background:var(--navy);color:var(--on-navy);border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:repeating-linear-gradient(-45deg,var(--mark) 0 12px,#14213D 12px 24px)}
.hero .hi{display:flex;align-items:center;gap:12px;margin-top:4px}
.hero .lvbadge{width:52px;height:52px;border-radius:14px;background:var(--mark);color:#14213D;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;flex:none}
.hero h1{font-size:1.6rem}
.hero .sub{opacity:.8;font-size:.9rem}
.hero .xpbar{background:rgba(255,255,255,.18)}
.hero .hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .hs{background:rgba(255,255,255,.08);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.hero .hs b{font-family:var(--display);font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .hs span{font-size:.75rem;opacity:.8;line-height:1.2}
.hero .today2{background:rgba(255,255,255,.08);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.hero .dots i{background:var(--mark)}
.hero .btn{background:var(--mark);color:#14213D}
.hero .rankbtn{background:none;border:0;color:inherit;text-align:left;padding:0;display:flex;flex-direction:column;gap:6px}
/* bara de file */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.7rem;font-weight:700;color:var(--muted);border-radius:12px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}
.tabs button.on .tico{background:var(--mark);color:#14213D}
.tabs .tico{width:44px;height:28px;border-radius:999px;display:grid;place-items:center}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
/* quiz */
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .3s}
.qn{font-size:.85rem;color:var(--muted)}
.qp{font-size:1.25rem;font-family:var(--display);font-weight:600;line-height:1.3}
.qp b{background:linear-gradient(transparent 58%,var(--mark) 58%);color:var(--ink);padding:0 2px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-height:52px;font-weight:600;box-shadow:0 1px 2px rgba(20,33,61,.05)}
@media (hover:hover){.opt:hover:not([disabled]){border-color:var(--muted)}}
.opt.mine{border-color:var(--ink);border-width:2px;font-weight:700}
.tnav{display:flex;justify-content:space-between;gap:10px}
.rev{display:flex;flex-direction:column;gap:12px}
.ri{display:flex;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ri:last-child{border-bottom:0;padding-bottom:0}
.rn{font-family:var(--display);font-weight:800;min-width:40px;font-variant-numeric:tabular-nums}
.ri.ok .rn{color:var(--ok)}.ri.bad .rn{color:var(--bad)}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rq{font-weight:600}
.rq b{background:linear-gradient(transparent 58%,var(--mark) 58%);color:var(--ink);padding:0 2px}
.ra{font-size:.95rem;border-radius:8px;padding:4px 9px;align-self:flex-start}
.ra.ok{background:var(--ok-soft);color:var(--ok)}
.ra.bad{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.typef{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],textarea,.typef input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:130px;resize:vertical}
.fb{display:flex;flex-direction:column;gap:10px}
.verdict{border-radius:10px;padding:10px 12px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
/* word card */
.word{font-family:var(--display);font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1;overflow-wrap:anywhere}
.tr{font-size:1.15rem}
.ex{border-left:3px solid var(--mark);padding-left:12px;font-style:italic}
.counter{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
/* pronunciation */
.pron{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pron-target{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.3}
.pron-target.hid{color:var(--muted);font-size:1.1rem;font-style:italic}
.pron-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;position:relative}
.mic svg{width:34px;height:34px}
.mic.on{background:var(--bad);color:#fff}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{from{transform:scale(.92);opacity:1}to{transform:scale(1.25);opacity:0}}
.mic-l{font-size:.85rem;color:var(--muted)}
.pron-res{width:100%;display:flex;flex-direction:column;gap:8px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wchip{padding:3px 9px;border-radius:7px;font-weight:700}
.wchip.ok{background:var(--ok-soft);color:var(--ok)}
.wchip.bad{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.diag{width:100%;height:auto;display:block}
.diag .soil{fill:var(--line)}
.diag .top{fill:var(--ok-soft);stroke:var(--ink);stroke-width:1}
.diag .grass{fill:none;stroke:var(--ok);stroke-width:1.5}
.diag .bfill{fill:color-mix(in srgb,var(--line) 55%,var(--surface))}
.diag .lay{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.diag .sand2{fill:color-mix(in srgb,var(--mark) 70%,#b8860b);stroke:var(--ink);stroke-width:1}
.diag .lvl{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.diag .dim{fill:none;stroke:var(--ink);stroke-width:1.5}
.diag .con{fill:color-mix(in srgb,var(--muted) 45%,var(--surface));stroke:var(--ink);stroke-width:1.5}
.diag .wat{fill:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.diag .p2{fill:none;stroke:var(--accent);stroke-width:7}
.diag .p3{fill:none;stroke:var(--ink);stroke-width:5}
.diag .pole{fill:none;stroke:var(--ink);stroke-width:6}
.diag .el{fill:none;stroke:var(--bad);stroke-width:2}
.diag .el.dash{stroke-dasharray:5 3}
.diag .fence{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.diag .hl>*{fill:transparent;stroke:none;cursor:pointer}
.diag .hl.on>*{fill:color-mix(in srgb,var(--ok) 40%,transparent);stroke:var(--ok);stroke-width:3}
.diag .hl.wrong>*{fill:color-mix(in srgb,var(--bad) 35%,transparent);stroke:var(--bad);stroke-width:3}
.diag .okc{fill:var(--ok);stroke:var(--ink);stroke-width:1}
.diag .lbl{font:600 10px var(--body);fill:var(--ink)}
.diag .wat2{fill:color-mix(in srgb,var(--accent) 25%,var(--surface));stroke:var(--ink);stroke-width:2}
.diag .air{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:4 3}
.diag .sl{fill:none;stroke:#8a6436;stroke-width:3}
.diag .bubl circle{fill:var(--surface);stroke:var(--accent);stroke-width:1}
.diag .lead{fill:none;stroke:var(--ink);stroke-width:1}
.diag .bub{cursor:pointer}
.diag .bub circle{fill:var(--ink);stroke:var(--surface);stroke-width:1.5}
.diag .bub text{fill:var(--bg);font:700 10px var(--body)}
.diag .bub.on circle{fill:var(--accent)}
.diag .bub.on text{fill:var(--on-accent)}
.diag .bub.good circle{fill:var(--ok)}
.diag .bub.badb circle{fill:var(--bad)}
.diag .bub.good text,.diag .bub.badb text{fill:#fff}
.after{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.av{border-radius:50%;background:var(--avc);color:#fff;display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--avc) 25%,transparent)}
.av.plus{--avc:var(--line);color:var(--ink);width:64px;height:64px;font-size:30px;box-shadow:none;border:2px dashed var(--muted);background:transparent}
.profgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prof{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--sh)}
.prof b{font-family:var(--display);font-size:1.1rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof span:not(.av){font-size:.8rem;color:var(--muted)}
.prof.on{border-color:var(--mark);box-shadow:0 0 0 2px var(--mark) inset,var(--sh)}
.prof.add{background:transparent;box-shadow:none;border-style:dashed}
.hero .swp{position:absolute;top:18px;right:14px;background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;opacity:.95;z-index:1}
.hero .rankbtn{padding-right:64px}
.li.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.heard{font-size:.9rem;color:var(--muted)}
.ill{display:block;width:100%;max-width:230px;height:auto;margin:0 auto}
.ill-s{width:44px;height:33px;flex:none}
.ill .p,.ill-s .p{fill:none;stroke:var(--accent);stroke-width:18;stroke-linejoin:round}
.ill .o,.ill-s .o{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ill .f,.ill-s .f{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.ill .y,.ill-s .y{fill:var(--mark);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.ill .k,.ill-s .k{fill:var(--ink)}
.ill .w,.ill-s .w{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.ill .r,.ill-s .r{fill:var(--bad);stroke:var(--ink);stroke-width:2}
.ill .s,.ill-s .s{fill:var(--line);stroke:var(--ink);stroke-width:2.5}
.ill .st,.ill-s .st{fill:none;stroke:var(--muted);stroke-width:5}
.ill .beam,.ill-s .beam{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-dasharray:6 4}
.ill .tx,.ill-s .tx{font:800 15px var(--display);fill:#13212A;letter-spacing:.08em}
.picbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;width:max-content;max-width:min(440px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.95rem;line-height:1.35}
.toast.lvl{background:var(--accent);color:var(--on-accent)}
.toast.badge{border-left:6px solid var(--mark)}
.rank{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;width:100%}
.rank .top{display:flex;align-items:center;gap:12px}
.rank .lvbadge{width:48px;height:48px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;flex:none}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--mark)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.bdg .med{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--mark);color:#13212A;font-weight:800;font-family:var(--display)}
.bdg.locked{opacity:.5}
.bdg.locked .med{background:var(--line);color:var(--muted)}
.bdg b{font-size:.92rem;line-height:1.2}
.bdg span{font-size:.78rem;color:var(--muted);line-height:1.25}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px}
/* list items */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;width:100%;box-shadow:0 1px 2px rgba(20,33,61,.05)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-family:var(--display);font-weight:600}
.li .t span{font-size:.85rem;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.8rem}
.tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.mini{width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--ok)}
.domcard{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px}
.domcard .tags{display:flex;flex-wrap:wrap;gap:6px}
.domcard .tags span{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.lv{font-family:var(--display);font-weight:800;font-size:.75rem;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
/* match game */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .opt{text-align:center;padding:12px 8px;font-size:.95rem}
.match .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.match .opt.gone{opacity:.25;border-color:var(--ok)}
/* sentence builder */
.slot{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font-weight:700}
.tok.used{visibility:hidden}
.bank{display:flex;flex-wrap:wrap;gap:6px}
/* results */
.big{font-family:var(--display);font-size:3.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.levels div{text-align:center;padding:8px 2px;border-radius:8px;background:var(--line);font-family:var(--display);font-weight:800;font-size:.9rem}
.levels div.on{background:var(--accent);color:var(--on-accent)}
.levels div small{display:block;font-family:var(--body);font-weight:400;font-size:.62rem;line-height:1.1}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:8px;font-size:.9rem}
.bars.wide .b{grid-template-columns:minmax(0,1.5fr) 1fr 34px}
.bars .b i{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:block}
.bars .b i span{display:block;height:100%;background:var(--accent)}
.rule{white-space:pre-line}
.ai{white-space:pre-wrap;font-size:.98rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
.confirm{border:1.5px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.word{font-size:2.1rem}.grid{grid-template-columns:1fr}}

mântul tare cu târnăcopul.","Pass me the hammer, please.":"Dă-mi ciocanul, te rog.","Use the sledgehammer to drive the pegs.":"Folosește barosul ca să bați țărușii.","Fill the wheelbarrow with sand.":"Umple roaba cu nisip.","Bring a bucket of water.":"Adu o găleată cu apă.","Level the sand with a rake.":"Nivelează nisipul cu grebla.","Lift the manhole cover with a crowbar.":"Ridică capacul căminului cu ranga.","The truck brings the pipes tomorrow.":"Camionul aduce țevile mâine.","The dump truck takes the soil away.":"Basculanta duce pământul.","The dumper carries sand along the trench.":"Dumperul cară nisip de-a lungul șanțului.","The excavator digs the trench.":"Excavatorul sapă șanțul.","The backhoe loader is on site.":"Buldoexcavatorul este pe șantier.","Use the mini excavator in the yard.":"Folosește miniexcavatorul în curte.","Always wear your hard hat.":"Poartă mereu casca de protecție.","Safety boots are required on site.":"Bocancii de protecție sunt obligatorii pe șantier.","Wear gloves when you handle the pipes.":"Poartă mănuși când manevrezi țevile.","Put on your protective clothing.":"Îmbracă-ți costumul de protecție.","Put on your high-visibility vest.":"Îmbracă-ți vesta reflectorizantă.","We need two labourers for the trench.":"Avem nevoie de doi muncitori necalificați la șanț.","The truck driver brings the sand.":"Șoferul de camion aduce nisipul.","The machine operator starts the excavator at seven.":"Operatorul pornește excavatorul la șapte.","The mechanic repairs the roller.":"Mecanicul repară cilindrul compactor.","The plumber connects the water meter.":"Instalatorul montează apometrul.","Two pipe fitters lay the pipes.":"Doi montatori pozează țevile.","The drainlayer checks the slope of each pipe.":"Instalatorul de canalizare verifică panta fiecărei țevi.","Only an authorised gas fitter can work on the gas network.":"Doar un instalator autorizat poate lucra la rețeaua de gaze.","The welder has a valid certificate.":"Sudorul are autorizație valabilă.","The PE welder joins the pipes by electrofusion.":"Sudorul în polietilenă îmbină țevile prin electrofuziune.","The steel welder repairs the old steel pipe.":"Sudorul în oțel repară țeava veche de oțel.","The section manager organises the daily work.":"Șeful de punct de lucru organizează munca zilnică.","The project manager approves the schedule.":"Managerul de proiect aprobă graficul.","The contractor's representative signs the report.":"Reprezentantul antreprenorului semnează procesul-verbal.","The technical execution manager checks every stage.":"Responsabilul tehnic cu execuția verifică fiecare etapă.","The welding coordinator checks the welding records.":"Responsabilul tehnic cu sudura verifică fișele de sudură.","We use polyethylene pipe for drinking water.":"Folosim conductă de polietilenă pentru apa potabilă.","We use HDPE pipe for drinking water.":"Folosim țeavă PEHD pentru apa potabilă.","The sewer is made of PVC pipe.":"Canalul este din țeavă PVC.","Corrugated pipe is used for stormwater.":"Țeava corugată se folosește pentru apele pluviale.","The water main is a pressure pipe.":"Conducta principală de apă este o conductă de presiune.","This pipe section is fifty metres long.":"Acest tronson de conductă are cincizeci de metri.","What is the diameter of the pipe?":"Ce diametru are țeava?","The outer diameter is one hundred and ten millimetres.":"Diametrul exterior este de o sută zece milimetri.","We need more fittings for the connection.":"Avem nevoie de mai multe fitinguri pentru racord.","Install an elbow at the corner.":"Montează un cot la colț.","Install a 90 degree elbow here.":"Montează aici un cot la 90 de grade.","Use two 45 degree elbows instead of one.":"Folosește două coturi la 45 de grade în loc de unul.","Use a tee for the branch.":"Folosește un teu pentru ramificație.","An equal tee has three outlets of the same size.":"Un teu egal are trei ieșiri de aceeași mărime.","Use a reducing tee from 110 to 90.":"Folosește un teu redus de la 110 la 90.","Connect the side sewer with a Y branch.":"Leagă canalul lateral cu o ramificație în Y.","Put a reducer between the two pipes.":"Pune o reducție între cele două țevi.","Join the pipes with a coupling.":"Îmbină țevile cu o mufă.","Use a double socket to join two PVC pipes.":"Folosește o mufă dublă ca să îmbini două țevi PVC.","Close the pipe with an end cap.":"Închide țeava cu un dop de capăt.","Check the rubber seal ring before joining.":"Verifică garnitura inelară de cauciuc înainte de îmbinare.","Put lubricant on the spigot before you push it in.":"Pune lubrifiant pe capătul drept înainte să-l împingi.","These are injection moulded polyethylene fittings.":"Acestea sunt fitinguri injectate din polietilenă.","Weld it with an electrofusion coupling.":"Sudează-l cu un manșon de electrofuziune.","We need a 110 electrofusion elbow.":"Avem nevoie de un cot de electrofuziune de 110.","Install an electrofusion tee for the hydrant.":"Montează un teu de electrofuziune pentru hidrant.","Connect the electrofusion machine to the generator.":"Conectează aparatul de electrofuziune la generator.","HDPE pipes are joined by butt fusion.":"Țevile PEHD se îmbină prin sudură cap la cap.","The butt fusion machine heats both pipe ends.":"Aparatul de sudură cap la cap încălzește ambele capete ale țevii.","We use compression fittings for small diameters.":"Folosim fitinguri de compresiune la diametre mici.","Install a tapping saddle on the main.":"Montează un colier de branșament pe conducta principală.","Connect the pipe to the valve with a flange adapter.":"Leagă țeava de vană cu un adaptor de flanșă.","Replace the old gasket.":"Înlocuiește garnitura veche.","We laid two hundred metres of pipe today.":"Azi am pozat două sute de metri de țeavă.","Pipe laying starts after the bedding is ready.":"Pozarea conductei începe după ce patul de pozare e gata.","Lay the pipe on sand bedding.":"Pozează țeava pe pat de nisip.","Put ten centimetres of sand bedding.":"Pune zece centimetri de pat de nisip.","Cover the pipe with a sand surround.":"Învelește conducta cu nisip.","The trench width is eighty centimetres.":"Lățimea șanțului este de optzeci de centimetri.","The trench depth is one and a half metres.":"Adâncimea șanțului este de un metru și jumătate.","The minimum cover depth is one metre.":"Adâncimea minimă de acoperire este de un metru.","Use clean backfill material without stones.":"Folosește material de umplutură curat, fără pietre.","Keep the topsoil separate.":"Păstrează stratul vegetal separat.","The excess soil goes to the landfill.":"Pământul excedentar merge la groapa de depozitare.","Keep the spoil heap one metre from the trench.":"Ține pământul săpat la un metru de șanț.","The trucks haul away the excess soil.":"Camioanele transportă pământul excedentar.","Compact each layer.":"Compactează fiecare strat.","Compaction is done in layers of thirty centimetres.":"Compactarea se face în straturi de treizeci de centimetri.","Use the plate compactor in the trench.":"Folosește placa compactoare în șanț.","Use the rammer next to the manhole.":"Folosește maiul compactor lângă cămin.","The roller compacts the asphalt.":"Cilindrul compactează asfaltul.","Reinstatement of the road is included in the price.":"Aducerea drumului la starea inițială este inclusă în preț.","We cut the asphalt before digging.":"Tăiem asfaltul înainte de săpătură.","Cut the road with the road cutter.":"Taie drumul cu mașina de tăiat asfalt.","Lay the warning tape above the pipe.":"Pune banda de avertizare deasupra conductei.","The sewer warning tape is brown.":"Banda de avertizare pentru canalizare este maro.","The gas warning tape is yellow.":"Banda de avertizare pentru gaz este galbenă.","The electrical warning tape is red.":"Banda de avertizare electrică este roșie.","Lay a detection wire with plastic pipes.":"Pune un fir trasor la țevile din plastic.","The slope is two percent.":"Panta este de doi la sută.","The sewer needs a minimum gradient.":"Canalul are nevoie de o pantă minimă.","The setting out was done yesterday.":"Trasarea s-a făcut ieri.","The surveyor marked the axis of the pipe.":"Topograful a marcat axul conductei.","Put a peg every twenty metres.":"Pune un țăruș la fiecare douăzeci de metri.","Pull a string line along the trench.":"Întinde o sfoară de trasare de-a lungul șanțului.","Use the tape measure.":"Folosește ruleta.","Check it with the spirit level.":"Verifică-l cu nivela cu bulă.","The laser level shows the slope.":"Nivela laser arată panta.","The pipe laser sets the slope inside the pipe.":"Laserul de pantă stabilește panta în interiorul țevii.","Set up the rotating laser next to the trench.":"Montează nivela laser rotativă lângă șanț.","We checked the levels with an optical level.":"Am verificat cotele cu nivela optică.","Hold the levelling staff straight.":"Ține mira dreaptă.","All levels start from the datum point.":"Toate cotele pornesc de la reperul de nivel.","The ground level is two hundred metres.":"Cota terenului este de două sute de metri.","Check the invert level at each manhole.":"Verifică cota radierului la fiecare cămin.","The manhole is two metres deep.":"Căminul are doi metri adâncime.","The sewer manhole is made of concrete rings.":"Căminul de canalizare menajeră este din inele de beton.","Put the manhole cover back.":"Pune capacul căminului la loc.","Lift the manhole ring with the excavator.":"Ridică inelul căminului cu excavatorul.","Place the manhole cone on the last ring.":"Pune conul căminului pe ultimul inel.","The manhole base has two inlets.":"Baza căminului are două intrări.","Install an inspection chamber at the property line.":"Montează un cămin de racord la limita proprietății.","The valve chamber is at the crossroads.":"Căminul de vane este la intersecție.","The meter chamber is next to the fence.":"Căminul de apometru este lângă gard.","The water meter is in the meter chamber.":"Apometrul este în căminul de apometru.","Each house needs a service connection.":"Fiecare casă are nevoie de un branșament de apă.","We built fifty house connections.":"Am făcut cincizeci de racorduri de canalizare.","The water main burst last night.":"Conducta principală de apă s-a spart azi-noapte.","A gravity sewer needs a constant slope.":"Canalizarea gravitațională are nevoie de o pantă constantă.","The pumping station pushes sewage into the force main.":"Stația de pompare împinge apele uzate în conducta de refulare.","Sewage flows to the treatment plant.":"Apele uzate menajere curg spre stația de epurare.","Wastewater goes to the treatment plant.":"Apele uzate merg la stația de epurare.","Stormwater is collected separately.":"Apele pluviale se colectează separat.","The fire hydrant is painted red.":"Hidrantul este vopsit în roșu.","We installed an above ground hydrant.":"Am montat un hidrant suprateran.","The underground hydrant is under a small cover.":"Hidrantul subteran este sub un capac mic.","Close the valve before you start.":"Închide vana înainte să începi.","Open the gate valve slowly.":"Deschide încet vana cu sertar.","A knife gate valve is used for sewage.":"Vana cuțit se folosește pentru ape uzate.","The pumping station has two butterfly valves.":"Stația de pompare are două vane fluture.","The check valve stops the backflow.":"Clapeta de reținere oprește întoarcerea apei.","Install an air valve at the highest point.":"Montează un ventil de aerisire în punctul cel mai înalt.","Bring the valve key to close the main.":"Adu cheia de manevră ca să închidem conducta.","The valve box is level with the road.":"Capacul de protecție al vanei este la nivelul drumului.","The new water network is twelve kilometres long.":"Noua rețea de apă are doisprezece kilometri.","The sewer network collects wastewater from every street.":"Rețeaua de canalizare colectează apele uzate de pe fiecare stradă.","The wastewater pumping station lifts the sewage to the treatment plant.":"Stația de pompare a apelor uzate ridică apele uzate spre stația de epurare.","The drinking water pumping station fills the water tower.":"Stația de pompare a apei potabile umple castelul de apă.","The booster station raises the pressure for the houses on the hill.":"Stația de ridicare a presiunii crește presiunea pentru casele de pe deal.","The pumps sit at the bottom of the wet well.":"Pompele stau pe fundul bazinului stației.","The sewer enters the inlet chamber first.":"Canalul intră întâi în căminul de intrare.","The settling tank is in front of the pumping station.":"Decantorul este în fața stației de pompare.","The grit chamber removes sand from the wastewater.":"Deznisipatorul scoate nisipul din apele uzate.","The duty pump runs and the other one waits.":"Pompa activă funcționează, iar cealaltă așteaptă.","The standby pump starts if the duty pump fails.":"Pompa de rezervă pornește dacă pompa activă se defectează.","The float switch starts the pump when the level rises.":"Plutitorul pornește pompa când nivelul crește.","The level sensor sends the water level to the control panel.":"Senzorul de nivel trimite nivelul apei la tabloul de comandă.","Check the alarms on the control panel.":"Verifică alarmele pe tabloul de comandă.","The suction pipe takes water from the reservoir.":"Conducta de aspirație ia apa din rezervor.","Each pump has its own discharge pipe.":"Fiecare pompă are conducta ei de refulare.","The pressure main goes up the hill to the next manhole.":"Conducta de refulare urcă dealul până la căminul următor.","Start the pump.":"Pornește pompa.","Clean the Y strainer every month.":"Curăță filtrul Y în fiecare lună.","Any leaking water collects in the sump.":"Orice scurgere de apă se adună în bașă.","The sump pump empties the sump automatically.":"Pompa de bașă golește bașa automat.","Hold the access ladder with both hands.":"Ține scara de acces cu ambele mâini.","Lock the access hatch when you leave.":"Încuie capacul de acces când pleci.","The proximity sensor sends an alarm when the hatch opens.":"Senzorul de proximitate dă alarmă când se deschide capacul.","The ventilation fan runs before anyone goes inside.":"Ventilatorul pornește înainte să intre cineva.","The vent pipe lets the gases out.":"Țeava de aerisire scoate gazele afară.","The electric heater keeps the room above zero degrees.":"Radiatorul electric ține încăperea peste zero grade.","Seal the cable entry so water cannot get in.":"Etanșează intrarea cablurilor ca să nu intre apă.","The control panel is inside a fence.":"Tabloul de comandă este într-o împrejmuire.","Connect the control panel to the earthing rod.":"Leagă tabloul de comandă la priza de pământ.","The supply cable goes from the meter box to the control panel.":"Cablul de alimentare merge de la blocul de măsură la tabloul de comandă.","The three-phase metering box is on the power pole.":"Blocul de măsură trifazat (BMPT) este pe stâlpul electric.","The electricity meter is inside the metering box.":"Contorul electric este în blocul de măsură.","The electrical service connection goes from the pole to the meter box.":"Branșamentul electric merge de la stâlp la blocul de măsură.","The power pole is next to the road.":"Stâlpul electric este lângă drum.","The pumps need a three-phase supply.":"Pompele au nevoie de alimentare trifazată.","The house has a single-phase connection.":"Casa are branșament monofazat.","The trench wall is vertical and needs shoring.":"Peretele săpăturii este vertical și trebuie sprijinit.","The native soil here is clay.":"Terenul natural de aici este argilă.","Check the trench bottom level before bedding.":"Verifică cota fundului săpăturii înainte de patul de pozare.","The cover depth is measured to the pipe crown.":"Adâncimea de acoperire se măsoară până la creștetul conductei.","The inlet comes from the house.":"Intrarea vine de la casă.","The outlet goes to the street sewer.":"Ieșirea merge spre canalul de pe stradă.","The chamber body is made of PVC.":"Corpul căminului este din PVC.","The chamber base has an inlet and an outlet.":"Baza căminului are o intrare și o ieșire.","Put a cast iron cover on the road.":"Pune un capac din fontă pe drum.","The cover is set in a concrete collar.":"Capacul este prins într-o ramă de beton.","The chamber sits on a concrete support ring.":"Căminul stă pe un inel de stare din beton.","Close the inlet valve before changing the meter.":"Închide robinetul de intrare înainte să schimbi apometrul.","The outlet valve is after the water meter.":"Robinetul de ieșire este după apometru.","The dismantling joint lets us remove the valve.":"Piesa de montaj-demontaj ne permite să scoatem vana.","Open the washout valve to empty the pipe.":"Deschide robinetul de golire ca să golești conducta.","Turn off the main switch before you open the panel.":"Oprește întrerupătorul general înainte să deschizi tabloul.","The surge protector protects the panel from lightning.":"Descărcătorul de supratensiune protejează tabloul de trăsnet.","The circuit breaker tripped again.":"Siguranța automată a sărit din nou.","The contactor starts the pump motor.":"Contactorul pornește motorul pompei.","The frequency converter controls the pump speed.":"Convertizorul de frecvență controlează turația pompei.","The PLC starts and stops the pumps.":"PLC-ul pornește și oprește pompele.","The level relay stops the pump when the level is low.":"Releul de nivel oprește pompa când nivelul e scăzut.","The phase monitoring relay protects the motor.":"Releul de control al fazelor protejează motorul.","Connect the cables to the terminal block.":"Leagă cablurile la șirul de cleme.","The red indicator light means a fault.":"Lampa roșie de semnalizare înseamnă defect.","Press the start button.":"Apasă butonul de pornire.","Press the stop button to stop the pump.":"Apasă butonul de oprire ca să oprești pompa.","In danger, press the emergency stop.":"În caz de pericol, apasă oprirea de urgență.","Turn the selector switch to automatic.":"Pune comutatorul pe automat.","Tighten the cable gland so water cannot enter.":"Strânge presetupa ca să nu intre a Use a rubber hammer on the fittings.","Folosește un ciocan de cauciuc pe fitinguri."],["Don't hit the pipe with a hammer.","Nu lovi țeava cu ciocanul."],["Can I borrow your hammer?","Pot să-ți împrumut ciocanul?"],["The hammer and the nails are in the box.","Ciocanul și cuiele sunt în cutie."],["He hit his finger with the hammer.","S-a lovit la deget cu ciocanul."],["We need a bigger hammer for this.","Avem nevoie de un ciocan mai mare pentru asta."],["Put the hammer back in its place.","Pune ciocanul la locul lui."]],"sledgehammer":[["Break the block with the sledgehammer.","Sparge blocul cu barosul."],["The sledgehammer weighs five kilos.","Barosul are cinci kilograme."],["Hold the peg, I'll hit it with the sledgehammer.","Ține țărușul, îl bat eu cu barosul."],["Wear goggles when you use the sledgehammer.","Poartă ochelari când folosești barosul."],["We need two sledgehammers tomorrow.","Mâine avem nevoie de două baroase."],["The sledgehammer is too heavy for me.","Barosul e prea greu pentru mine."],["He broke the old manhole with a sledgehammer.","A spart căminul vechi cu barosul."],["Don't leave the sledgehammer on the road.","Nu lăsa barosul pe drum."],["Swing the sledgehammer slowly.","Ridică barosul încet."]],"wheelbarrow":[["Push the wheelbarrow to the trench.","Împinge roaba până la șanț."],["The wheelbarrow has a flat tyre.","Roaba are roata dezumflată."],["Don't fill the wheelbarrow too much.","Nu umple roaba prea tare."],["We carry the concrete with a wheelbarrow.","Cărăm betonul cu roaba."],["Wash the wheelbarrow after the concrete.","Spală roaba după beton."],["Where is the second wheelbarrow?","Unde este a doua roabă?"],["The wheelbarrow is full of stones.","Roaba este plină de pietre."],["Bring an empty wheelbarrow, please.","Adu o roabă goală, te rog."],["We need a new wheelbarrow.","Avem nevoie de o roabă nouă."]],"bucket":[["Fill the bucket with water.","Umple găleata cu apă."],["The bucket of the excavator is full of mud.","Cupa excavatorului e p tori sunt azi pe șantier?"],["He is our best worker.","Este cel mai bun muncitor al nostru."],["The workers have lunch at twelve.","Muncitorii iau prânzul la douăsprezece."],["One worker is sick today.","Un muncitor este bolnav azi."],["The worker forgot his hard hat.","Muncitorul și-a uitat casca."],["We pay the workers every month.","Le plătim muncitorilor în fiecare lună."],["The workers finished the trench early.","Muncitorii au terminat șanțul mai devreme."]],"labourer":[["The labourer cleans the site.","Muncitorul necalificat curăță șantierul."],["We hired three labourers for summer.","Am angajat trei muncitori necalificați pentru vară."],["The labourer carries the pipes.","Muncitorul necalificat cară țevile."],["Each labourer gets a shovel.","Fiecare muncitor necalificat primește o lopată."],["The labourer helps the pipe fitter.","Muncitorul necalificat îl ajută pe montator."],["A labourer is digging by hand.","Un muncitor necalificat sapă manual."],["The labourer wants to learn welding.","Muncitorul necalificat vrea să învețe sudura."],["We need another labourer tomorrow.","Mâine mai avem nevoie de un muncitor necalificat."],["The labourers start at seven.","Muncitorii necalificați încep la șapte."]],"truck driver":[["The truck driver is late.","Șoferul de camion întârzie."],["Call the truck driver.","Sună-l pe șoferul de camion."],["The truck driver needs the address.","Șoferul de camion are nevoie de adresă."],["The truck driver signed the delivery note.","Șoferul de camion a semnat avizul."],["The truck driver can't find the site.","Șoferul de camion nu găsește șantierul."],["Our truck driver has twenty years of experience.","Șoferul nostru de camion are douăzeci de ani de experiență."],["Show the truck driver where to unload.","Arată-i șoferului de camion unde să descarce."],["The truck driver works long hours.","Șoferul de camion lucrează multe ore."],["The truck driver brought the wrong pipes.","Șoferul de camion a adus țevile greșite."]],"machine oper tingurile."],["A good plumber is hard to find.","Un instalator bun e greu de găsit."],["The plumber works with the excavator team.","Instalatorul lucrează cu echipa de la excavator."],["The plumber finished ten connections today.","Instalatorul a terminat azi zece branșamente."]],"pipe fitter":[["The pipe fitter joins the pipes.","Montatorul îmbină țevile."],["We need an experienced pipe fitter.","Avem nevoie de un montator cu experiență."],["The pipe fitter checks the slope.","Montatorul verifică panta."],["The pipe fitter works in the trench.","Montatorul lucrează în șanț."],["Our pipe fitters laid one hundred metres today.","Montatorii noștri au pozat azi o sută de metri."],["The pipe fitter needs a new tool.","Montatorul are nevoie de o sculă nouă."],["Ask the pipe fitter about the fittings.","Întreabă-l pe montator despre fitinguri."],["The pipe fitter is also a welder.","Montatorul este și sudor."],["The pipe fitter works with two helpers.","Montatorul lucrează cu doi ajutori."]],"drainlayer":[["The drainlayer lays the sewer pipes.","Instalatorul de canalizare pozează țevile de canal."],["A good drainlayer checks every joint.","Un instalator de canalizare bun verifică fiecare îmbinare."],["The drainlayer uses a pipe laser.","Instalatorul de canalizare folosește un laser de pantă."],["We need two drainlayers next week.","Săptămâna viitoare avem nevoie de doi instalatori de canalizare."],["The drainlayer connected the house to the sewer.","Instalatorul de canalizare a racordat casa la canal."],["The drainlayer works carefully in deep trenches.","Instalatorul de canalizare lucrează atent în șanțuri adânci."],["Ask the drainlayer about the gradient.","Întreabă-l pe instalatorul de canalizare despre pantă."],["The drainlayer built the manhole base.","Instalatorul de canalizare a făcut baza căminului."],["Our drainlayer has ten years of experience.","Instalatorul nostru de canalizare are zece ani de experiență."]],"gas fitter":[["The gas fitter has an ANRE authorisa ng coordinator checks the welding machines.","Responsabilul tehnic cu sudura verifică aparatele de sudură."],["The welding coordinator signed the welding records.","Responsabilul tehnic cu sudura a semnat fișele de sudură."],["We need a welding coordinator for the gas work.","Avem nevoie de un responsabil tehnic cu sudura pentru lucrările de gaze."],["The welding coordinator found a bad weld.","Responsabilul tehnic cu sudura a găsit o sudură proastă."],["The welding coordinator writes the welding procedure.","Responsabilul tehnic cu sudura scrie procedura de sudură."],["The welding coordinator trains the new welders.","Responsabilul tehnic cu sudura îi instruiește pe sudorii noi."],["Call the welding coordinator before the test.","Sună-l pe responsabilul cu sudura înainte de probă."],["The welding coordinator keeps all the certificates.","Responsabilul tehnic cu sudura păstrează toate autorizațiile."]],"designer":[["The designer changed the route of the pipe.","Proiectantul a schimbat traseul conductei."],["Send the question to the designer.","Trimite întrebarea proiectantului."],["The designer will visit the site next week.","Proiectantul va veni pe șantier săptămâna viitoare."],["The designer made a mistake in the drawing.","Proiectantul a greșit în planșă."],["We are waiting for the designer's answer.","Așteptăm răspunsul proiectantului."],["The designer approved the new solution.","Proiectantul a aprobat soluția nouă."],["The designer works for a company in Iași.","Proiectantul lucrează pentru o firmă din Iași."],["Ask the designer for the longitudinal profile.","Cere-i proiectantului profilul longitudinal."],["The designer must sign the change.","Proiectantul trebuie să semneze modificarea."]],"polyethylene pipe":[["Polyethylene pipe is light and flexible.","Conducta de polietilenă este ușoară și flexibilă."],["We weld polyethylene pipe by electrofusion.","Sudăm conducta de polietilenă prin electrofuziune."],["The polyethylene pipe comes in coils.","Conducta de polietilenă vine în colaci."],["Protect the polyethylene pipe from sharp stones.","Protejează conducta de polietilenă de pietrele ascuțite."],["Polyethylene pipe doesn't rust.","Conducta de polietilenă nu ruginește."],["The gas network uses yellow polyethylene pipe.","Rețeaua de gaze folosește conductă galbenă de polietilenă."],["Order two hundred metres of polyethylene pipe.","Comandă două sute de metri de conductă de polietilenă."],["The polyethylene pipe was damaged during transport.","Conducta de polietilenă s-a deteriorat la transport."],["Polyethylene pipe lasts more than fifty years.","Conducta de polietilenă durează peste cincizeci de ani."]],"HDPE pipe":[["The HDPE pipe has a blue stripe.","Țeava PEHD are o dungă albastră."],["We need HDPE pipe of 110 millimetres.","Avem nevoie de țeavă PEHD de 110 milimetri."],["HDPE pipe is used for the water main.","Țeava PEHD se folosește pentru conducta principală de apă."],["Cut the HDPE pipe with a special cutter.","Taie țeava PEHD cu un dispozitiv special."],["The HDPE pipe is rated for ten bar.","Țeava PEHD este pentru zece bari."],["Store the HDPE pipe on a flat surface.","Depozitează țeava PEHD pe o suprafață plană."],["HDPE pipe is easy to weld.","Țeava PEHD se sudează ușor."],["The supplier delivered the HDPE pipe today.","Furnizorul a livrat azi țeava PEHD."],["Check the label on the HDPE pipe.","Verifică eticheta de pe țeava PEHD."]],"PVC pipe":[["PVC pipe is orange for sewers.","Țeava PVC pentru canalizare este portocalie."],["Push the PVC pipe into the socket.","Împinge țeava PVC în mufă."],["The PVC pipe broke in the cold.","Țeava PVC s-a spart din cauza frigului."],["We use PVC pipe of 250 for the main sewer.","Folosim țeavă PVC de 250 pentru colector."],["PVC pipe needs a good sand bedding.","Țeava PVC are nevoie de un pat de nisip bun."],["Cut the PVC pipe with a saw.","Taie țeava PVC cu fierăstrăul."],["The PVC pipe is six metres long.","Țeava PVC are șase metri lungime."],["Don't walk on the PVC pipe.","Nu călca pe țeava PVC."],["The house connection is made of PVC pipe of 160.","Racordul casei este din țeavă PVC de 160."]],"corrugated pipe":[["Corrugated pipe is strong but light.","Țeava corugată este rezistentă, dar ușoară."],["We use corrugated pipe under the road.","Folosim țeavă corugată sub drum."],["The corrugated pipe has a smooth inside.","Țeava corugată are interiorul neted."],["Corrugated pipe is good for drainage.","Țeava corugată e bună pentru drenaj."],["Order corrugated pipe of 400 for the stormwater.","Comandă țeavă corugată de 400 pentru apele pluviale."],["The corrugated pipe arrived in black.","Țeava corugată a venit neagră."],["Join the corrugated pipe with a coupling.","Îmbină țeava corugată cu o mufă."],["Corrugated pipe is cheaper than concrete.","Țeava corugată e mai ieftină decât cea de beton."],["The corrugated pipe goes to the ditch.","Țeava corugată merge spre rigolă."]],"pressure pipe":[["A pressure pipe must pass the pressure test.","O conductă de presiune trebuie să treacă proba de presiune."],["The pressure pipe carries water uphill.","Conducta de presiune duce apa în sus, pe deal."],["Use a pressure pipe for the force main.","Folosește conductă de presiune pentru refulare."],["This pressure pipe is rated for sixteen bar.","Această conductă de presiune este pentru șaisprezece bari."],["The pressure pipe has thick walls.","Conducta de presiune are pereți groși."],["Check the joints of the pressure pipe.","Verifică îmbinările conductei de presiune."],["The pressure pipe needs thrust blocks.","Conducta de presiune are nevoie de masive de ancoraj."],["The old pressure pipe was made of steel.","Vechea conductă de presiune era din oțel."],["We repaired the pressure pipe at night.","Am reparat conducta de presiune noaptea."]],"pipe section":[["We tested the first pipe section today.","Azi am testat primul tronson de conductă."],["This pipe section goes from manhole one to manhole two.","Acest tronson merge de la căminul unu la căminul doi."],["The pipe section is finished and tested.","Tronsonul de conductă este gata și testat."],["Each pipe section needs a report.","Fiecare tronson are nevoie de un proces-verbal."],["Replace the damaged pipe section.","Înlocuiește tronsonul de conductă deteriorat."],["The next pipe section is under the road.","Următorul tronson este sub drum."],["How long is this pipe section?","Cât de lung este acest tronson?"],["We backfilled the pipe section yesterday.","Am umplut tronsonul de conductă ieri."],["The last pipe section is the hardest.","Ultimul tronson este cel mai greu."]],"diameter":[["The diameter of the main pipe is 200.","Diametrul conductei principale este 200."],["Measure the diameter before you order.","Măsoară diametrul înainte să comanzi."],["We need fittings of the same diameter.","Avem nevoie de fitinguri de același diametru."],["A bigger diameter means more flow.","Un diametru mai mare înseamnă debit mai mare."],["The diameter is written on the pipe.","Diametrul este scris pe țeavă."],["The house connection has a small diameter.","Branșamentul are diametru mic."],["What diameter is the old pipe?","Ce diametru are țeava veche?"],["The designer increased the diameter.","Proiectantul a mărit diametrul."],["Pipes of large diameter are expensive.","Țevile cu diametru mare sunt scumpe."]],"outer diameter":[["HDPE pipes are measured by outer diameter.","Țevile PEHD se măsoară după diametrul exterior."],["The outer diameter of this pipe is 63.","Diametrul exterior al acestei țevi este 63."],["Check the outer diameter with a tape.","Verifică diametrul exterior cu ruleta."],["The coupling must match the outer diameter.","Manșonul trebuie să se potrivească cu diametrul exterior."],["The outer diameter is printed on the label.","Diametrul exterior este tipărit pe etichetă."],["Two pipes with the same outer diameter can have different walls.","Două țevi cu același diametru exterior pot avea pereți diferiți."],["The outer diameter is 110 millimetres.","Diametrul exterior este de 110 milimetri."],["Measure the outer diameter after scraping.","Măsoară diametrul exterior după răzuire."],["The tapping saddle depends on the outer diameter.","Colierul de branșament depinde de diametrul exterior."]],"fitting":[["This fitting is the wrong size.","Fitingul acesta are mărimea greșită."],["Order the fittings with the pipes.","Comandă fitingurile odată cu țevile."],["Check the fitting for cracks.","Verifică fitingul să nu aibă fisuri."],["We have a box of fittings in the van.","Avem o cutie de fitinguri în dubă."],["The fitting is made of brass.","Fitingul este din alamă."],["Tighten the fitting by hand first.","Strânge fitingul întâi cu mâna."],["The leak is at the fitting.","Pierderea este la fiting."],["Which fitting do we need here?","Ce fiting ne trebuie aici?"],["Every fitting has a code.","Fiecare fiting are un cod."]],"elbow":[["The pipe turns with an elbow.","Țeava face o întoarcere cu un cot."],["We need four elbows for this connection.","Avem nevoie de patru coturi pentru acest branșament."],["The elbow is too close to the wall.","Cotul este prea aproape de perete."],["Weld the elbow to the pipe.","Sudează cotul de țeavă."],["Put a thrust block behind the elbow.","Pune un masiv de ancoraj în spatele cotului."],["This elbow is for PVC pipe.","Cotul acesta este pentru țeavă PVC."],["The elbow is broken, change it.","Cotul e spart, schimbă-l."],["There is an elbow at the end of the street.","Este un cot la capătul străzii."],["Avoid too many elbows in a sewer.","Evită prea multe coturi într-un canal."]],"90 degree elbow":[["A 90 degree elbow changes the direction completely.","Un cot la 90 de grade schimbă complet direcția."],["Don't use a 90 degree elbow in the sewer.","Nu folosi cot la 90 de grade în canalizare."],["The 90 degree elbow goes up to the water meter.","Cotul la 90 de grade urcă spre apometru."],["We need a 90 degree elbow of 32.","Avem nevoie de un cot la 90 de grade de 32."],["The 90 degree elbow is at the corner of the house.","Cotul la 90 de grade este la colțul casei."],["A 90 degree elbow causes more pressure loss.","Un cot la 90 de grade produce o pierdere de presiune mai mare."],["Fix the 90 degree elbow with a concrete block.","Fixează cotul la 90 de grade cu un bloc de beton."],["The 90 degree elbow arrived with the fittings.","Cotul la 90 de grade a venit cu fitingurile."],["Install the 90 degree elbow after the valve.","Montează cotul la 90 de grade după vană."]],"45 degree elbow":[["Use a 45 degree elbow for a soft turn.","Folosește un cot la 45 de grade pentru o întoarcere lină."],["Two 45 degree elbows are better than one at ninety.","Două coturi la 45 de grade sunt mai bune decât unul la nouăzeci."],["The 45 degree elbow is for PVC pipe of 160.","Cotul la 45 de grade este pentru țeavă PVC de 160."],["Put the 45 degree elbow before the manhole.","Pune cotul la 45 de grade înainte de cămin."],["We ran out of 45 degree elbows.","Am rămas fără coturi la 45 de grade."],["A 45 degree elbow keeps the flow smooth.","Un cot la 45 de grade păstrează curgerea lină."],["The 45 degree elbow fits into the socket.","Cotul la 45 de grade intră în mufă."],["Order ten 45 degree elbows.","Comandă zece coturi la 45 de grade."],["The 45 degree elbow is on the drawing.","Cotul la 45 de grade este pe planșă."]],"tee":[["Install a tee for the new branch.","Montează un teu pentru ramificația nouă."],["The tee connects three pipes.","Teul leagă trei țevi."],["The hydrant is connected with a tee.","Hidrantul este legat cu un teu."],["This tee is for 110 pipe.","Acest teu este pentru țeavă de 110."],["Close the tee with an end cap.","Închide teul cu un dop."],["The tee is leaking.","Teul pierde apă."],["Weld the tee before the pressure test.","Sudează teul înainte de proba de presiune."],["We need a steel tee for the old main.","Avem nevoie de un teu de oțel pentru conducta veche."],["Put a valve after the tee.","Pune o vană după teu."]],"equal tee":[["An equal tee has three outlets of une să se răcească."],["We repaired the leak with an electrofusion coupling.","Am reparat pierderea cu un manșon de electrofuziune."],["The electrofusion coupling is for 63 pipe.","Manșonul de electrofuziune este pentru țeavă de 63."],["Don't move the pipe during the electrofusion coupling weld.","Nu mișca țeava în timpul sudurii manșonului de electrofuziune."],["The electrofusion coupling indicators popped up.","Indicatorii manșonului de electrofuziune au ieșit."],["Order more electrofusion couplings.","Comandă mai multe manșoane de electrofuziune."]],"electrofusion elbow":[["The electrofusion elbow is easy to install.","Cotul de electrofuziune se montează ușor."],["Weld the electrofusion elbow for two minutes.","Sudează cotul de electrofuziune timp de două minute."],["We need an electrofusion elbow at 90 degrees.","Avem nevoie de un cot de electrofuziune la 90 de grade."],["The electrofusion elbow is in the van.","Cotul de electrofuziune este în dubă."],["Check the time on the electrofusion elbow.","Verifică timpul pe cotul de electrofuziune."],["The electrofusion elbow cost more than a normal one.","Cotul de electrofuziune a costat mai mult decât unul obișnuit."],["Clean the electrofusion elbow before welding.","Curăță cotul de electrofuziune înainte de sudură."],["The electrofusion elbow joins pipes at a corner.","Cotul de electrofuziune îmbină țevi la colț."],["The welder used an electrofusion elbow here.","Sudorul a folosit aici un cot de electrofuziune."]],"electrofusion tee":[["The electrofusion tee is for the branch.","Teul de electrofuziune este pentru ramificație."],["Weld the electrofusion tee on the main pipe.","Sudează teul de electrofuziune pe conducta principală."],["The electrofusion tee needs three welds.","Teul de electrofuziune are nevoie de trei suduri."],["We installed an electrofusion tee for the hydrant.","Am montat un teu de electrofuziune pentru hidrant."],["The electrofusion tee is in the box.","Teul de electrofuziune este în cutie."],["Scan the code of the electrofusion tee.","Scanează codul teului de electrofuziune."],["The electrofusion tee is for 110 pipe.","Teul de electrofuziune este pentru țeavă de 110."],["Fix the electrofusion tee before welding.","Fixează teul de electrofuziune înainte de sudură."],["Order an electrofusion tee of 160.","Comandă un teu de electrofuziune de 160."]],"electrofusion machine":[["The electrofusion machine reads the barcode.","Aparatul de electrofuziune citește codul de bare."],["Charge the electrofusion machine at night.","Încarcă aparatul de electrofuziune noaptea."],["The electrofusion machine records every weld.","Aparatul de electrofuziune înregistrează fiecare sudură."],["The electrofusion machine needs a generator.","Aparatul de electrofuziune are nevoie de un generator."],["Download the data from the electrofusion machine.","Descarcă datele din aparatul de electrofuziune."],["The electrofusion machine showed an error.","Aparatul de electrofuziune a arătat o eroare."],["Keep the electrofusion machine dry.","Ține aparatul de electrofuziune la uscat."],["The electrofusion machine was calibrated last month.","Aparatul de electrofuziune a fost calibrat luna trecută."],["Only the PE welder uses the electrofusion machine.","Doar sudorul în polietilenă folosește aparatul de electrofuziune."]],"butt fusion":[["Butt fusion is used for large pipes.","Sudura cap la cap se folosește la țevi mari."],["Butt fusion makes a strong joint.","Sudura cap la cap face o îmbinare rezistentă."],["The butt fusion takes about fifteen minutes.","Sudura cap la cap durează aproximativ cincisprezece minute."],["We joined the 250 pipes by butt fusion.","Am îmbinat țevile de 250 prin sudură cap la cap."],["Butt fusion needs a clean, dry place.","Sudura cap la cap are nevoie de un loc curat și uscat."],["The butt fusion weld looks good.","Sudura cap la cap arată bine."],["Write the butt fusion data in the record.","Scrie datele sudurii cap la cap în fișă."],["Butt fusion is cheaper than electrofusion.","Sudura cap la cap e mai ieftină decât electrofuziunea."],["The butt fusion failed the test.","Sudura cap la cap a picat testul."]],"butt fusion machine":[["The butt fusion machine is very heavy.","Aparatul de sudură cap la cap este foarte greu."],["Set up the butt fusion machine in the trench.","Montează aparatul de sudură cap la cap în șanț."],["The butt fusion machine has a heating plate.","Aparatul de sudură cap la cap are o oglindă de sudură."],["Clean the butt fusion machine after work.","Curăță aparatul de sudură cap la cap după lucru."],["We rent the butt fusion machine by the week.","Închiriem aparatul de sudură cap la cap pe săptămână."],["The butt fusion machine needs a generator.","Aparatul de sudură cap la cap are nevoie de un generator."],["The butt fusion machine can weld up to 315.","Aparatul de sudură cap la cap poate suda până la 315."],["The butt fusion machine has a pressure gauge.","Aparatul de sudură cap la cap are un manometru."],["Move the butt fusion machine with two people.","Mută aparatul de sudură cap la cap cu doi oameni."]],"compression fitting":[["Compression fittings don't need welding.","Fitingurile de compresiune nu au nevoie de sudură."],["Tighten the compression fitting with a key.","Strânge fitingul de compresiune cu cheia."],["We use compression fittings for house connections.","Folosim fitinguri de compresiune la branșamente."],["The compression fitting is blue.","Fitingul de compresiune este albastru."],["The compression fitting is leaking, tighten it more.","Fitingul de compresiune pierde, strânge-l mai tare."],["Compression fittings are quick to install.","Fitingurile de compresiune se montează repede."],["We have compression fittings of 25 and 32.","Avem fitinguri de compresiune de 25 și 32."],["Push the pipe into the compression fitting.","Împinge țeava în fitingul de compresiune."],["The plumber prefers compression fittings.","Instalatorul preferă fitingurile de compresiune."]],"tapping saddle":[["The tapping saddle connects the house to the main.","Colierul de branșament leagă casa de conducta principală."],["Weld the tapping saddle on the main pipe.","Sudează colierul de branșament pe conducta principală."],["Drill the pipe through the tapping saddle.","Găurește țeava prin colierul de branșament."],["We need twenty tapping saddles.","Avem nevoie de douăzeci de coliere de branșament."],["The tapping saddle is for 110 pipe.","Colierul de branșament este pentru țeavă de 110."],["We can install a tapping saddle under pressure.","Putem monta colierul de branșament sub presiune."],["The tapping saddle has a valve.","Colierul de branșament are robinet."],["Check the tapping saddle for leaks.","Verifică colierul de branșament să nu piardă."],["The tapping saddle is on top of the pipe.","Colierul de branșament este deasupra țevii."]],"flange adapter":[["The flange adapter joins the PE pipe to the valve.","Adaptorul de flanșă leagă țeava PE de vană."],["Weld the flange adapter first.","Sudează mai întâi adaptorul de flanșă."],["The flange adapter needs a steel ring.","Adaptorul de flanșă are nevoie de un inel de oțel."],["We need two flange adapters for the valve chamber.","Avem nevoie de două adaptoare de flanșă pentru căminul de vane."],["The flange adapter is the same size as the valve.","Adaptorul de flanșă are aceeași mărime ca vana."],["Tighten the bolts of the flange adapter evenly.","Strânge uniform șuruburile adaptorului de flanșă."],["The flange adapter is made of HDPE.","Adaptorul de flanșă este din PEHD."],["Put a gasket between the flange adapter and the valve.","Pune o garnitură între adaptorul de flanșă și vană."],["The flange adapter was missing from the order.","Adaptorul de flanșă lipsea din comandă."]],"gasket":[["The gasket is between the two flanges.","Garnitura este între cele două flanșe."],["Use a new gasket every time.","Folosește de fiecare dată o garnitură nouă."],["The old gasket is cracked.","Garnitura veche este crăpată."],["We need a gasket of DN
