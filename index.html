l general în legătură cu întârzierea."],["The general contractor signed the handover report.","Antreprenorul general a semnat procesul-verbal de predare."],["The investor pays the general contractor.","Beneficiarul îl plătește pe antreprenorul general."],["The general contractor must provide the guarantee.","Antreprenorul general trebuie să ofere garanția."],["Our company was chosen as general contractor.","Firma noastră a fost aleasă antreprenor general."],["The general contractor holds a weekly meeting.","Antreprenorul general ține o ședință săptămânală."],["Ask the general contractor for the schedule.","Cere graficul de la antreprenorul general."]],"investor":[["The investor wants the work finished by June.","Beneficiarul vrea lucrarea terminată până în iunie."],["We sent the invoice to the investor.","Am trimis factura beneficiarului."],["The investor approved the changes.","Beneficiarul a aprobat modificările."],["The investor is the local council.","Beneficiarul este consiliul local."],["The investor asked for a progress report.","Beneficiarul a cerut un raport de progres."],["We meet the investor every Friday.","Ne întâlnim cu beneficiarul în fiecare vineri."],["The investor has a site supervisor.","Beneficiarul are un diriginte de șantier."],["The investor is happy with the quality.","Beneficiarul este mulțumit de calitate."],["The investor delayed the payment.","Beneficiarul a întârziat plata."]],"blueprint":[["Look at the blueprint before you dig.","Uită-te pe planul de execuție înainte să sapi."],["The blueprint shows the pipe route.","Planul de execuție arată traseul conductei."],["This blueprint is an old version.","Acest plan de execuție este o versiune veche."],["Bring a copy of the blueprint to the trench.","Adu o copie a planului de execuție la șanț."],["The engineer changed the blueprint.","Inginerul a modificat planul de execuție."],["I can't read this blueprint, it is too small.","Nu pot citi acest plan, e prea mic."],["The depth is written on the blueprint.","Adâncimea este scrisă pe planul de execuție."],["We need the blueprints in PDF.","Avem nevoie de planurile de execuție în PDF."],["Follow the blueprint exactly.","Respectă exact planul de execuție."]],"site office":[["The site office has air conditioning.","Biroul de șantier are aer condiționat."],["Leave the keys in the site office.","Lasă cheile în biroul de șantier."],["The site office is a container.","Biroul de șantier este un container."],["Come to the site office after lunch.","Vino la biroul de șantier după prânz."],["The documents are kept in the site office.","Documentele sunt păstrate în biroul de șantier."],["The printer in the site office is broken.","Imprimanta din biroul de șantier este stricată."],["The site office opens at seven.","Biroul de șantier se deschide la ora șapte."],["We moved the site office near the gate.","Am mutat biroul de șantier lângă poartă."],["Is the site engineer in the site office?","Este inginerul de șantier în birou?"]],"progress":[["The progress is good this month.","Progresul este bun luna aceasta."],["The rain slowed our progress.","Ploaia ne-a încetinit progresul."],["Show me the progress on the map.","Arată-mi stadiul pe hartă."],["We take photos of the progress every day.","Facem poze cu stadiul lucrărilor în fiecare zi."],["The investor is checking our progress.","Beneficiarul ne verifică progresul."],["We made progress on the pumping station.","Am avansat la stația de pompare."],["The progress report is due on Monday.","Raportul de progres trebuie predat luni."],["What is the progress on the second street?","Care este stadiul pe a doua stradă?"],["Progress is slow because of the rock.","Progresul e lent din cauza stâncii."]],"stage":[["We are now in the second stage.","Acum suntem în a doua etapă."],["Each stage has its own deadline.","Fiecare etapă are propriul termen."],["The last stage is the asphalt.","Ultima etapă este asfaltul."],["At this stage we only dig.","În această fază doar săpăm."],["The project has four stages.","Proiectul are patru etape."],["We are paid after each stage.","Suntem plătiți după fiecare etapă."],["The test is done at the final stage.","Proba se face în etapa finală."],["Which stage are you working on?","La ce etapă lucrați?"],["The second stage starts in May.","A doua etapă începe în mai."]],"milestone":[["The first milestone is the end of the excavation.","Prima etapă cheie este finalizarea săpăturii."],["We missed the milestone by two days.","Am ratat etapa cheie cu două zile."],["The payment is linked to each milestone.","Plata este legată de fiecare etapă cheie."],["The next milestone is in March.","Următoarea etapă cheie este în martie."],["Finishing the pressure test is a big milestone.","Terminarea probei de presiune este o etapă importantă."],["Mark the milestones on the schedule.","Marchează etapele cheie pe grafic."],["We celebrated the milestone with a team lunch.","Am sărbătorit etapa cheie cu o masă în echipă."],["The investor checks every milestone.","Beneficiarul verifică fiecare etapă cheie."],["This milestone is very important for us.","Această etapă cheie este foarte importantă pentru noi."]],"handover":[["We prepare the documents for the handover.","Pregătim documentele pentru predare."],["The handover went well.","Predarea a decurs bine."],["After the handover, the guarantee period starts.","După predare începe perioada de garanție."],["The investor postponed the handover.","Beneficiarul a amânat predarea."],["Clean the site before the handover.","Curăță șantierul înainte de predare."],["The handover report has five pages.","Procesul-verbal de predare are cinci pagini."],["Who will sign the handover?","Cine va semna predarea?"],["The handover of the site is tomorrow.","Predarea amplasamentului este mâine."],["We need the as-built drawings for the handover.","Avem nevoie de planurile as-built pentru predare."]],"acceptance":[["The acceptance committee arrives at ten.","Comisia de recepție sosește la ora zece."],["We passed the acceptance without remarks.","Am trecut recepția fără observații."],["The acceptance report must be signed by everyone.","Procesul-verbal de recepție trebuie semnat de toți."],["There were three remarks at the acceptance.","Au fost trei observații la recepție."],["The partial acceptance is next week.","Recepția parțială este săptămâna viitoare."],["Prepare the quality file for the acceptance.","Pregătește cartea tehnică pentru recepție."],["The acceptance was postponed because of rain.","Recepția a fost amânată din cauza ploii."],["After acceptance we get the last payment.","După recepție primim ultima plată."],["The acceptance at completion is in May.","Recepția la terminarea lucrărilor este în mai."]],"bill of quantities":[["The bill of quantities has two hundred items.","Antemăsurătoarea are două sute de poziții."],["This item is missing from the bill of quantities.","Această poziție lipsește din antemăsurătoare."],["We priced the bill of quantities yesterday.","Am ofertat antemăsurătoarea ieri."],["The quantities in the bill of quantities are wrong.","Cantitățile din antemăsurătoare sunt greșite."],["Send me the bill of quantities in Excel.","Trimite-mi antemăsurătoarea în Excel."],["Compare the invoice with the bill of quantities.","Compară factura cu antemăsurătoarea."],["The designer made the bill of quantities.","Proiectantul a făcut antemăsurătoarea."],["The bill of quantities shows 300 metres of pipe.","Antemăsurătoarea arată 300 de metri de țeavă."],["We need a new bill of quantities for the extra works.","Avem nevoie de o antemăsurătoare nouă pentru lucrările suplimentare."]],"work order":[["The work order is signed by the site manager.","Dispoziția de lucru este semnată de șeful de șantier."],["Don't start without a work order.","Nu începe fără dispoziție de lucru."],["The work order says we dig on Main Street.","Dispoziția de lucru spune că săpăm pe strada principală."],["I lost the work order.","Am pierdut dispoziția de lucru."],["We received a new work order from the investor.","Am primit o nouă dispoziție de lucru de la beneficiar."],["Read the work order carefully.","Citește cu atenție dispoziția de lucru."],["The work order has a deadline.","Dispoziția de lucru are un termen."],["Each team gets a work order every morning.","Fiecare echipă primește o dispoziție de lucru în fiecare dimineață."],["Can you print the work order?","Poți să printezi dispoziția de lucru?"]],"shift":[["My shift ends at four.","Tura mea se termină la patru."],["We work in two shifts.","Lucrăm în două ture."],["The morning shift starts at seven.","Tura de dimineață începe la șapte."],["Who is on the night shift?","Cine este în tura de noapte?"],["I changed my shift with Ion.","Am schimbat tura cu Ion."],["A shift lasts eight hours.","O tură durează opt ore."],["The pump is checked at every shift.","Pompa este verificată la fiecare tură."],["The next shift is late.","Tura următoare a întârziat."],["He worked a double shift yesterday.","El a lucrat ieri două ture."]],"overtime":[["We worked overtime on Saturday.","Am lucrat ore suplimentare sâmbătă."],["Overtime is paid extra.","Orele suplimentare se plătesc separat."],["Write the overtime in the timesheet.","Trece orele suplimentare în foaia de pontaj."],["No overtime this week.","Fără ore suplimentare săptămâna aceasta."],["The workers asked for overtime pay.","Muncitorii au cerut plata orelor suplimentare."],["We did ten hours of overtime.","Am făcut zece ore suplimentare."],["Overtime must be approved by the manager.","Orele suplimentare trebuie aprobate de șef."],["Is overtime needed tomorrow?","Sunt necesare ore suplimentare mâine?"],["Too much overtime makes people tired.","Prea multe ore suplimentare îi obosesc pe oameni."]],"pour":[["Pour the concrete slowly.","Toarnă betonul încet."],["We poured the slab this morning.","Am turnat placa azi-dimineață."],["Don't pour concrete in the rain.","Nu turna beton pe ploaie."],["The truck is ready to pour.","Autobetoniera e gata să toarne."],["We will pour the base of the manhole tomorrow.","Mâine turnăm radierul căminului."],["How many cubic metres did you pour?","Câți metri cubi ați turnat?"],["Vibrate the concrete after you pour it.","Vibrează betonul după ce îl torni."],["We poured the foundation in one day.","Am turnat fundația într-o zi."],["Wait for the inspector before you pour.","Așteaptă inspectorul înainte să torni."]],"install":[["Install the valve on the left side.","Montează vana pe partea stângă."],["We installed two hundred metres of pipe today.","Azi am montat două sute de metri de țeavă."],["Who will install the water meter?","Cine va monta apometrul?"],["The pump was installed incorrectly.","Pompa a fost montată greșit."],["Install the warning tape above the pipe.","Montează banda avertizoare deasupra conductei."],["It takes two hours to install the manhole.","Durează două ore să montezi căminul."],["We need to install a new fence.","Trebuie să montăm un gard nou."],["The electrician installed the control panel.","Electricianul a montat tabloul de comandă."],["Install the fittings according to the drawing.","Montează fitingurile conform planșei."]],"level":[["Level the sand bed carefully.","Nivelează cu grijă patul de nisip."],["We need to level the area for the container.","Trebuie să nivelăm zona pentru container."],["Use the rake to level the gravel.","Folosește grebla ca să nivelezi pietrișul."],["The ground was levelled with the bulldozer.","Terenul a fost nivelat cu buldozerul."],["Level the base before laying the pipe.","Nivelează baza înainte de pozarea conductei."],["It is hard to level wet soil.","E greu să nivelezi pământul ud."],["Level the topsoil after backfilling.","Nivelează stratul vegetal după umplutură."],["They levelled the road before asphalting.","Au nivelat drumul înainte de asfaltare."],["Can you level this part again?","Poți să nivelezi din nou partea asta?"]],"survey":[["The surveyor is doing the survey today.","Topograful face ridicarea topografică astăzi."],["We need a new survey of the street.","Avem nevoie de o nouă ridicare topografică a străzii."],["The survey found an old pipe.","Ridicarea topografică a găsit o conductă veche."],["Send the survey to the designer.","Trimite ridicarea topografică proiectantului."],["The survey points are marked with paint.","Punctele topografice sunt marcate cu vopsea."],["The survey was done with GPS.","Ridicarea topografică a fost făcută cu GPS."],["We paid for the survey last week.","Am plătit ridicarea topografică săptămâna trecută."],["Check the levels in the survey.","Verifică cotele din ridicarea topografică."],["Without a survey we cannot start.","Fără ridicare topografică nu putem începe."]],"foundation":[["The foundation is made of reinforced concrete.","Fundația este din beton armat."],["Dig the foundation to the right depth.","Sapă fundația la adâncimea corectă."],["Water got into the foundation.","A intrat apă în fundație."],["The house has a strong foundation.","Casa are o fundație solidă."],["We poured the foundation yesterday.","Am turnat fundația ieri."],["The foundation must be level.","Fundația trebuie să fie la nivel."],["The pump station sits on a concrete foundation.","Stația de pompare stă pe o fundație de beton."],["The foundation needs waterproofing.","Fundația are nevoie de hidroizolație."],["Check the foundation for cracks.","Verifică fundația de fisuri."]],"concrete":[["Order six cubic metres of concrete.","Comandă șase metri cubi de beton."],["The concrete truck is coming.","Vine autobetoniera."],["This concrete is too wet.","Betonul acesta este prea moale."],["The manhole is made of concrete.","Căminul este din beton."],["Cover the fresh concrete with plastic.","Acoperă betonul proaspăt cu folie."],["What class of concrete do we need?","Ce clasă de beton ne trebuie?"],["The concrete must not freeze.","Betonul nu trebuie să înghețe."],["We broke the old concrete with a jackhammer.","Am spart betonul vechi cu picamărul."],["The concrete test results are good.","Rezultatele încercărilor pe beton sunt bune."]],"reinforced concrete":[["The tank is built of reinforced concrete.","Rezervorul este construit din beton armat."],["Reinforced concrete is very strong.","Betonul armat este foarte rezistent."],["The beams are reinforced concrete.","Grinzile sunt din beton armat."],["We need a crane for the reinforced concrete rings.","Avem nevoie de macara pentru inelele din beton armat."],["Cutting reinforced concrete is hard.","Tăierea betonului armat este grea."],["The pumping station has reinforced concrete walls.","Stația de pompare are pereți din beton armat."],["Reinforced concrete needs good formwork.","Betonul armat are nevoie de un cofraj bun."],["The cover slab is reinforced concrete.","Placa de acoperire este din beton armat."],["This bridge is made of reinforced concrete.","Acest pod este făcut din beton armat."]],"rebar":[["The rebar is delivered tomorrow.","Armătura se livrează mâine."],["Cut the rebar to two metres.","Taie armătura la doi metri."],["The rebar is rusty.","Armătura este ruginită."],["Check the rebar spacing.","Verifică distanța dintre bare."],["We need twelve millimetre rebar.","Avem nevoie de fier beton de doisprezece milimetri."],["The inspector checked the rebar.","Inspectorul a verificat armătura."],["Put spacers under the rebar.","Pune distanțiere sub armătură."],["The rebar sticks out of the wall.","Armătura iese din perete."],["Bend the rebar with this tool.","Îndoaie fierul beton cu această unealtă."]],"formwork":[["The formwork is ready for the concrete.","Cofrajul este gata pentru beton."],["Oil the formwork before pouring.","Unge cofrajul înainte de turnare."],["The formwork moved during the pour.","Cofrajul s-a mișcat în timpul turnării."],["We rent the formwork.","Închiriem cofrajul."],["Build the formwork for the manhole base.","Fă cofrajul pentru radierul căminului."],["The formwork is made of wood.","Cofrajul este din lemn."],["Check that the formwork is straight.","Verifică dacă cofrajul este drept."],["Clean the formwork after use.","Curăță cofrajul după folosire."],["The carpenters are building the formwork.","Dulgherii fac cofrajul."]],"slab":[["The slab is cracked in the corner.","Placa este fisurată în colț."],["We cast the slab on Friday.","Am turnat placa vineri."],["The slab covers the pumping station.","Placa acoperă stația de pompare."],["The slab has an opening for the hatch.","Placa are un gol pentru trapă."],["Don't walk on the fresh slab.","Nu călca pe placa proaspătă."],["The slab is reinforced with steel mesh.","Placa este armată cu plasă sudată."],["Lift the slab with the crane.","Ridică placa cu macaraua."],["The floor slab is ready.","Placa de pardoseală este gata."],["How thick is the slab?","Cât de groasă este placa?"]],"beam":[["The beam is too short.","Grinda este prea scurtă."],["Put a steel beam across the trench.","Pune o grindă metalică peste șanț."],["The beam is cracked.","Grinda este fisurată."],["Lift the beam with the crane.","Ridică grinda cu macaraua."],["The beams are twenty centimetres wide.","Grinzile au douăzeci de centimetri lățime."],["The roof rests on wooden beams.","Acoperișul stă pe grinzi de lemn."],["We need two more beams.","Mai avem nevoie de două grinzi."],["Measure the beam before you cut it.","Măsoară grinda înainte să o tai."],["The beam carries a heavy load.","Grinda preia o încărcare mare."]],"column":[["The column holds the beam.","Stâlpul susține grinda."],["We poured four columns today.","Am turnat patru stâlpi azi."],["The column is not vertical.","Stâlpul nu este vertical."],["There is a column in the middle of the hall.","Este un stâlp în mijlocul halei."],["Don't hit the column with the excavator.","Nu lovi stâlpul cu excavatorul."],["The column is made of steel.","Stâlpul este din oțel."],["Each column has a footing.","Fiecare stâlp are o fundație izolată."],["The engineer checked the columns.","Inginerul a verificat stâlpii."],["Paint the column yellow.","Vopsește stâlpul în galben."]],"wall":[["The wall of the manhole is wet.","Peretele căminului este ud."],["Build the wall straight.","Zidește peretele drept."],["Make a hole in the wall for the pipe.","Fă o gaură în perete pentru țeavă."],["The wall is two metres high.","Peretele are doi metri înălțime."],["The trench wall collapsed.","Peretele șanțului s-a surpat."],["Paint the wall white.","Vopsește peretele în alb."],["The wall needs plaster.","Peretele are nevoie de tencuială."],["There is a crack in the wall.","Este o fisură în perete."],["We knocked down the old wall.","Am dărâmat peretele vechi."]],"load-bearing wall":[["This is a load-bearing wall.","Acesta este un perete portant."],["The engineer must approve any hole in a load-bearing wall.","Inginerul trebuie să aprobe orice gaură într-un perete portant."],["The load-bearing wall is made of concrete.","Peretele portant este din beton."],["Is this a load-bearing wall?","Acesta este un perete portant?"],["We cannot remove the load-bearing wall.","Nu putem demola peretele portant."],["The beam rests on the load-bearing wall.","Grinda se sprijină pe peretele portant."],["Load-bearing walls are thicker.","Pereții portanți sunt mai groși."],["Mark the load-bearing walls on the plan.","Marchează pereții portanți pe plan."],["A crack in a load-bearing wall is dangerous.","O fisură într-un perete portant este periculoasă."]],"brick":[["We need two pallets of bricks.","Avem nevoie de doi paleți de cărămizi."],["The old manhole is made of brick.","Căminul vechi este din cărămidă."],["Lay the bricks in a straight line.","Așază cărămizile în linie dreaptă."],["This brick is broken.","Această cărămidă este spartă."],["The house is built of red brick.","Casa este construită din cărămidă roșie."],["How many bricks are left?","Câte cărămizi au mai rămas?"],["Wet the bricks before laying them.","Udă cărămizile înainte să le zidești."],["The brick wall is very strong.","Zidul de cărămidă este foarte rezistent."],["Put a brick under the pipe.","Pune o cărămidă sub țeavă."]],"mortar":[["The mortar is too dry.","Mortarul este prea uscat."],["Mix more mortar, please.","Mai fă mortar, te rog."],["Fill the joints with mortar.","Umple rosturile cu mortar."],["Seal the pipe in the wall with mortar.","Etanșează țeava în perete cu mortar."],["The mortar needs a day to harden.","Mortarul are nevoie de o zi să se întărească."],["We bought ten bags of mortar.","Am cumpărat zece saci de mortar."],["Clean the mortar off the bricks.","Curăță mortarul de pe cărămizi."],["Use cement mortar for the manhole.","Folosește mortar de ciment pentru cămin."],["The mortar is falling out of the wall.","Mortarul cade din perete."]],"plaster":[["The plaster is cracked.","Tencuiala este fisurată."],["Apply the plaster in two layers.","Aplică tencuiala în două straturi."],["We need plaster for the pump room.","Avem nevoie de tencuială pentru camera pompelor."],["The plaster is falling off the ceiling.","Tencuiala cade de pe tavan."],["Wait until the plaster is dry.","Așteaptă până se usucă tencuiala."],["The walls are ready for plaster.","Pereții sunt gata de tencuit."],["This plaster is waterproof.","Această tencuială este hidrofugă."],["The plasterer starts tomorrow.","Tencuitorul începe mâine."],["Smooth the plaster with a trowel.","Netezește tencuiala cu mistria."]],"screed":[["Pour the screed today.","Toarnă șapa azi."],["The screed is five centimetres thick.","Șapa are cinci centimetri grosime."],["Don't walk on the screed.","Nu călca pe șapă."],["The screed has cracks.","Șapa are fisuri."],["The screed needs a slope to the drain.","Șapa are nevoie de pantă spre sifon."],["Level the screed with a long bar.","Nivelează șapa cu un dreptar lung."],["We ordered self-levelling screed.","Am comandat șapă autonivelantă."],["The screed dries in two weeks.","Șapa se usucă în două săptămâni."],["Lay the tiles on the dry screed.","Pune gresia pe șapa uscată."]],"roof":[["The roof is leaking.","Acoperișul curge."],["We repaired the roof of the pump station.","Am reparat acoperișul stației de pompare."],["The roof is made of metal sheets.","Acoperișul este din tablă."],["Don't go on the roof without a harness.","Nu urca pe acoperiș fără ham."],["The snow is heavy on the roof.","Zăpada apasă greu pe acoperiș."],["The fan is on the roof.","Ventilatorul este pe acoperiș."],["The roof needs insulation.","Acoperișul are nevoie de izolație."],["The wind damaged the roof.","Vântul a deteriorat acoperișul."],["We finished the roof before winter.","Am terminat acoperișul înainte de iarnă."]],"insulation":[["The pipe needs insulation against frost.","Țeava are nevoie de izolație contra înghețului."],["The insulation is ten centimetres thick.","Izolația are zece centimetri grosime."],["The walls have no insulation.","Pereții nu au izolație."],["Good insulation saves energy.","O izolație bună economisește energie."],["We put polystyrene insulation on the walls.","Am pus izolație din polistiren pe pereți."],["The insulation got wet.","Izolația s-a udat."],["Wear gloves when you cut the insulation.","Poartă mănuși când tai izolația."],["The meter chamber needs insulation.","Căminul de apometru are nevoie de izolație."],["The roof insulation is finished.","Izolația acoperișului este gata."]],"waterproofing":[["The waterproofing failed and water came in.","Hidroizolația a cedat și a intrat apă."],["Apply the waterproofing on the outside.","Aplică hidroizolația pe exterior."],["The tank needs new waterproofing.","Rezervorul are nevoie de hidroizolație nouă."],["We use bitumen for waterproofing.","Folosim bitum pentru hidroizolație."],["Check the waterproofing before backfilling.","Verifică hidroizolația înainte de umplutură."],["The waterproofing has two layers.","Hidroizolația are două straturi."],["The manhole joints need waterproofing.","Îmbinările căminului au nevoie de hidroizolație."],["Waterproofing is expensive but necessary.","Hidroizolația este scumpă, dar necesară."],["The roof waterproofing is damaged.","Hidroizolația acoperișului este deteriorată."]],"floor":[["The floor of the pump room is wet.","Pardoseala camerei pompelor este udă."],["We live on the third floor.","Locuim la etajul trei."],["Clean the floor before you leave.","Curăță pardoseala înainte să pleci."],["The floor has a drain.","Pardoseala are un sifon de pardoseală."],["The building has five floors.","Clădirea are cinci etaje."],["Put the tools on the floor.","Pune sculele pe jos."],["The floor is not level.","Pardoseala nu este la nivel."],["The meeting room is on the ground floor.","Sala de ședințe este la parter."],["The floor is made of concrete.","Pardoseala este din beton."]],"ceiling":[["The ceiling is too low.","Tavanul este prea jos."],["There is a crack in the ceiling.","Este o fisură în tavan."],["Paint the ceiling white.","Vopsește tavanul în alb."],["The lamp hangs from the ceiling.","Lampa atârnă de tavan."],["Water is dripping from the ceiling.","Picură apă din tavan."],["The pipes run under the ceiling.","Țevile trec pe sub tavan."],["We need a ladder to reach the ceiling.","Avem nevoie de o scară ca să ajungem la tavan."],["The ceiling has insulation.","Tavanul are izolație."],["Fix the fan to the ceiling.","Fixează ventilatorul de tavan."]],"staircase":[["The staircase leads to the basement.","Scara duce la subsol."],["The staircase has no handrail.","Scara nu are balustradă."],["Be careful, the staircase is wet.","Atenție, scara este udă."],["The staircase is very narrow.","Scara este foarte îngustă."],["We poured the staircase yesterday.","Am turnat scara ieri."],["The office is at the top of the staircase.","Biroul este în capul scării."],["Keep the staircase clear.","Ține scara liberă."],["The staircase needs lighting.","Scara are nevoie de iluminat."],["The new staircase is made of steel.","Scara nouă este din oțel."]],"window frame":[["The window frame is rotten.","Tocul ferestrei este putrezit."],["Measure the window frame.","Măsoară tocul ferestrei."],["The window frame is made of PVC.","Tocul ferestrei este din PVC."],["Fix the window frame with screws.","Fixează tocul ferestrei cu șuruburi."],["Water comes in around the window frame.","Intră apă pe lângă tocul ferestrei."],["Paint the window frame.","Vopsește tocul ferestrei."],["The window frame is not straight.","Tocul ferestrei nu este drept."],["Use foam around the window frame.","Folosește spumă în jurul tocului."],["The window frame is too big for the opening.","Tocul ferestrei este prea mare pentru gol."]],"scaffolding":[["The scaffolding is not safe.","Schela nu este sigură."],["Put up the scaffolding on the north side.","Montează schela pe latura nordică."],["We rent the scaffolding for one month.","Închiriem schela pentru o lună."],["Don't climb the scaffolding without a harness.","Nu urca pe schelă fără ham."],["The scaffolding is ten metres high.","Schela are zece metri înălțime."],["Take down the scaffolding tomorrow.","Demontează schela mâine."],["The scaffolding needs guard rails.","Schela are nevoie de balustrade."],["A plank on the scaffolding is broken.","O scândură de pe schelă este ruptă."],["Who checked the scaffolding today?","Cine a verificat schela azi?"]],"crane":[["The crane arrives at eight.","Macaraua sosește la opt."],["The crane lifted the manhole rings.","Macaraua a ridicat inelele căminului."],["Don't stand under the crane.","Nu sta sub macara."],["We rent a crane for one day.","Închiriem o macara pentru o zi."],["The crane operator has a licence.","Macaragiul are autorizație."],["The wind is too strong for the crane.","Vântul este prea puternic pentru macara."],["The crane can lift ten tonnes.","Macaraua poate ridica zece tone."],["Where should we put the crane?","Unde să punem macaraua?"],["The crane lowered the pump into the station.","Macaraua a coborât pompa în stație."]],"steel structure":[["The steel structure is painted grey.","Structura metalică este vopsită în gri."],["We are assembling the steel structure.","Montăm structura metalică."],["The steel structure needs fire protection.","Structura metalică are nevoie de protecție la foc."],["The steel structure came by truck.","Structura metalică a venit cu camionul."],["Check the bolts of the steel structure.","Verifică șuruburile structurii metalice."],["The roof rests on a steel structure.","Acoperișul stă pe o structură metalică."],["The steel structure is rusting.","Structura metalică ruginește."],["A steel structure is quick to build.","O structură metalică se montează repede."],["The steel structure weighs twenty tonnes.","Structura metalică cântărește douăzeci de tone."]],"weld":[["The weld is cracked.","Sudura este fisurată."],["He can weld steel and PE.","El poate suda oțel și PE."],["Grind the weld smooth.","Polizează sudura să fie netedă."],["The weld failed the test.","Sudura nu a trecut proba."],["Weld the bracket to the pipe.","Sudează suportul de țeavă."],["We need a welder to weld this flange.","Avem nevoie de un sudor ca să sudeze flanșa."],["The weld looks good.","Sudura arată bine."],["Don't touch the weld, it is hot.","Nu atinge sudura, este fierbinte."],["Each weld gets a number.","Fiecare sudură primește un număr."]],"bolt":[["One bolt is missing.","Lipsește un șurub."],["Use stainless steel bolts.","Folosește șuruburi din inox."],["The bolt is too long.","Șurubul este prea lung."],["Tighten the bolts in a cross pattern.","Strânge șuruburile în cruce."],["The bolts are rusty.","Șuruburile sunt ruginite."],["Bring a box of M16 bolts.","Adu o cutie de șuruburi M16."],["The bolt broke.","Șurubul s-a rupt."],["Loosen the bolt slowly.","Slăbește șurubul încet."],["Each flange has eight bolts.","Fiecare flanșă are opt șuruburi."]],"crack":[["The crack is getting bigger.","Fisura se mărește."],["Fill the crack with resin.","Umple fisura cu rășină."],["There is a crack in the pipe.","Este o fisură în țeavă."],["Take a photo of the crack.","Fă o poză fisurii."],["The crack appeared after the frost.","Fisura a apărut după îngheț."],["Water comes in through the crack.","Intră apă prin fisură."],["This crack is not dangerous.","Fisura aceasta nu este periculoasă."],["Measure the width of the crack.","Măsoară lățimea fisurii."],["The manhole ring has a crack.","Inelul căminului are o fisură."]],"cure":[["The concrete needs time to cure.","Betonul are nevoie de timp să se întărească."],["Keep the concrete wet while it cures.","Ține betonul umed cât se întărește."],["In winter the concrete cures slowly.","Iarna betonul se întărește încet."],["Don't load the slab until it cures.","Nu încărca placa până nu se întărește."],["The concrete cured in seven days.","Betonul s-a întărit în șapte zile."],["Cover the concrete so it can cure.","Acoperă betonul ca să se întărească."],["How long does this mortar take to cure?","Cât durează până se întărește mortarul acesta?"],["The resin cures in one hour.","Rășina se întărește într-o oră."],["Let it cure overnight.","Las-o să se întărească peste noapte."]],"plumb":[["The pole is not plumb.","Stâlpul nu este la verticală."],["Use a spirit level to check if it is plumb.","Folosește o nivelă ca să verifici dacă e la verticală."],["Make sure the manhole is plumb.","Asigură-te că căminul este la verticală."],["The wall is out of plumb.","Peretele nu este la verticală."],["Set the post plumb before the concrete.","Pune stâlpul la verticală înainte de beton."],["The pipe must be plumb in the riser.","Țeava trebuie să fie verticală în coloană."],["Hang a plumb line here.","Atârnă un fir cu plumb aici."],["The column is perfectly plumb.","Stâlpul este perfect vertical."],["Check plumb on two sides.","Verifică verticalitatea pe două fețe."]],"zoning certificate":[["The zoning certificate is valid for two years.","Certificatul de urbanism este valabil doi ani."],["We received the zoning certificate.","Am primit certificatul de urbanism."],["The zoning certificate lists the permits we need.","Certificatul de urbanism enumeră avizele de care avem nevoie."],["The town hall issues the zoning certificate.","Primăria emite certificatul de urbanism."],["Attach the zoning certificate to the file.","Atașează certificatul de urbanism la dosar."],["The zoning certificate has expired.","Certificatul de urbanism a expirat."],["We need a zoning certificate for the new network.","Avem nevoie de certificat de urbanism pentru rețeaua nouă."],["How long does the zoning certificate take?","Cât durează obținerea certificatului de urbanism?"],["Bring a copy of the zoning certificate.","Adu o copie a certificatului de urbanism."]],"pipeline":[["The pipeline crosses the river.","Conducta traversează râul."],["We inspect the pipeline every year.","Inspectăm conducta în fiecare an."],["The pipeline is buried two metres deep.","Conducta este îngropată la doi metri adâncime."],["There is a leak in the pipeline.","Este o pierdere în conductă."],["The gas pipeline is marked with yellow tape.","Conducta de gaz este marcată cu bandă galbenă."],["The new pipeline is made of PE.","Conducta nouă este din PE."],["Don't dig near the pipeline without approval.","Nu săpa lângă conductă fără aviz."],["The pipeline route follows the road.","Traseul conductei urmează drumul."],["We tested the pipeline at ten bar.","Am probat conducta la zece bari."]],"wall thickness":[["The wall thickness is written on the pipe.","Grosimea peretelui este scrisă pe țeavă."],["Measure the wall thickness with a caliper.","Măsoară grosimea peretelui cu șublerul."],["SDR shows the wall thickness ratio.","SDR arată raportul dintre diametru și grosimea peretelui."],["A thicker wall means higher pressure.","Un perete mai gros înseamnă presiune mai mare."],["The wall thickness is too small for this pressure.","Grosimea peretelui este prea mică pentru această presiune."],["What is the wall thickness of this pipe?","Care este grosimea peretelui acestei țevi?"],["The inspector checked the wall thickness.","Inspectorul a verificat grosimea peretelui."],["The wall thickness is ten millimetres.","Grosimea peretelui este de zece milimetri."],["Corrosion reduced the wall thickness.","Coroziunea a redus grosimea peretelui."]],"ductile iron":[["Ductile iron pipes are very strong.","Țevile din fontă ductilă sunt foarte rezistente."],["The manhole cover is ductile iron.","Capacul căminului este din fontă ductilă."],["We replace the ductile iron with PE.","Înlocuim fonta ductilă cu PE."],["Ductile iron fittings are heavy.","Fitingurile din fontă ductilă sunt grele."],["The valve body is ductile iron.","Corpul vanei este din fontă ductilă."],["Ductile iron can rust from outside.","Fonta ductilă poate rugini la exterior."],["Order a ductile iron flange adapter.","Comandă un adaptor cu flanșă din fontă ductilă."],["This ductile iron pipe is forty years old.","Această țeavă din fontă ductilă are patruzeci de ani."],["We connected PE to ductile iron.","Am racordat PE la fontă ductilă."]],"flange":[["The flange is leaking.","Flanșa curge."],["Put a new gasket between the flanges.","Pune o garnitură nouă între flanșe."],["This flange is DN 100.","Această flanșă este DN 100."],["The pump has a flange connection.","Pompa are racord cu flanșă."],["Weld the flange to the steel pipe.","Sudează flanșa pe țeava de oțel."],["The flange holes don't match.","Găurile flanșelor nu se potrivesc."],["Use a blind flange at the end.","Folosește o flanșă oarbă la capăt."],["The flange bolts are loose.","Șuruburile flanșei sunt slăbite."],["Order two flanges for the valve.","Comandă două flanșe pentru vană."]],"ball valve":[["The ball valve is stuck.","Robinetul cu bilă este blocat."],["Close the ball valve before the meter.","Închide robinetul cu bilă înainte de apometru."],["Replace the old ball valve.","Înlocuiește robinetul cu bilă vechi."],["A ball valve opens with a quarter turn.","Un robinet cu bilă se deschide cu un sfert de tură."],["The ball valve is leaking at the handle.","Robinetul cu bilă curge la mâner."],["We need a one-inch ball valve.","Avem nevoie de un robinet cu bilă de un țol."],["The gas ball valve has a yellow handle.","Robinetul cu bilă de gaz are mânerul galben."],["Is the ball valve open or closed?","Robinetul cu bilă este deschis sau închis?"],["Install a ball valve after the meter.","Montează un robinet cu bilă după apometru."]],"seal":[["Seal the pipe end with a cap.","Etanșează capătul țevii cu un dop."],["The seal is damaged.","Garnitura de etanșare este deteriorată."],["Use silicone to seal the gap.","Folosește silicon ca să etanșezi golul."],["The manhole seal must be watertight.","Etanșarea căminului trebuie să fie etanșă la apă."],["Replace the seal on the pump.","Înlocuiește etanșarea de la pompă."],["The pipe passes through a wall seal.","Țeava trece printr-o piesă de etanșare în perete."],["Seal the joint before the test.","Etanșează îmbinarea înainte de probă."],["The rubber seal is in the socket.","Garnitura de cauciuc este în mufă."],["A bad seal causes leaks.","O etanșare proastă provoacă pierderi."]],"joint":[["Check every joint for leaks.","Verifică fiecare îmbinare de pierderi."],["The joint is not straight.","Îmbinarea nu este dreaptă."],["We made forty joints today.","Am făcut patruzeci de îmbinări azi."],["Clean the pipe before making the joint.","Curăță țeava înainte de îmbinare."],["The joint failed during the test.","Îmbinarea a cedat la probă."],["Leave the joints open for the test.","Lasă îmbinările descoperite pentru probă."],["Use lubricant on the joint.","Folosește lubrifiant la îmbinare."],["This joint is welded.","Această îmbinare este sudată."],["Mark each joint on the plan.","Marchează fiecare îmbinare pe plan."]],"thread":[["The thread is damaged.","Filetul este deteriorat."],["Use hemp and paste on the thread.","Folosește cânepă și pastă pe filet."],["This thread is too short.","Filetul acesta este prea scurt."],["Cut a new thread on the pipe.","Fă un filet nou pe țeavă."],["The threads don't match.","Filetele nu se potrivesc."],["Clean the thread before you screw it.","Curăță filetul înainte să înșurubezi."],["Is this a male or female thread?","Este filet exterior sau interior?"],["Don't over-tighten the thread.","Nu strânge prea tare filetul."],["The fitting has a one-inch thread.","Fitingul are filet de un țol."]],"socket":[["The socket is full of dirt.","Mufa este plină de pământ."],["Put the rubber ring in the socket.","Pune inelul de cauciuc în mufă."],["The pipe is pushed fully into the socket.","Țeava este împinsă complet în mufă."],["The socket faces uphill.","Mufa este orientată spre amonte."],["Dig a small hole under the socket.","Sapă o mică groapă sub mufă."],["The socket cracked.","Mufa s-a fisurat."],["Each pipe has a socket at one end.","Fiecare țeavă are mufă la un capăt."],["Lubricate the socket before joining.","Unge mufa înainte de îmbinare."],["The socket is too tight.","Mufa este prea strâmtă."]],"spigot":[["Chamfer the spigot end.","Teșește capătul drept."],["Mark the insertion depth on the spigot.","Marchează adâncimea de introducere pe capătul drept."],["The spigot is damaged.","Capătul drept este deteriorat."],["Push the spigot in slowly.","Împinge încet capătul drept."],["The spigot must be cut square.","Capătul drept trebuie tăiat drept."],["Lubricate the spigot.","Unge capătul drept."],["The spigot didn't go in fully.","Capătul drept nu a intrat complet."],["Clean the dirt from the spigot.","Curăță pământul de pe capătul drept."],["Cut the spigot to the right length.","Taie capătul drept la lungimea corectă."]],"pipe cutter":[["The pipe cutter is in the van.","Dispozitivul de tăiat țeava este în dubă."],["This pipe cutter works up to 110 mm.","Acest dispozitiv taie până la 110 mm."],["The blade of the pipe cutter is dull.","Lama dispozitivului de tăiat țeava este tocită."],["Use the pipe cutter, not the grinder.","Folosește dispozitivul de tăiat țeava, nu flexul."],["A pipe cutter makes a straight cut.","Dispozitivul de tăiat țeava face o tăietură dreaptă."],["Who has the pipe cutter?","Cine are dispozitivul de tăiat țeava?"],["We need a bigger pipe cutter.","Avem nevoie de un dispozitiv de tăiat țeava mai mare."],["Turn the pipe cutter around the pipe.","Rotește dispozitivul în jurul țevii."],["Clean the pipe cutter after use.","Curăță dispozitivul de tăiat țeava după folosire."]],"nominal pressure":[["The nominal pressure is written on the valve.","Presiunea nominală este scrisă pe vană."],["We need valves with a nominal pressure of sixteen bar.","Avem nevoie de vane cu presiunea nominală de șaisprezece bari."],["PN means nominal pressure.","PN înseamnă presiune nominală."],["The test pressure is higher than the nominal pressure.","Presiunea de probă este mai mare decât presiunea nominală."],["Check the nominal pressure of the fittings.","Verifică presiunea nominală a fitingurilor."],["This pipe has a nominal pressure of ten bar.","Această țeavă are presiunea nominală de zece bari."],["The nominal pressure is too low for this network.","Presiunea nominală este prea mică pentru această rețea."],["All parts must have the same nominal pressure.","Toate piesele trebuie să aibă aceeași presiune nominală."],["What nominal pressure does the design require?","Ce presiune nominală cere proiectul?"]],"bend":[["The bend is ninety degrees.","Curba este la nouăzeci de grade."],["Put a thrust block at the bend.","Pune un masiv de ancoraj la curbă."],["We need two 45-degree bends.","Avem nevoie de două curbe la 45 de grade."],["The bend was welded wrong.","Curba a fost sudată greșit."],["The pipe goes around the bend.","Țeava merge pe după curbă."],["Don't bend the pipe too much.","Nu îndoi țeava prea mult."],["The bend is near the manhole.","Curba este lângă cămin."],["Order a bend with a long radius.","Comandă o curbă cu rază mare."],["The leak is at the bend.","Pierderea este la curbă."]],"hose":[["The hose is too short.","Furtunul este prea scurt."],["Roll up the hose after use.","Strânge furtunul după folosire."],["The hose has a hole.","Furtunul are o gaură."],["Put the hose in the trench to pump ze."],["The gas detector is beeping.","Detectorul de gaze piuie."],["Charge the gas detector every night.","Încarcă detectorul de gaze în fiecare seară."],["The gas detector measures oxygen and H2S.","Detectorul de gaze măsoară oxigenul și hidrogenul sulfurat."],["Lower the gas detector into the manhole.","Coboară detectorul de gaze în cămin."],["The gas detector needs calibration.","Detectorul de gaze trebuie calibrat."],["Don't go down without the gas detector.","Nu coborî fără detectorul de gaze."],["We bought a new gas detector.","Am cumpărat un detector de gaze nou."],["The gas detector shows zero.","Detectorul de gaze arată zero."]],"underground utilities":[["Check the plans for underground utilities.","Verifică planurile pentru rețelele subterane existente."],["There are many underground utilities here.","Sunt multe rețele subterane aici."],["Dig by hand near underground utilities.","Sapă manual lângă rețelele subterane."],["We damaged an underground cable.","Am avariat un cablu subteran."],["Use a cable detector to find underground utilities.","Folosește un detector de cabluri ca să găsești rețelele subterane."],["The underground utilities are not on the map.","Rețelele subterane nu sunt pe hartă."],["Mark the underground utilities with paint.","Marchează rețelele subterane cu vopsea."],["Ask the owners about underground utilities.","Întreabă deținătorii despre rețelele subterane."],["Underground utilities make the work slower.","Rețelele subterane încetinesc lucrul."]],"power line":[["Keep the excavator away from the power line.","Ține excavatorul departe de linia electrică."],["The power line is very low here.","Linia electrică este foarte joasă aici."],["The crane touched the power line.","Macaraua a atins linia electrică."],["Call the electric company about the power line.","Sună compania de electricitate despre linia electrică."],["There is an underground power line.","Este o linie electrică subterană."],["Never work under a power line with the boom up. afely.","Toată lumea a fost evacuată în siguranță."],["Do you know how to evacuate the site?","Știi cum să evacuezi șantierul?"],["The police evacuated the houses.","Poliția a evacuat casele."],["Evacuate to the meeting point.","Evacuați la punctul de adunare."],["We practise how to evacuate every year.","Exersăm evacuarea în fiecare an."],["They had to evacuate the pump station.","Au trebuit să evacueze stația de pompare."]],"collapse":[["The trench wall may collapse.","Peretele șanțului se poate prăbuși."],["The old manhole collapsed.","Căminul vechi s-a prăbușit."],["After the rain, the bank collapsed.","După ploaie, malul s-a prăbușit."],["A collapse can kill in seconds.","O prăbușire poate ucide în câteva secunde."],["Shoring prevents a collapse.","Sprijinirea previne prăbușirea."],["The road collapsed over the pipe.","Drumul s-a surpat deasupra conductei."],["The roof collapsed under the snow.","Acoperișul s-a prăbușit sub zăpadă."],["We heard a collapse in the trench.","Am auzit o surpare în șanț."],["The investigation found the cause of the collapse.","Ancheta a găsit cauza prăbușirii."]],"slippery":[["The ladder is slippery.","Scara este alunecoasă."],["Careful, the road is slippery.","Atenție, drumul este alunecos."],["The clay is very slippery after rain.","Argila este foarte alunecoasă după ploaie."],["The floor of the station is slippery.","Pardoseala stației este alunecoasă."],["Wear boots that are not slippery.","Poartă bocanci care nu alunecă."],["The pipe is slippery with lubricant.","Țeava e alunecoasă de la lubrifiant."],["Put sand on the slippery area.","Pune nisip pe zona alunecoasă."],["The steps are slippery with ice.","Treptele sunt alunecoase de la gheață."],["Slippery surfaces cause many falls.","Suprafețele alunecoase provoacă multe căderi."]],"mandatory":[["Helmets are mandatory on site.","Căștile sunt obligatorii pe șantier."],["The training is mandatory.","Instruirea este obligatorie."],["A permit is mandatory for this work.","Un permis /* Propoziții: traducere + până la 10 variante, se schimbă la fiecare repetare */
function exList(w){const a=[[w.ex,EXT[w.ex]||'']];(EXS[w.en]||[]).forEach(x=>a.push(x));((st.extraEx||{})[w.en]||[]).forEach(x=>a.push(x));const seen=new Set();return a.filter(x=>x[0]&&!seen.has(x[0])&&seen.add(x[0]))}
function nextEx(w){st.exIdx=st.exIdx||{};const a=exList(w);const i=(st.exIdx[w.en]||0)%a.length;st.exIdx[w.en]=i+1;save();return{s:a[i],i,n:a.length}}
function exBlock(m,w,onChange){let cur=nextEx(w);const host=m.querySelector('#exbox');
 const draw=()=>{host.innerHTML=`<div class="ex">${esc(cur.s[0])}</div>${cur.s[1]?`<div class="small muted" style="margin:4px 0 0 15px">${esc(cur.s[1])}</div>`:''}
  <div class="row" style="align-items:center"><button class="btn ghost" id="pex">${IC.spk} Propoziția</button><button class="btn ghost" id="pexs">${IC.slow} Rar</button>${cur.n>1?`<button class="btn ghost" id="pnx">Altă propoziție</button>`:''}<span class="small muted">${cur.i+1} din ${cur.n}</span></div><div id="moreex"></div>`;
  host.querySelector('#pex').onclick=()=>say(cur.s[0]);host.querySelector('#pexs').onclick=()=>say(cur.s[0],.65);
  const nx=host.querySelector('#pnx');if(nx)nx.onclick=()=>{cur=nextEx(w);draw();say(cur.s[0]);onChange&&onChange(cur.s[0])};
  const mo=host.querySelector('#moreex');if(cur.n<10&&sampleFn){mo.innerHTML='<button class="linkbtn" id="genex">Claude: mai multe propoziții (până la 10)</button>';mo.querySelector('#genex').onclick=()=>moreEx(w,mo,()=>{st.exIdx[w.en]=cur.i+1;cur=nextEx(w);draw();onChange&&onChange(cur.s[0])})}};
 draw();return()=>cur.s[0]}
async function moreEx(w,host,done){const have=exList(w);const need=10-have.length;if(need<=0)return;host.innerHTML='<p class="small muted">Claude scrie propoziții noi…</p>';
 try{const arr=await sampleFn.json(`Write ${need} different, natural, short English example sentences (6-14 words) using "${w.en}" (meaning in Romanian: "${w.ro}"). Each with an accurate Romanian translation. Do not repeat these: ${JSON.stringify(have.map(x=>x[0]))}. Return a JSON array of objects {"en":"...","ro":"..."} only.`,{cache:false});
  const add=(Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.en==='string'&&typeof x.ro==='string').map(x=>[x.en.trim().slice(0,180),x.ro.trim().slice(0,200)]).filter(x=>x[0]).slice(0,need);
  if(!add.length)throw 0;st.extraEx=st.extraEx||{};st.extraEx[w.en]=(st.extraEx[w.en]||[]).concat(add);save();done()}
 catch(e){host.innerHTML='<p class="small muted">Nu am putut genera acum. Încearcă din nou mai târziu.</p>'}}
function normState(o){const x=Object.assign(fresh(),o||{});if(!x.xpInit){x.xp=(x.xp||0)+Object.keys(x.learned||{}).length*10+(x.pron||0)*2+Object.keys(x.sessions||{}).length*20+(x.placement?20:0);x.xpInit=1}return x}
let st=profs.active?normState(lsGet(pkey(profs.active))):fresh();
function attachTopic(t){if(!TOPICS.find(x=>x.id===t.id)){TOPICS.push(t);TW[t.id]=TW[t.id]||[]}}
function attachWord(w){
 const ok=addWord(w);const real=W(w.en);
 if(w.tp){attachTopic(TOPICS.find(t=>t.id===w.tp)||{id:w.tp,g:'Subiectul tău',t:w.tp,d:''});if(!TW[w.tp].includes(real))TW[w.tp].push(real)}
 else if(ok&&WORDS[w.lv])WORDS[w.lv].push(real);
 return ok}
const attachCustom=()=>{(st.customTopics||[]).forEach(attachTopic);(st.custom||[]).forEach(attachWord)};
attachCustom();
/* Salvare: local imediat + în contul Claude (când aplicația e deschisă în Claude) */
let cloudDB=null,cloudUid=null,cloudBusy=false,cloudDirty=false,cloudTimer=null;
const cloudOn=()=>!!(cloudDB&&cloudUid);
function save(){
 if(!profs.active)return;st.updated=Date.now();lsSet(pkey(profs.active),st);
 const p=curProf();if(p&&st.name&&p.name!==st.name){p.name=st.name;saveProfs()}
 if(cloudOn()){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,2500)}}
async function cloudSave(){if(!cloudOn()||!profs.active)return;if(cloudBusy){cloudDirty=true;return}cloudBusy=true;
 try{await cloudDB.doc('data/users/'+cloudUid+'/p_'+profs.active).set({json:JSON.stringify(st),updated:st.updated||Date.now()});
  await cloudDB.doc('data/users/'+cloudUid+'/profiles').set({json:JSON.stringify(profs.list),updated:Date.now()})}
 catch(e){if(e&&['not_granted','revoked','capability_disabled','capability_removed','invalid_argument'].includes(e.code))cloudDB=null}
 cloudBusy=false;if(cloudDirty){cloudDirty=false;cloudSave()}}
async function cloudDelete(id){if(!cloudOn())return;try{await cloudDB.doc('data/users/'+cloudUid+'/p_'+id).delete();await cloudDB.doc('data/users/'+cloudUid+'/profiles').set({json:JSON.stringify(profs.list),updated:Date.now()})}catch(e){}}
function useProfile(id){
 if(profs.active&&profs.active!==id)lsSet(pkey(profs.active),st);
 profs.active=id;saveProfs();st=normState(lsGet(pkey(id)));attachCustom();
}
function applyState(obj){st=normState(obj);attachCustom();save();if(cloudOn())cloudSave()}
async function cloudInit(){
 try{if(!(window.claude&&claude.use))return;const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
  const uid=await user.id();if(!uid)return;
  const parse=snap=>{try{const d=snap.exists?snap.data():null;return d&&d.json?JSON.parse(d.json):null}catch(e){return null}};
  const meta=parse(await db.doc('data/users/'+uid+'/profiles').get());
  let changed=false;
  if(Array.isArray(meta)){
   for(const rp of meta){if(!rp||!rp.id)continue;let lp=profs.list.find(x=>x.id===rp.id);
    const remote=parse(await db.doc('data/users/'+uid+'/p_'+rp.id).get());const local=lsGet(pkey(rp.id));
    if(remote&&(!local||(remote.updated||0)>(local.updated||0))){lsSet(pkey(rp.id),remote);changed=true}
    if(!lp){profs.list.push({id:rp.id,name:rp.name,color:rp.color||0});changed=true}}
  }else{
   /* versiunea veche: un singur document de progres */
   const old=parse(await db.doc('data/users/'+uid+'/progress').get());
   if(old&&old.name){let p=profs.list.find(x=>x.name===old.name)||profs.list[0];
    if(!p){p={id:newPid(),name:old.name,color:0};profs.list.push(p);if(!profs.active)profs.active=p.id}
    const local=lsGet(pkey(p.id));if(!local||(old.updated||0)>(local.updated||0)){lsSet(pkey(p.id),old);changed=true}}
  }
  cloudDB=db;cloudUid=uid;
  if(changed){saveProfs();if(profs.active){st=normState(lsGet(pkey(profs.active)));attachCustom()}toast('Profilurile au fost readuse din contul tău.');go(profs.list.length>1&&!profs.active?'profiles':'home')}

function listen(){return new Promise((res,rej)=>{if(!SR)return rej('nosupport');let r;try{r=new SR()}catch(e){return rej('nosupport')}r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;let done=false;
 r.onresult=e=>{done=true;micState='ok';const alts=[...e.results[0]].map(a=>a.transcript);alts.conf=e.results[0][0].confidence||0;res(alts)};r.onerror=e=>{done=true;rej(e.error)};r.onend=()=>{if(!done)rej('no-speech')};try{r.start()}catch(e){rej('not-allowed')}})}

/* Widget pronunție: nu trece mai departe până nu e corect */
function pron(el,target,{onPass,hideText=false,hint=''}={}){
 let tries=0,passed=false;const words=norm(target).split(' ').length;
 el.innerHTML=`<div class="pron">
  <div class="pron-target ${hideText?'hid':''}">${hideText?esc(hint):esc(target)}</div>
  <div class="pron-btns"><button class="btn ghost" data-a="play">${IC.spk} Ascultă</button><button class="btn ghost" data-a="slow">${IC.slow} Rar</button></div>
  <button class="mic" data-a="mic" aria-label="Pronunță">${IC.mic}</button>
  <div class="mic-l">Apasă și spune în engleză</div>
  <div class="pron-res" aria-live="polite"></div></div>`;
 const res=el.querySelector('.pron-res'),mic=el.querySelector('.mic'),lab=el.querySelector('.mic-l');
 el.querySelector('[data-a=play]').onclick=()=>say(target);
 el.querySelector('[data-a=slow]').onclick=()=>say(target,.6);
 const need=words===1?1:.85;
 function judge(alts,mode='mic'){
  /* Strict: contează doar prima variantă auzită, nu alternativele; claritatea sub 55% nu trece */
  const top=[alts[0]||''];const r=scoreSpeech(target,top);tries++;
  const conf=alts.conf||0;const unclear=mode==='mic'&&conf>0&&conf<.55&&r.score>=need;
  const pass=r.score>=need&&!unclear;
  res.innerHTML=`<div class="heard">Am auzit: „${esc(r.heard||'…')}”${mode==='mic'&&conf>0?` · claritate ${Math.round(conf*100)}%`:''}</div>
   ${hideText&&!pass?'':`<div class="wchips">${r.words.map(w=>`<span class="wchip ${w.ok?'ok':'bad'}">${esc(w.w)}</span>`).join('')}</div>`}
   <div class="verdict ${pass?'ok':'bad'}">${pass?'Corect! '+Math.round(r.score*100)+'%':unclear?'Cuvintele sunt bune, dar pronunția nu e destul de clară. Mai spune o dată, mai rar.':'Încă nu. '+Math.round(r.score*100)+'% — ascultă din nou și repetă.'}</div>
   ${mode==='kb'?'<div class="small muted">Verificare aproximativă: tastatura corectează singură cuvintele, deci e mai îngăduitoare decât microfonul aplicației.</div>':''}`;
  if(pass&&!passed){passed=true;st.pron=(st.pron||0)+1;addXP(2);onPass&&onPass()}
  else if(!pass&&tries>=5){const b=document.createElement('button');b.className='linkbtn';b.textContent='Treci peste (revii la el mai târziu)';b.onclick=()=>{if(!passed){passed=true;onPass&&onPass(true)}};res.appendChild(b)}
 }
 function typed(){
  res.innerHTML=`<div class="note">În fereastra din Claude aplicația nu are voie să folosească microfonul. Pentru verificarea reală a pronunției, deschide aplicația în Chrome (vezi <b>Progres → Microfon și voce</b>). Până atunci: apasă în câmp, apoi pe <b>microfonul tastaturii</b> (setată pe engleză) și spune textul.</div>
   <form class="typef"><input type="text" id="dict-${Math.random().toString(36).slice(2,8)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Dictează aici"><button class="btn">Verifică</button></form>`;
  const f=res.querySelector('form');f.onsubmit=e=>{e.preventDefault();const v=f.querySelector('input').value;if(!v.trim())return;judge([v],'kb');if(!passed){const again=document.createElement('button');again.className='linkbtn';again.textContent='Încearcă din nou';again.onclick=typed;res.appendChild(again)}}
 }
 mic.onclick=async()=>{
  if(micState==='blocked'||micState==='none'){typed();return}
  stopVoice();mic.classList.add('on');lab.textContent='Te ascult…';
  try{const alts=await listen();mic.classList.remove('on');lab.textContent='Apasă și spune în engleză';judge(alts)}
  catch(err){mic.classList.remove('on');lab.textContent='Apasă și spune în engleză';
   if(['not-allowed','service-not-allowed','nosupport','audio-capture','network'].includes(err)){micState='blocked';typed()}
   else res.innerHTML='<div class="verdict bad">Nu te-am auzit. Apasă din nou și vorbește clar, aproape de telefon.</div>'}
 };
}

/* Chestionar generic */
function mc(prompt,correct,others,extra={}){const o=shuffle([correct,...others]);return{type:'mc',prompt,options:o,answer:o.indexOf(correct),...extra}}
function distract(w,n=3,field='ro'){const key=x=>x.tp||x.lv;const same=shuffle(ALLW.filter(x=>x[field]!==w[field]&&key(x)===key(w)));const rest=shuffle(ALLW.filter(x=>x[field]!==w[field]&&key(x)!==key(w)));const out=[];for(const x of [...same,...rest]){if(out.length>=n)break;if(!out.includes(x[field]))out.push(x[field])}return out}
function qWord(w,mode){
 const base={en:w.en,ro:w.ro};
 if(mode==='listen')return mc('Ce ai auzit? Alege traducerea.',w.ro,distract(w),{...base,audio:w.en,kind:'Ascultare'});
 if(mode==='type')return{...base,type:'type',kind:'Scriere',prompt:`Scrie în engleză: <b>${esc(w.ro)}</b>`,answer:w.en,sayAfter:w.en};
 if(mode==='en2roType')return{...base,type:'typeRo',kind:'Traducere',prompt:`Scrie în română ce înseamnă <b>${esc(w.en)}</b>`,answer:w.ro,sayAfter:w.en,hear:w.en};
 if(mode==='pron')return{...base,type:'pron',kind:'Pronunție',prompt:`Pronunță corect: <b>${esc(w.en)}</b><div class="small muted">${esc(w.ro)}</div>`,target:w.en};
 if(mode==='dict')return{...base,type:'type',kind:'Dictare',prompt:'Scrie ce auzi.',audio:w.en,answer:w.en,sayAfter:w.en};
 if(mode==='ro2en')return mc(`Cum se spune în engleză <b>${esc(w.ro)}</b>?`,w.en,distract(w,3,'en'),{...base,sayAfter:w.en,kind:'Traducere'});
 return mc(`Ce înseamnă <b>${esc(w.en)}</b>?`,w.ro,distract(w),{...base,sayAfter:w.en,hear:w.en,kind:'Traducere'});
}
/* Test amestecat: traducere, scriere, traducere scrisă, pronunție, ascultare */
function mixQs(words,modes=['en2ro','type','en2roType','pron','listen','ro2en']){const ws=shuffle(words);return ws.map((w,i)=>qWord(w,modes[i%modes.length]))}
/* Verificarea răspunsurilor: engleza scrisă strict, româna fără diacritice și cu mici greșeli de tastare */
const fold=x=>String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function roVariants(ro){const out=new Set([fold(ro)]);for(const b of ro.split(/[;,]/).map(x=>x.trim()).filter(Boolean)){out.add(fold(b));out.add(fold(b.replace(/\(.*?\)/g,'')));const inner=b.match(/\((.*?)\)/);if(inner)out.add(fold(inner[1]))}return[...out].filter(Boolean).map(x=>x.replace(/^(a |a se |a-si |a-si )/,''))}
function okRo(v,ro){const f=fold(v).replace(/^(a |a se )/,'');if(!f)return false;return roVariants(ro).some(y=>y===f||(y.length>4&&sim(y,f)>=.85))}
function isOkQ(q,a){if(a==null)return false;if(q.type==='type')return norm(a)===norm(q.answer);if(q.type==='typeRo')return okRo(a,q.answer);if(q.type==='pron')return a===true;return a===q.answer}
const correctText=q=>q.type==='pron'?q.target:(q.type==='type'||q.type==='typeRo')?q.answer:q.options[q.answer];
/* Mod test: fără indicii, cu „Înapoi”, scor calculat la final */
function runTest(host,qs,onDone){
 let i=0;const ans=qs.map(()=>null);
 const isOk=isOkQ;
 function step(){
  const q=qs[i],a=ans[i],last=i===qs.length-1;
  host.innerHTML=`<div class="prog"><span style="width:${i/qs.length*100}%"></span></div>
   <div class="qn">Întrebarea ${i+1} din ${qs.length}</div>
   ${q.audio?`<div><button class="btn ghost" data-a="aud">${IC.spk} Ascultă din nou</button></div>`:''}
   <div class="qp">${q.prompt}</div>
   ${q.type==='type'?`<form class="typef"><input type="text" id="tt${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scrie în engleză"><button class="btn">${last?'Termină':'Mai departe'}</button></form>`
     :`<div class="opts">${q.options.map((o,k)=>`<button class="opt ${a===k?'mine':''}" data-k="${k}">${esc(o)}</button>`).join('')}</div>`}
   <div class="tnav">${i>0?`<button class="btn ghost" data-a="prev">← Înapoi</button>`:'<span></span>'}${a!=null&&!last?`<button class="btn ghost" data-a="next">Înainte →</button>`:''}</div>
   ${last&&ans.every(x=>x!=null)?`<button class="btn wide" data-a="end">Vezi rezultatul</button>`:''}`;
  if(q.audio){host.querySelector('[data-a=aud]').onclick=()=>say(q.audio);if(a==null)setTimeout(()=>say(q.audio),250)}
  const pv=host.querySelector('[data-a=prev]');if(pv)pv.onclick=()=>{stopVoice();i--;step()};
  const nx=host.querySelector('[data-a=next]');if(nx)nx.onclick=()=>{stopVoice();i++;step()};
  const en=host.querySelector('[data-a=end]');if(en)en.onclick=finish;
  const advance=()=>{stopVoice();if(last){if(ans.every(x=>x!=null))finish();else{i=ans.findIndex(x=>x==null);step()}}else{i++;step()}};
  if(q.type==='type'){const f=host.querySelector('form'),inp=f.querySelector('input');if(a!=null)inp.value=a;setTimeout(()=>inp.focus(),60);
   f.onsubmit=e=>{e.preventDefault();if(!inp.value.trim())return;ans[i]=inp.value.trim();advance()}}
  else host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;host.querySelectorAll('.opt').forEach(x=>x.classList.toggle('mine',x===b));b.blur();setTimeout(advance,200)});
 }
 function finish(){
  let score=0;const wrong=[];qs.forEach((q,k)=>{if(isOk(q,ans[k]))score++;else wrong.push(q)});
  onDone(score,wrong,reviewHTML(qs,ans,isOk));
 }
 step();
}
function reviewHTML(qs,ans,isOk){
 const txt=(q,a)=>a==null?'—':q.type==='pron'?(a?'pronunțat corect':'nu a ieșit'):(q.type==='type'||q.type==='typeRo')?a:q.options[a];
 return `<div class="card"><h3>Răspunsurile tale</h3><div class="rev">${qs.map((q,k)=>{const ok=isOk(q,ans[k]);
  return `<div class="ri ${ok?'ok':'bad'}"><div class="rn">${k+1}. ${ok?'✓':'✗'}</div><div class="rb">${q.kind?`<div class="eyebrow">${q.kind}</div>`:''}<div class="rq">${q.prompt}${q.audio?`<div class="small muted">Ai auzit: „${esc(q.audio)}”</div>`:''}</div>
   ${ok?`<div class="ra ok">${esc(correctText(q))}</div>`:`<div class="ra bad">Tu: ${esc(txt(q,ans[k]))}</div><div class="ra ok">Corect: ${esc(correctText(q))}</div>`}</div></div>`}).join('')}</div></div>`;
}
function runQuiz(host,qs,onDone,{feedback=true}={}){
 if(!feedback)return runTest(host,qs,onDone);
 /* Mod exercițiu: răspunsul corect apare imediat (verde/roșu), fără întoarcere */
 let i=0;const ans=qs.map(()=>null);
 function step(){
  if(i>=qs.length){let score=0;const wrong=[];qs.forEach((q,k)=>{if(isOkQ(q,ans[k]))score++;else wrong.push(q)});onDone(score,wrong,reviewHTML(qs,ans,isOkQ));return}
  const q=qs[i];const typed=q.type==='type'||q.type==='typeRo';
  host.innerHTML=`<div class="prog"><span style="width:${i/qs.length*100}%"></span></div>
   <div class="row" style="justify-content:space-between"><span class="qn">Întrebarea ${i+1} din ${qs.length}</span>${q.kind?`<span class="lv">${q.kind}</span>`:''}</div>
   ${q.audio?`<div><button class="btn ghost" data-a="aud">${IC.spk} Ascultă din nou</button></div>`:q.hear?`<div class="row"><button class="btn ghost" data-a="hear">${IC.spk} Ascultă pronunția</button><button class="btn ghost" data-a="hears">${IC.slow} Rar</button></div>`:''}
   <div class="qp">${q.prompt}</div>
   ${typed?`<form class="typef"><input type="text" id="qt${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.type==='typeRo'?'Scrie în română':'Scrie în engleză'}"><button class="btn">Verifică</button></form>`
     :q.type==='pron'?`<div id="qpron"></div><button class="linkbtn" data-a="giveup">Nu reușesc acum, mai departe</button>`
     :`<div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`}
   <div class="fb" aria-live="polite"></div>`;
  if(q.audio){host.querySelector('[data-a=aud]').onclick=()=>say(q.audio);setTimeout(()=>say(q.audio),250)}
  if(!q.audio&&q.hear){host.querySelector('[data-a=hear]').onclick=()=>say(q.hear);host.querySelector('[data-a=hears]').onclick=()=>say(q.hear,.6)}
  const fb=host.querySelector('.fb');let done=false;
  const finish=a=>{if(done)return;done=true;ans[i]=a;const ok=isOkQ(q,a);const ct=correctText(q);
   fb.innerHTML=`<div class="verdict ${ok?'ok':'bad'}">${ok?'Corect!':'Greșit'}</div>
    ${typed?(ok?`<div class="ra ok">${esc(a)}${norm(a)!==norm(ct)?' · forma completă: '+esc(ct):''}</div>`:`<div class="ra bad">Tu: ${esc(a)}</div><div class="ra ok">Corect: ${esc(ct)}</div>`):''}
    ${q.type==='pron'&&!ok?`<div class="ra ok">Corect: ${esc(ct)}</div>`:''}
    ${q.en?`<div class="after"><button class="btn ghost" data-a="rep">${IC.spk} ${esc(q.en)}</button><button class="btn ghost" data-a="reps" aria-label="Rar">${IC.slow}</button><span>= <b>${esc(q.ro)}</b></span></div>`:q.sayAfter?`<div class="after"><button class="btn ghost" data-a="rep">${IC.spk} Ascultă din nou</button></div>`:''}
    <button class="btn wide" data-a="next">${i+1<qs.length?'Mai departe':'Vezi rezultatul'}</button>`;
   const gu=host.querySelector('[data-a=giveup]');if(gu)gu.remove();
   const rp=fb.querySelector('[data-a=rep]');if(rp)rp.onclick=()=>say(q.en||q.sayAfter);const rs=fb.querySelector('[data-a=reps]');if(rs)rs.onclick=()=>say(q.en,.6);
   const n=fb.querySelector('[data-a=next]');n.onclick=()=>{stopVoice();i++;step()};n.focus({preventScroll:true});n.scrollIntoView({block:'nearest',behavior:'smooth'})};
  if(typed){const f=host.querySelector('form');setTimeout(()=>f.querySelector('input').focus(),60);
   f.onsubmit=e=>{e.preventDefault();const inp=f.querySelector('input');if(!inp.value.trim())return;inp.disabled=true;f.querySelector('button').disabled=true;finish(inp.value.trim());if(q.sayAfter)say(q.sayAfter)}}
  else if(q.type==='pron'){pron(host.querySelector('#qpron'),q.target,{onPass:skipped=>finish(!skipped)});host.querySelector('[data-a=giveup]').onclick=()=>{finish(false);say(q.target)}}
  else host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;host.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.answer)x.classList.add('right')});if(k!==q.answer)b.classList.add('wrong');finish(k);if(q.sayAfter)say(q.sayAfter)});
 }
 step();
}

/* ================= NAVIGARE ================= */
const app=document.getElementById('app');
/* Istoric de navigare: „Înapoi” duce la ecranul anterior, pas cu pas, nu direct acasă */
const NAV=[];let cur=null,rendering=false,subScreen=false;
const topLevel=(()=>{try{return window.top===window}catch(e){return false}})();
const TABS=[['home','Acasă','home'],['learnHub','Învață','book'],['speakHub','Vorbește','talk'],['games','Exersează','game'],['progress','Eu','chart']];
function screen(title,html,{back=true,tab=null}={}){
 stopVoice();if(!rendering)subScreen=true;
 if(tab)back=false;
 const canBack=back&&(NAV.length||subScreen||(cur&&cur[0]!=='home'));
 app.innerHTML=`<header class="bar">${canBack?`<button class="back" data-back aria-label="Înapoi">←</button>`:''}<div class="bar-t">${title}</div>${canBack&&NAV.length>1?`<button class="back" data-go="home" aria-label="Acasă" title="Acasă">${IC.home}</button>`:''}${st.level?`<span class="chip" title="${LNAME[st.level]}">${st.level}</span>`:''}</header><main class="screen">${html}</main>${tab?`<nav class="tabs" aria-label="Navigare"><div class="in">${TABS.map(([r,l,ic])=>`<button data-tab="${r}" class="${tab===r?'on':''}" aria-current="${tab===r?'page':'false'}"><span class="tico">${IC[ic]}</span>${l}</button>`).join('')}</div></nav>`:''}`;
 window.scrollTo(0,0);return app.querySelector('main');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-back]');if(b){e.preventDefault();back();return}
 const tb=e.target.closest('[data-tab]');if(tb){e.preventDefault();NAV.length=0;cur=['home'];if(tb.dataset.tab==='home')go('home');else go(tb.dataset.tab);return}
 const g=e.target.closest('[data-go]');if(!g)return;e.preventDefault();go(g.dataset.go,g.dataset.arg)});
function render(r,arg){rendering=true;subScreen=false;try{(R[r]||R.home)(arg)}finally{rendering=false}}
function go(r,arg){
 if(r==='home'||!R[r]){NAV.length=0;cur=['home'];render('home');if(topLevel)try{history.replaceState({d:0},'')}catch(e){}return}
 /* redirecționare din interiorul unui ecran (ex. sesiunea zilnică → cuvântul curent): înlocuiește, nu adaugă */
 if(rendering||(cur&&cur[0]==='word'&&r==='word')){cur=[r,arg];render(r,arg);return}
 const same=cur&&cur[0]===r&&cur[1]===arg;
 if(cur&&!same)NAV.push(cur);cur=[r,arg];render(r,arg);
 if(topLevel&&!same)try{history.pushState({d:NAV.length},'')}catch(e){}
}
function back(fromBrowser=false){
 stopVoice();
 /* Dacă ești într-un exercițiu sau rezultat, întâi revii la ecranul care l-a pornit */
 if(subScreen&&cur&&cur[0]!=='home'){render(cur[0],cur[1]);if(topLevel&&fromBrowser)try{history.pushState({d:NAV.length},'')}catch(e){}return}
 const p=NAV.pop();if(!p||p[0]==='home'){NAV.length=0;cur=['home'];render('home');return}
 cur=p;render(p[0],p[1]);
 if(topLevel&&!fromBrowser){ignorePop=true;try{history.back()}catch(e){ignorePop=false}}
}
let ignorePop=false;
window.addEventListener('popstate',()=>{if(ignorePop){ignorePop=false;return}back(true)});

R.placement=()=>{

 const wrapped=qs.map(q=>q);
 runQuiz(card,wrapped,(score,wrong,review)=>{
  const wrongSet=new Set(wrong);LEVELS.forEach(l=>per[l]=0);wrapped.forEach(q=>{if(!wrongSet.has(q))per[q.lv]++});
  let lv='A1';for(const l of LEVELS){if(per[l]>=3)lv=l;else break}
  if(score>=18)lv='C1';else if(score>=14&&LEVELS.indexOf(lv)<3)lv='B2';else if(score>=10&&LEVELS.indexOf(lv)<2)lv='B1';else if(score>=6&&LEVELS.indexOf(lv)<1)lv='A2';

R.styleTest=()=>{

 const keys=['V','A','S','K'];const pick=STYLEQ.map(()=>null);const orders=STYLEQ.map(()=>shuffle([0,1,2,3]));let i=0;
 function step(){
  if(i>=STYLEQ.length){const cnt={V:0,A:0,S:0,K:0};pick.forEach(k=>cnt[keys[k]]++);st.style=cnt;save();go('styleResult');addXP(10);return}
  const [q,opts]=STYLEQ[i];

  const pv=card.querySelector('[data-a=prev]');if(pv)pv.onclick=()=>{i--;step()};
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick[i]=+b.dataset.k;b.classList.add('mine');setTimeout(()=>{i++;step()},200)});
 }
 step();
};

/* ---------- Sesiunea zilnică ---------- */
function newWords(n,exclude=[]){
 const start=LEVELS.indexOf(st.startLevel||st.level);const out=[];
 for(let k=start;k<LEVELS.length&&out.length<n;k++)for(const w of WORDS[LEVELS[k]]){if(out.length>=n)break;if(!st.learned[w.en]&&!exclude.includes(w.en))out.push(w.en)}
 if(out.length<n)for(let k=start-1;k>=0&&out.length<n;k--)for(const w of WORDS[LEVELS[k]]){if(out.length>=n)break;if(!st.learned[w.en]&&!exclude.includes(w.en))out.push(w.en)}
 return out}
R.daily=()=>{
 if(st.today&&st.today.date===today()&&st.today.phase!=='done'){go(st.today.phase==='quiz'?'dailyQuiz':'dailyLearn');return}
 if(st.sessions[today()]!=null){
  const m=screen('Sesiunea de azi',`<div class="card"><h2>Ai terminat sesiunea de azi</h2><p class="muted">Scor la verificare: ${st.sessions[today()]}/10. Revino mâine pentru încă 10 cuvinte.</p>
   <button class="btn wide" id="rev">Recapitulare: 25 de cuvinte</button><button class="btn ghost wide" id="more">Încă 10 cuvinte noi (bonus)</button></div>`);
  m.querySelector('#rev').onclick=()=>go('review');
  m.querySelector('#more').onclick=()=>{startSession()};return}
 startSession();
};
const topicNew=(id,n)=>(TW[id]||[]).filter(w=>!st.learned[w.en]).slice(0,n).map(w=>w.en);

  genButton(m.querySelector('#gen'),src==='general'?{level:st.startLevel||st.level}:{topic:src},()=>startSession(src));return}
 st.today={date:today(),words:ws,idx:0,phase:'learn',src};save();go('dailyLearn');
}

  <div class="card"><div class="row" style="justify-content:space-between;align-items:center"><span class="counter">${t.idx+1} / ${t.words.length}</span><span class="lv">${esc(tag(w))}</span></div>

 const exNow=exBlock(m,w,()=>{const p2=m.querySelector('#pr2');if(!p2.hidden)sayEx()});
 setTimeout(()=>say(w.en),300);
 const nb=m.querySelector('#next');let sayEx=()=>{};
 pron(m.querySelector('#pr'),w.en,{onPass:()=>{

R.dailyQuiz=()=>{
 const t=st.today;const ws=shuffle(t.words.map(W));const modes=['en2ro','listen','type','en2roType','pron','en2ro','type','en2roType','pron','ro2en'];
 const m=screen('Verificare',`<div class="card" id="q"></div>`);
 runQuiz(m.querySelector('#q'),ws.map((w,i)=>qWord(w,modes[i%modes.length])),(score,wrong,review)=>{
  const d=today();t.words.forEach(en=>{if(!st.learned[en])st.learned[en]={d}});
  st.sessions[d]=Math.max(st.sessions[d]||0,score);
  if(st.lastDay!==d){st.streak=(st.lastDay&&daysAgo(st.lastDay)===1)?st.streak+1:1;st.lastDay=d}
  t.phase='done';save();const n=ws.length,r=score/n;setTimeout(()=>addXP(n*10+score*2+20),300);const fromTopic=t.src&&t.src!=='general';
  screen('Sesiune terminată',`<div class="card"><div class="eyebrow">Verificare</div><div class="big">${score}/${n}</div><h2>${r>=.8?'Excelent!':r>=.5?'Bine, mai exersează puțin.':'Repetă cuvintele în jocuri.'}</h2>
   <p class="muted">Ai ${learnedCount()} cuvinte învățate. Serie: ${st.streak} ${st.streak===1?'zi':'zile'} la rând.</p></div>
   ${fromTopic?`<button class="btn wide" data-go="topic" data-arg="${esc(t.src)}">Înapoi la domeniu</button>`:''}
   <button class="btn ${fromTopic?'ghost ':''}wide" data-go="games">Joacă-te cu cuvintele învățate</button><button class="btn ghost wide" data-go="home">Acasă</button>
   ${review}`);
 });
};
R.review=()=>{

 if(pool.length<4){screen('Recapitulare','<div class="card"><p>Ai nevoie de cel puțin 4 cuvinte învățate pentru recapitulare.</p><button class="btn" data-go="daily">Sesiunea zilnică</button></div>');return}

 const miss=st.missed||{};const ws=shuffle(pool).sort((a,b)=>(miss[b.en]||0)-(miss[a.en]||0)).slice(0,25);

 runQuiz(m.querySelector('#q'),mixQs(ws),(s,wrong,review)=>{noteMissed(wrong);addXP(s*2);screen('Recapitulare',`<div class="card"><div class="eyebrow">Recapitulare</div><div class="big">${s}/${ws.length}</div><p class="muted">Traducere, scriere și pronunție amestecate. Cuvintele greșite revin mai des la următoarea recapitulare.</p></div><button class="btn wide" data-go="review">Încă o recapitulare</button><button class="btn ghost wide" data-go="home">Acasă</button>${review}`)});

async function generate(ctx,out,onDone,onFail){
 const t=ctx.topic?TOPICS.find(x=>x.id===ctx.topic):null;const lv=st.level||'B1';
 const about=t?`din domeniul „${t.t}”${t.g!=='Subiectul tău'?' ('+t.g+(t.d?': '+t.d:'')+')':''}, termeni folosiți efectiv de profesioniști, potriviți pentru un elev de nivel ${lv}`:`de vocabular general, nivel ${ctx.level} (CEFR), cuvinte foarte folosite în conversație`;
 const avoid=ALLW.map(w=>w.en).join(', ');
 const prompt=`Ești profesor de engleză pentru vorbitori de limba română. Generează exact 10 cuvinte sau expresii englezești ${about}.
Pentru fiecare dă: "en" = termenul în engleză (fără articol, litere mici în afară de acronime), "ro" = traducerea în română, așa cum o folosesc specialiștii români (scurt), "ex" = o propoziție exemplu naturală în engleză, maxim 12 cuvinte, fără ghilimele.
Nu folosi niciunul dintre aceste cuvinte, sunt deja în aplicație: ${avoid}
Răspunde doar cu un array JSON, de forma: [{"en":"...","ro":"...","ex":"..."}]`;
 out.innerHTML='<p class="small muted">Claude pregătește cuvintele…</p>';
 try{
  const arr=await sampleFn.json(prompt,{cache:false});let added=0;
  if(Array.isArray(arr))for(const x of arr){
   if(!x||typeof x.en!=='string'||typeof x.ro!=='string'||typeof x.ex!=='string')continue;
   const w={en:x.en.trim().slice(0,60),ro:x.ro.trim().slice(0,80),ex:x.ex.trim().slice(0,160)};if(!w.en||!w.ro||!w.ex)continue;
   if(t)w.tp=t.id;else w.lv=ctx.level;
   if(attachWord(w)){st.custom.push(w);added++}}
  save();
  if(added){out.innerHTML=`<div class="verdict ok">Am adăugat ${added} cuvinte noi.</div>`;setTimeout(onDone,600)}
  else{out.innerHTML='<div class="verdict bad">Nu am primit cuvinte noi. Încearcă din nou.</div>';onFail&&onFail()}
 }catch(e){
  const msg={not_granted:'Nu ai permis aplicației să folosească Claude.',rate_limited:'Prea multe cereri acum. Încearcă peste câteva minute.',sampling_disabled:'Claude nu e disponibil pentru acest cont.',invalid_json:'Răspunsul nu a venit în formatul corect. Încearcă din nou.'}[e&&e.code]||'Nu am putut genera acum. Încearcă din nou.';
  out.innerHTML=`<div class="verdict bad">${msg}</div>`;onFail&&onFail()}
}

R.gBuild=()=>{

  card.innerHTML=`<div class="prog"><span style="width:${i/ws.length*100}%"></span></div><div class="qn">Propoziția ${i+1} din ${ws.length} · cu <b>${esc(ws[i].en)}</b> (${esc(ws[i].ro)})</div>

  card.querySelectorAll('#bank .tok').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(!pick.includes(k)){pick.push(k);draw()}});
  card.querySelector('#clr').onclick=()=>{pick.length=0;draw()};
  chk.onclick=()=>{const built=pick.map(k=>toks[k]).join(' ');const good=norm(built)===norm(sent);if(good)ok++;
   const fb=card.querySelector('.fb');chk.disabled=true;card.querySelectorAll('.tok').forEach(b=>b.disabled=true);
   fb.innerHTML=`<div class="verdict ${good?'ok':'bad'}">${good?'Corect!':'Corect era: '+esc(sent)}</div><div id="sp"></div><button class="btn wide" id="nx">Următoarea</button>`;
   say(sent);pron(fb.querySelector('#sp'),sent,{});fb.querySelector('#nx').onclick=()=>{i++;step()}};
 }
 step();

/* fiecare etichetă: [număr, termen englez, x,y punct, x,y bulină, formă pentru evidențiere] */
